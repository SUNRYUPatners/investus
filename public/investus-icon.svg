<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141852"/>
      <stop offset="100%" stop-color="#0a0c2e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Diagonal light streaks -->
  <rect x="-300" y="-60" width="1100" height="55" rx="0"
        transform="rotate(-38 256 256)"
        fill="#ffffff" fill-opacity="0.04"/>
  <rect x="-300" y="60" width="1100" height="30"
        transform="rotate(-38 256 256)"
        fill="#ffffff" fill-opacity="0.025"/>
  <rect x="-300" y="180" width="1100" height="18"
        transform="rotate(-38 256 256)"
        fill="#ffffff" fill-opacity="0.015"/>

  <!-- ===== LIGHTBULB / ANTENNA (left, center ~158, 248) ===== -->

  <!-- Signal arc 1 (small, r≈30) from center 158,230 -->
  <path d="M 133,245 A 30,30 0 0,1 183,245"
        fill="none" stroke="#00ff7a" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Signal arc 2 (medium, r≈52) -->
  <path d="M 113,260 A 52,52 0 0,1 203,260"
        fill="none" stroke="#00ff7a" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Signal arc 3 (large, r≈74) -->
  <path d="M 92,277 A 74,74 0 0,1 224,277"
        fill="none" stroke="#00ff7a" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Center dot (bright white core + green halo) -->
  <circle cx="158" cy="238" r="12" fill="#00ff7a" fill-opacity="0.3" filter="url(#glow)"/>
  <circle cx="158" cy="238" r="7"  fill="#ffffff"/>
  <circle cx="158" cy="238" r="4"  fill="#00ff7a"/>

  <!-- Vertical stem -->
  <line x1="158" y1="250" x2="158" y2="308"
        stroke="#00ff7a" stroke-width="9" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Connector block upper -->
  <rect x="136" y="310" width="44" height="15" rx="6" fill="#00ff7a" filter="url(#softglow)"/>
  <!-- Connector block lower -->
  <rect x="143" y="328" width="30" height="12" rx="5" fill="#00ff7a" filter="url(#softglow)"/>

  <!-- ===== CONNECTOR DOTS ===== -->
  <circle cx="236" cy="272" r="6" fill="#00dd65" fill-opacity="0.85"/>
  <circle cx="256" cy="272" r="6" fill="#00dd65" fill-opacity="0.85"/>
  <circle cx="276" cy="272" r="6" fill="#00dd65" fill-opacity="0.85"/>

  <!-- ===== CIRCLE ARC (right, opens on left) ===== -->
  <!-- Center: (372,272), radius: 112 -->
  <!-- Gap on left: from 210° to 150° (gap spans 60°) -->
  <!-- 210°: (372+112*cos210°, 272+112*sin210°) = (372-97, 272-56) = (275, 216) -->
  <!-- 150°: (372+112*cos150°, 272+112*sin150°) = (372-97, 272+56) = (275, 328) -->
  <!-- Arc sweeps 300° clockwise from (275,216) to (275,328) -->
  <path d="M 275,216 A 112,112 0 1,1 275,328"
        fill="none" stroke="#00ff7a" stroke-width="10" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- ===== DOLLAR SIGN ===== -->
  <!-- Vertical bar -->
  <line x1="372" y1="192" x2="372" y2="352"
        stroke="#00ff7a" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <!-- S-curve: top arch -->
  <path d="M 405,222 C 405,200 338,200 338,228 C 338,256 406,256 406,284 C 406,312 338,312 338,290"
        fill="none" stroke="#00ff7a" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
