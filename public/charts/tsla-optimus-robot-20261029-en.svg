  <text x="108" y="566" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Workers: 24lb suit, 40 cameras + 3D sensor grid</text><text x="108" y="600" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Mirror robot motions → ultra-dense data capture</text><text x="108" y="634" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">3 shifts, 24/7 — non-stop data pipeline</text><text x="108" y="668" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Multiple teams, each working independently (siloed)</text><text x="108" y="702" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Home team: sandwich making, daily activities</text><text x="108" y="736" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">Factory team: HVAC install, industrial tasks</text>
