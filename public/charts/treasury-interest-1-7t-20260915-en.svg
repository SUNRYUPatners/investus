<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0a0a"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="100%" style="stop-color:#dc2626"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="165" height="38" rx="19" fill="#ef444430" stroke="#ef4444" stroke-width="1.5"/>
  <text x="122.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#ef4444" text-anchor="middle">US TREASURY</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.15</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">US Treasury interest costs could hit $1.7 trillion a year by</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Nov 2028, topping Social Security spending</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">💵</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#ef4444" text-anchor="middle">$1.7T</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">BofA's projection for annual US government interest costs if current rates persist through</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">November 2028.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">If rates fall</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">$1.4T</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">5-yr yield down to ~3.25%</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#ef4444" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#ef4444" text-anchor="middle">If rates hold</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#ef4444" text-anchor="middle">$1.7T</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">At current rate levels</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">📊</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle">Social Security</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Largest outlay</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Interest could exceed it</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🏛</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle">Rollover</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Old low-rate debt</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Replaced with high-rate debt</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">🗓</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle">Sept FOMC</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">This week</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Next signal on rate path</text>
  <rect x="60" y="722" width="960" height="142" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="768" font-family="Arial" font-size="17" fill="#ef4444" text-anchor="middle">Governments pay interest on borrowed money just like individuals. Bigger debt plus higher rates means a</text>
  <text x="540" y="791" font-family="Arial" font-size="17" fill="#ef4444" text-anchor="middle">bigger total bill.</text>
  <rect x="60" y="874" width="960" height="168" rx="14" fill="#1c0d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="540" y="904" font-family="Arial" font-size="18" fill="#ef4444" text-anchor="middle">Why it matters</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The $300B gap between the two scenarios is the cost of keeping rates elevated. This week’s FOMC decision is the</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">next variable to watch.</text>
  <text x="540" y="1056" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">US Treasury · Interest Costs · 2026.09.15</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>