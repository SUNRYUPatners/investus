  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.28</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Micron adds $10B for US AI and advanced computing</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">research labs</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="230" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#94a3b8" text-anchor="middle">$10B</text>
  <text x="540" y="280" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">An additional $10B goes to US research labs for AI and advanced computing, on top of a prior</text>
  <text x="540" y="306" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">$250B commitment.</text>
  <rect x="80" y="320" width="920" height="240" rx="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="400" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">"Micron will add $10B for US research labs focused on AI and advanced</text>
  <text x="540" y="430" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">computing. The amount sits on top of a previously announced $250B</text>
  <text x="540" y="460" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">commitment and goes to research capability rather than production lines."</text>
  <rect x="120" y="590" width="400" height="120" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#94a3b8" text-anchor="middle">$10B</text>
  <text x="320" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Research labs</text>
  <rect x="560" y="590" width="400" height="120" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#94a3b8" text-anchor="middle">$250B</text>
  <text x="760" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Prior commitment</text>
  <rect x="60" y="740" width="960" height="200" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="780" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Why this matters</text>
  <text x="540" y="820" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Memory is a bottleneck alongside compute in AI servers. Research spending leads next generation competitiveness but</text>
  <text x="540" y="844" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">takes time to show in earnings, so track the spending schedule and the high bandwidth memory mix.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">MU · $10B research labs · 2026.08.28</text>
