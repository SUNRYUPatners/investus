  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Joe Tegtmeyer "Terafab 총 부지 3,020 헥타르(7,464 에이커)</text>
