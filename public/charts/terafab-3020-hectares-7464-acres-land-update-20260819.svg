  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Total site area is estimated at 7,464 acres or 3,020 hectares · in the final process of being recorded ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">around 2,000 to 3,000 acres (810 to 1,500 hectares) will need to be purchased for the final site ·</text>
