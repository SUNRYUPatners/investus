  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Joe Tegtmeyer의 Terafab 건설 부지 &amp; 토지 업데이트에 따르면 사이트 총 부지가 약 7,464</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">에이커(3,020 헥타르)로 최종 기록 절차 중이며, 최종 사이트를 위해 추가 약 2,000-3,000</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">에이커(810-1,500 헥타르) 매입이 필요합니다. Gibbons Creek Reservoir 동쪽 지역에서 이미 토지</text>
