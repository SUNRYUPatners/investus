  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">영역입니다. 계약은 7월 28일에 이뤄져 8월 25일 공개됐고, 연장 선택권 행사 여부가 매출 가시성을 결정합니다.</text>
