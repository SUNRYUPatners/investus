  <text x="540" y="680" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">"군용기용 위성통신이 스페이스X 단독 공급으로 발주됐습니다. 전 세계 지역 제한 없는 통신과 하향 500Mbps,</text>
