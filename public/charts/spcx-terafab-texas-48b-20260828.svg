  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">우주군이 군용기 위성통신을 스페이스X 단독으로 발주하고 하향</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">500Mbps 속도를 명시했습니다</text>
