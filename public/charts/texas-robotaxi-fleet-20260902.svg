  <rect x="40" y="20" width="110" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.02</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">텍사스 로보택시 차량이 5일 만에 124대 늘어 누적 314대에</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">도달했습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">🚕</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#4ade80" text-anchor="middle">+124 / 5일</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">사이버캡 7→45대, 모델Y 269대. 9월 3일 오스틴 사이버캡 행사 직전 fleet 확장 속도가 가시화됐습니다.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">5일 전</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">190대</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">누적 차량이 더 적었습니다</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#4ade80" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">9/1 기준</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#4ade80" text-anchor="middle">314대</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">124대가 새로 추가됐습니다</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">🚗</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">45</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">사이버캡</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">7대에서 45대로 증가</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🚙</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">269</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">모델Y</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">기존 차량 기반 fleet</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">📅</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">9/3</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">오스틴 행사</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">전용 무인 차량 공개</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">로보택시 fleet(차량 대수)는 「언젠가 상용화」가 아니라 「지금 몇 대가 도로에 있는가」로 읽힙니다. 5일 만에 124대</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">증가는 배치 속도가 빨라지고 있다는 신호입니다. 사이버캡 비중이 7→45로 늘었다는 점은 전용 차량 비중도 함께</text>
  <text x="540" y="826" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">올라가고 있음을 보여 줍니다.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">차량 수는 허가 범위·안전 기록·무인 운행 비율과 함께 봐야 합니다. 9월 3일 행사 전후로 fleet 숫자가 또 바뀔 수 있으니, 일별</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">추이와 운행 구역 지도를 함께 추적하시면 됩니다. 장기적으로는 마일당 비용과 차량 가동률이 fleet 규모만큼 중요합니다.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 텍사스 로보택시 · 2026.09.02</text>
