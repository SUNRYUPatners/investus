  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">🧪</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">Oct 1</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Post-mediation is extra talks after the official clock. The Sept 22 second round brought no extra</text>
  <text x="540" y="369" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">company offer.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="396" width="300" height="196" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">📋</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#60a5fa" text-anchor="middle">18</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Core issues</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The union narrowed its list</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">👤</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#60a5fa" text-anchor="middle">Decision-maker</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Due at the third round</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A CEO-level seat was requested</text>
  <rect x="720" y="396" width="300" height="196" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="870" y="448" font-family="Arial" font-size="40" text-anchor="middle">🚩</text>
  <text x="870" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#60a5fa" text-anchor="middle">Ready</text>
  <text x="870" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Industrial action</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A date is promised if no offer lands</text>
  <rect x="60" y="610" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="656" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">The union is said to want 6.5% plus ₩3 million and a 3% merit raise. The company line is cited at</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">4.1% and 2.1% merit.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A large CDMO lives on plant uptime. An Oct 1 offer turns talks into a calendar. Session weakness and the mediation</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">sit on different lines.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Samsung Biologics · Labor · 2026.09.23</text>
