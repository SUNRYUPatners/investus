  <text x="540" y="872" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">협력사 원가가 내려가면 완성차 이익률에 시차를 두고 도움이 되고, 반대로 협력사가 버티지 못하면 완성차 생산도</text>
