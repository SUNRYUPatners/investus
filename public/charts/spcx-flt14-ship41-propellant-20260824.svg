  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">잔여 추진제</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="688" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">"Cosmos Europa는 Flight 14가 13보다 어렵다고 했다. Ship 41은 초속 약 7.8km로 궤도에 들어가 한 바퀴</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">돌고 재진입하며, 추진제를 남긴다. 추진제 적재는 약 1,000–1,100톤으로 Ship 40의 800–900톤보다 많다.</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">08-22 리포트의 NET 9월 15일과 같은 비행축이다."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.24</text>
  <rect x="60" y="838" width="960" height="140" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">탱크를 더 채우는 것은 페이로드·재사용 마진을 키우는 실험이다. 실패하면 NET 날짜가 밀리고 Starlink 대량 배치 신뢰도가 흔들린다.</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">성공하면 11,040기 이후 배치 속도 논거가 살아난다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · FLT-14 Ship 41 · 2026.08.24</text>
