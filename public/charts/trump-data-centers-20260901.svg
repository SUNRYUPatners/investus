  <rect x="329.5" y="166" width="421" height="46" rx="23" fill="#94a3b818" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#94a3b8" text-anchor="middle">🏛️ Let Data Reign · 미국 5,375개 DC</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🏢</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#94a3b8" text-anchor="middle">5,375</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">AI·클라우드 경쟁은 칩에서 데이터센터 부지·전력·허가로 이동하고 있습니다. 미국이 시설 수에서 앞서지만</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">전력·송전 병목은 남아 있습니다.</text>
