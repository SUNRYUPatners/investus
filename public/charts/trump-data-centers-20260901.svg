  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">「Let Data Reign」 논의와 미국 5,375개 데이터센터가 세계 1위라는</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">집계가 겹쳤습니다</text>
