  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">부지·환경·용수</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">데이터센터(Data Center)는 AI·클라우드 서버를 모아 두는 건물·단지입니다. 미국 5,375개는 세계에서 가장</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">많은 편이며, 「Let Data Reign」은 데이터·AI 인프라를 국가 경쟁력으로 부각하는 정치적 메시지로 읽힙니다.</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">시설 수가 많아도 전력·변압기·송전 연결은 별도 병목입니다.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">투자자는 「몇 개가 있는가」보다 「몇 GW가 전원 투입됐는가」를 봐야 합니다. 정책 발언은 허가 속도·세제·전력 우선순위에 영향을 줄</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">수 있습니다. 다음에는 지역별 DC 허가·전력 대기열·클라우드 capex를 함께 추적하시면 됩니다. 칩 주문과 DC 가동 시점의 gap이</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">2026~27년 핵심 변수입니다.</text>
