  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Lyft opened Nashville robotaxi in Google-owned Waymo cars</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">as LYFT fell to $14.90 (−8.25%)</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#4ade8018" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">🚕 Nashville · Waymo</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">📉</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">−8.25%</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Lyft is the ride app; Waymo is Google’s robotaxi unit. After a Nashville tie-up using Waymo cars,</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Lyft stock printed $14.90 (−8.25%).</text>
