  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">대수는 공급 신호입니다. 유료 마일·사고율과는 칸을 나누시기 바랍니다.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">정의(등록·운행)가 같은지 확인한 뒤 점유율을 적으시기 바랍니다.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">9월 8일 텍사스 표는 「누가 더 많은 차를 돌리는가」의 스냅샷입니다. 대수와 유료 마일·사고율은 다른 칸입니다. 테슬라</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">432는 웨이모 988과 같은 정의(등록·운행)인지 확인이 필요합니다.</text>
