  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">자율주행 플릿은 도로에 등록·운행 중인 차량 대수를 세는 표입니다. 같은 날 애브라이드 344대·죽스 44대도 함께</text>
