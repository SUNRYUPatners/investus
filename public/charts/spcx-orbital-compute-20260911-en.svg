  <text x="870" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">calendar</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">On the ground, power and permits bottleneck. Compute in orbit can route around that. Next:</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">which rocket carries the first satellite.</text>
