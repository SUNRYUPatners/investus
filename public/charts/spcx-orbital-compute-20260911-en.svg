  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">💻</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#c084fc" text-anchor="middle">Next y</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The screen said the CFO plans to launch the first orbital-compute satellites next year. Orbital</text>
