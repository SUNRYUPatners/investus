  <text x="540" y="872" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A first satellite is a demo that it works. Cooling and the downlink remain homework. Over 3–5 years a working demo</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">can move some demand that outgrew terrestrial power into space.</text>
