  <text x="540" y="618" font-family="Arial" font-size="19" fill="#fdba74" text-anchor="middle">"셀을 만드는 회사(삼성SDI·LG에너지솔루션)와 소재를 만드는 회사(LG화학)가 같은 날 함께</text>
  <text x="540" y="646" font-family="Arial" font-size="19" fill="#fdba74" text-anchor="middle">올랐다는 점이 오늘의 특징입니다. 한 종목만 오르면 개별 재료지만, 셀과 소재가 같이 오르면</text>
  <text x="540" y="674" font-family="Arial" font-size="19" fill="#fdba74" text-anchor="middle">업종 전체에 대한 기대가 바뀌었다는 뜻으로 읽습니다. 양극재는 배터리에서 전기를 내보내는</text>
  <text x="540" y="702" font-family="Arial" font-size="19" fill="#fdba74" text-anchor="middle">쪽의 핵심 재료로, 셀 주문이 늘면 소재 주문도 따라 늘어나는 구조입니다. 다만 하루 10%대</text>
  <text x="540" y="730" font-family="Arial" font-size="19" fill="#fdba74" text-anchor="middle">상승에는 공매도 환매 같은 수급 요인도 섞이곤 합니다."</text>

  <rect x="60" y="778" width="960" height="146" rx="14" fill="#1a1005" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="808" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">2차전지는 그동안 전기차 수요 둔화 우려로 눌려 있던 업종입니다. 그 업종이 금리 인상일에 반도체보다 더 크게</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">올랐다는 것은, 자금이 반도체 한 곳에만 머물지 않고 옆 업종으로 번지기 시작했다는 신호로 볼 수 있습니다.</text>
  <text x="540" y="886" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">다만 하루 급등은 수급 되돌림도 잦습니다. 다음에는 수주 공시, 미국·유럽 전기차 판매, 양극재 판매 단가가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">같은 방향으로 움직이는지를 확인하시면 오늘 상승의 성격을 구분하실 수 있습니다.</text>
  <text x="540" y="992" font-family="Arial" font-size="15" fill="#374151" text-anchor="middle">2차전지 · 삼성SDI +10.27% · LG에너지솔루션 +5.56% · LG화학 +4.17% · 2026.08.27</text>
