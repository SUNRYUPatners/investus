  <text x="540" y="104" font-family="Arial Black,Arial" font-size="29" font-weight="900" fill="#f9fafb" text-anchor="middle">삼성SDI가 10% 넘게 오르며 2차전지와 소재가 함께 뛰었습니다</text>
