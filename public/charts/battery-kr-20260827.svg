  <text x="760" y="288" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">하루 변동으로는 이례적으로 큰 폭입니다</text>

  <rect x="60" y="354" width="300" height="196" rx="16" fill="#1a1005" stroke="#fb923c" stroke-width="2"/>
