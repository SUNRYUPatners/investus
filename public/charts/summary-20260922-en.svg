  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Supervised FSD is approved in Czechia and rollout starts soon</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">Tesla Europe posted it. An EU-wide vote is still ahead.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">Czechia</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">Grok 4.7 launched at the same price with higher scores</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Input is $2 and output $6 per million tokens, matching 4.6.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">4.7</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Meta announced Petal, a US–France undersea cable</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">One petabit per second over about 7,000 km, targeted for 2029.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">1 Pbps</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">An interview said Cybercab costs 25 cents a mile; Tesla keeps…</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">Those figures are from a talk, not a company filing.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">25¢</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">Half of S&amp;P 500 stocks sat below their 200-day average</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">The thinnest breadth since early April.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">49.5%</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Musk said full Starship reuse is extremely likely next year</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">The design can do it. The calendar is still a goal.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">2027</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: orbital Starship · Czech FSD · Grok 4.7 · Petal cable · Cybercab cost · 49.5% breadth · reuse 2027</text>
