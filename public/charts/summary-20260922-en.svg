  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Musk said the first orbital Starship will carry operational…</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">Booster 21 is on the pad. The date still needs a license.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">7 days</text>
