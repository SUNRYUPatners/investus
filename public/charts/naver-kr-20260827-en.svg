<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">NAVER</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS KR DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.27</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="29" font-weight="900" fill="#f9fafb" text-anchor="middle">Naver rose 1.59% to 216,500 won and led the platform group</text>
  <line x1="80" y1="122" x2="1000" y2="122" stroke="#1f2937" stroke-width="1"/>

  <rect x="316" y="136" width="448" height="44" rx="22" fill="rgba(74,222,128,.12)" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="165" font-family="Arial" font-size="18" fill="#86efac" text-anchor="middle">🟢 Ad recovery and AI hopes landed on the same day</text>

  <text x="540" y="250" font-family="Arial" font-size="56" text-anchor="middle">🔎</text>
  <text x="540" y="308" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#4ade80" text-anchor="middle">216,500 KRW · +1.59%</text>

  <rect x="60" y="336" width="300" height="56" rx="28" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="210" y="372" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">Advertising recovery</text>
  <rect x="390" y="336" width="300" height="56" rx="28" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="540" y="372" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">Commerce volume</text>
  <rect x="720" y="336" width="300" height="56" rx="28" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="870" y="372" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">AI-powered search</text>

  <rect x="60" y="412" width="460" height="180" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="290" y="464" font-family="Arial" font-size="34" text-anchor="middle">📢</text>
  <text x="290" y="506" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">Advertising is the base</text>
  <text x="290" y="540" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Search and display ads carry most of the revenue.</text>
  <text x="290" y="568" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Ad budgets rise early in a recovery.</text>

  <rect x="560" y="412" width="460" height="180" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="790" y="464" font-family="Arial" font-size="34" text-anchor="middle">🛒</text>
  <text x="790" y="506" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80" text-anchor="middle">Commerce is a fee business</text>
  <text x="790" y="540" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">More shopping volume means more commission.</text>
  <text x="790" y="568" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Split volume from take rate when you track it.</text>

  <rect x="60" y="610" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="654" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">"Naver rose 1.59% to 216,500 won. It is a smaller move than chips or batteries, but it</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">matters that a platform stock gained on a rate-hike day. Higher rates normally hurt platform</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">shares because future profits are discounted more heavily. Rising anyway suggests that ad</text>
  <text x="540" y="738" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">recovery and AI service expectations outweighed the rate drag. One session is still just one</text>
  <text x="540" y="766" font-family="Arial" font-size="19" fill="#86efac" text-anchor="middle">session, so avoid calling a trend from a single day."</text>

  <rect x="60" y="808" width="960" height="146" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="838" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why this matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Naver sits inside the KOSPI's top-ten by market value, so its direction works as a read on domestic demand</text>
  <text x="540" y="892" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">and the advertising cycle. Chips and autos move on exports; Naver moves on Korean consumption and corporate</text>
  <text x="540" y="916" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">ad budgets. Next, check quarterly ad revenue growth, shopping transaction volume, and whether AI services</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">convert into paid usage, to see if today's gain turns into earnings.</text>
  <text x="540" y="1000" font-family="Arial" font-size="15" fill="#374151" text-anchor="middle">NAVER · 216,500 KRW +1.59% · 2026.08.27</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr · SRP CHIEF INVESTMENT OFFICER · NOT FINANCIAL ADVICE</text>
</svg>
