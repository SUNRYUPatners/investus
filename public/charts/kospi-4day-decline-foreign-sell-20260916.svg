  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">코스피가 다시 밀린 이유</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">미국 10년물 국채금리가 2007년 이후 최고 수준까지 오르며 부담을 줬습니다.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">사우디·리비아 공급 차질 우려로 국제유가가 4개월 만에 최고치로 뛰었습니다.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">장중 6,715.46까지 반등했지만 오후 들어 매물에 밀려 6,582.20까지 내렸습니다.</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#0a1a26" stroke="#38bdf8" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">개인과 기타법인이 각각 8,319억 원, 1조6,430억 원을 순매수하며 하단을 받쳤지만 외국인·기관의 동반 매도를 다 막지는</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">못했습니다. 대신증권은 코스피 6,600선이 올해 평균 PBR 기준 의미 있는 지지 구간이라고 짚었습니다. 다음 거래일에도 외국인</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">매도가 이어지는지 확인하면 됩니다.</text>
