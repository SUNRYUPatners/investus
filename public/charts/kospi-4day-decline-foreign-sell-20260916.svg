  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">홀로 매수</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">하락 방어에는 역부족</text>
