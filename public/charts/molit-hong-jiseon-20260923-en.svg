<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#120b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">MOLIT</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.23</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">The new land minister put housing stability and faster</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">new-town starts first</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#a78bfa18" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="middle">Inaugural · Sept 23</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🏛️</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#a78bfa" text-anchor="middle">Housing first</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Hong Jiseon said supply gaps, rental stress and household debt are locked together. He called for</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">field-first, practical policy.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">🏗️</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">New towns</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">And urban sites</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">He pledged to follow starts through</text>
  <text x="210" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">move-in</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">🏠</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">Rentals</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Private long-term and public</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Jeonse stress and young households</text>
  <text x="540" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">were named</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">🛡️</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">Deposits</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Jeonse fraud</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">He said deposits and daily life must</text>
  <text x="870" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">be kept</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">Supply must not stay a plan total. He promised a multi-layer local council and a permit fast</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">track.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When a minister names starts, plans can become a calendar. An inaugural speech is not a target. Next: the permit</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">fast track and start dates.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">MOLIT · Inaugural · 2026.09.23</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>