  <rect x="40" y="20" width="149" height="38" rx="19" fill="#f59e0b30" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="114.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle">HANMI SEMI</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Hanmi Semiconductor secured a deal to supply advanced</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">packaging gear for the Terafab AI chip line</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="86" font-weight="900" fill="#f59e0b" text-anchor="middle" opacity=".15">🇰🇷</text>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#f59e0b" text-anchor="middle">🇰🇷</text>
  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">Terafab Supply Deal</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Terafab is Elon Musk’s envisioned giant chip and data-center project. Hanmi becomes the</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">first Korean back-end equipment maker to join its supply chain.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">🥇</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">First for Korea</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Terafab back-end equipment</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">First Korean supplier</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🔗</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">After HPSP</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Front-end order in June</text>
  <text x="540" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Hanmi follows for back-end</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📦</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">Advanced packaging</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Chip-stacking process</text>
  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">For the Terafab AI chip line</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">Reports said: "Hanmi Semiconductor has secured a deal to provide advanced packaging equipment</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">for Terafab’s AI chip production line...the first Korean back-end equipment maker," following</text>
  <text x="540" y="734" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">HPSP’s front-end order in June.</text>
  <rect x="60" y="838" width="960" height="172" rx="14" fill="#201408" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#f59e0b" text-anchor="middle">Why it matters</text>
  <text x="540" y="896" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Packaging stacks chips into layers to boost performance, now a key battleground in AI chip competition. A Korean</text>
  <text x="540" y="918" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">equipment maker entering a project as massive as Terafab signals the standing of Korea’s chip-equipment industry.</text>
  <text x="540" y="1028" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Hanmi Semiconductor · Terafab · 2026.09.17</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
