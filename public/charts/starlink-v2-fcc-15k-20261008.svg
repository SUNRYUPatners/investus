  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">배경 및 맥락</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">스타링크 V2 Mini는 팰컨9 재사용으로 발사되는 2세대 위성이다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">기존 V1 대비 용량이 획기적으로 향상됐고, 5G 커버리지까지 목표한다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">T-모바일 파트너십으로 스마트폰과 직접 연결하는 위성 셀룰러 가능.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">데드존 해소에서 완전한 5G 통신망 구축으로 목표가 격상됐다.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 승인 15,000기와 현재 궤도 650기는 다른 칸 — 배치 일정을 따로 확인</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#120b28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#a78bfa">핵심 포인트</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">V2 전면 배치 시 스타링크 수익성과 기업가치에 직접 영향을 준다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">150 Mbps 목표는 V2가 V1 대비 100배 대역폭임을 체감 지표로 표현.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">T-모바일 파트너십은 지상 기지국 없이 커버리지 확장의 경로다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">구독 단가 인상과 가입자 규모 확대가 동시에 가능한 구조다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#7c3aed">V2 배치 첫 발사 일정이 나오면 투자 논거가 금액으로 내려온다.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · SPCX · Starlink V2</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">100배와 150 Mbps는 다른 개념 — 전자 비율, 후자 이용자 체감 목표</text>
