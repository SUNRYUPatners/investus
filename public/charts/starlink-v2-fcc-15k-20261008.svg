  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">이미 배치 완료</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">V2 모바일 전용</text>
