  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">💬 20¢/mi · under $30k</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">💵</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">20¢</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">30–40 cents with tax versus about $1/mi for a bus. A shepherd would oversee 10–20 cars.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
