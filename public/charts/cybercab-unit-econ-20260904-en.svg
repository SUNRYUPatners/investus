  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">per mile</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Opex claim</text>
