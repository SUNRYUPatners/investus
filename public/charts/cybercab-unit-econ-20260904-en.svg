  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">Unit economics is whether one car earns money. Twenty cents a mile is an opex claim; under $30k</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">is a sticker goal. A shepherd remotely watches a small fleet.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Utilization, insurance, and deadhead miles can move the 20-cent figure. Bus comparisons need the same subsidy and</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">stop-cost denominator. Next checks are paid-mile share and actual transaction prices.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · unit economics · 2026.09.04</text>
