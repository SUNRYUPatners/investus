  <text x="870" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#4ade80" text-anchor="middle">29일</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">10억 마일</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">140억을 넘긴 뒤의 간격</text>
  <rect x="60" y="616" width="960" height="168" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="648" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">안전보고서가 말하는 속도</text>
  <text x="90" y="700" font-family="Arial" font-size="18" fill="#e5e7eb">지난달 140억 마일을 넘긴 직후, 8월 27일에 150억을 막 넘겼습니다.</text>
  <text x="90" y="734" font-family="Arial" font-size="18" fill="#e5e7eb">8월 31일 140억 다음 29일 만에 10억 마일이 더해졌습니다.</text>
  <text x="90" y="768" font-family="Arial" font-size="18" fill="#e5e7eb">지금은 29일마다 10억 마일이고, 구독료는 한 달에 99달러입니다.</text>
  <rect x="60" y="796" width="960" height="196" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="824" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="850" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">감독 완전자율주행은 사람이 운전석에 앉은 상태에서 소프트웨어가 운전하는 기능입니다. 안전보고서의 전체는</text>
  <text x="540" y="870" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">15,007,023,418마일이고, 도시만 따로 세면 5,843,156,839마일입니다. 같은 흐름의 합계로 15,000,508,571마일도 나옵니다.</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">기준 시각이 8월 27일과 8월 31일 이후로 며칠 다릅니다. 속도는 더 빨라지고 있고, 구독은 월 99달러입니다. 이 장부는 운전자가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">앉은 거리이고, 사람이 없는 영업 거리와는 다릅니다. 다음에 볼 것은 150억에서 160억까지 가는 간격이 29일보다</text>
