  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle">150억 마일</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">8월 27일 안전보고서입니다. 운전자가 앉은 채 차가 운전한 거리를 모두 더한 값입니다.</text>
