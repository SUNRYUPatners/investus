<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0c1017"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#94a3b8"/><stop offset="100%" style="stop-color:#64748b"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#94a3b830" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">MACRO</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.28</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">California’s governor signed a law barring meme coins that</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">use an official’s likeness</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">🏛</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">AB 2409</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">A meme coin is a small digital token made as a joke or fad. The law blocks coins that lift an official’s</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">face or name.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="386" width="300" height="210" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">📅</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">2027</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">It takes effect on January 1,</text>
  <text x="210" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">2027</text>
  <text x="210" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Not a this-year penalty</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">⚖</text>
  <text x="540" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">Civil</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">It is civil, not criminal</text>
  <text x="540" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Senate 40-0 and Assembly 78-0</text>
  <rect x="720" y="386" width="300" height="210" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="870" y="438" font-family="Arial" font-size="40" text-anchor="middle">📱</text>
  <text x="870" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">Platforms</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Venues must hide them from</text>
  <text x="870" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">California residents</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Official-likeness coins are the target</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">It is a first large state bar on joke coins that steal a public face. It does not ban every token.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="840" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Why it matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When a state law moves platforms, the joke-coin window narrows. This is one signing. Next, watch 2027 rules.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Macro · meme-coin law · 2026.09.28</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>