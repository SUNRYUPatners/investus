  <text x="116" y="608" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f97316">국제유가가 호르무즈 기대에 2%대 내렸지만 100달러대를 지킵니다</text>
  <text x="116" y="638" font-family="Arial" font-size="17" fill="#9ca3af">브렌트 104.61달러, WTI 100.05달러로 마감했습니다.</text>
