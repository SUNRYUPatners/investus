  <text x="116" y="462" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#facc15">금이 실질금리 부담에도 4,330~4,350달러권을 지키고 있습니다</text>
  <text x="116" y="492" font-family="Arial" font-size="17" fill="#9ca3af">미 10년물 금리 4.96%, 중동 긴장이 하락을 막고 있습니다.</text>
