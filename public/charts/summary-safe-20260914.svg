  <text x="116" y="900" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#94a3b8">이번 주 FOMC 결과가 안전자산 전체의 다음 방향을 정합니다</text>
  <text x="116" y="930" font-family="Arial" font-size="17" fill="#9ca3af">17일 새벽 결과가 공개되며 달러·금리 반응이 핵심입니다.</text>
  <text x="985" y="922" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">FOMC</text>
