  <text x="116" y="754" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">코인베이스 CEO "스테이블코인은 미 국채 구조적 매수자"</text>
  <text x="116" y="784" font-family="Arial" font-size="17" fill="#9ca3af">준비금의 상당 부분이 미국 단기 국채로 몰리고 있습니다.</text>
  <text x="985" y="776" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">국채</text>
