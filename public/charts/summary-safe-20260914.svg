  <text x="116" y="170" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f7931a">비트코인이 7만 7천 달러권에서 이번 주 FOMC를 기다립니다</text>
  <text x="116" y="200" font-family="Arial" font-size="17" fill="#9ca3af">코인마켓캡 7만 7,255달러, OKX 기준 7만 6,985달러로 갈렸습니다.</text>
  <text x="985" y="192" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f7931a" text-anchor="end">$77K</text>
