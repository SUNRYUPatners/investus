  <text x="116" y="316" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#818cf8">이더리움이 2,505달러로 비트코인보다 더 크게 밀렸습니다</text>
  <text x="116" y="346" font-family="Arial" font-size="17" fill="#9ca3af">비트코인 점유율은 커지고 이더리움 점유율은 낮아졌습니다.</text>
