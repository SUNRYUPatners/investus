  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🚀</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">$10B</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The post put a private mark near $10 billion. The same card listed 650-plus landings and 10 million-plus</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Starlink users.</text>
