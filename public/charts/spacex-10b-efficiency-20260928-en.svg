  <text x="870" y="545" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">reusable Starship</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">A line also said SpaceX acquired xAI</text>
  <rect x="60" y="616" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the screen says</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">$10 billion is a private-mark description</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">Landing count is the reuse backbone</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">It sits beside Blue Origin’s $30 billion in</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Reuse lowers launch cost and Starlink cash can follow. This is one screen. Next, watch Flight 14 tonight.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SpaceX · $10B · 2026.09.28</text>
