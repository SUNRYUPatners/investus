  <text x="540" y="680" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"The Cybercab front light bar changes color. The app assigns a color per ride so passengers can find</text>
  <text x="540" y="706" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">their car in a crowd. Gold test units were seen running green and orange strips."</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why this matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">With no driver to flag riders down, identification directly affects operations. Shorter pickup time raises how many</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">trips each car completes per day.</text>
