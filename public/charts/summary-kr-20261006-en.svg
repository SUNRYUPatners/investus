  <text x="116" y="754" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">SK Square closed at 1,160,000 won, up 0.43%</text>
  <text x="116" y="801" font-family="Arial" font-size="17" fill="#9ca3af">The fourth-largest name by value.</text>
  <text x="985" y="774" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">1.16M</text>
