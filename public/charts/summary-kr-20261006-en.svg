  <text x="116" y="316" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">Samsung Electronics closed unchanged at 276,000</text>
  <text x="116" y="363" font-family="Arial" font-size="17" fill="#9ca3af">Street Q3 operating profit sits near 109.5 trillion won.</text>
  <text x="985" y="336" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">276000</text>
