  <text x="116" y="900" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#22d3ee">Institutions bought 381.3 billion won</text>
  <text x="116" y="947" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners sold 136.7 billion. Individuals sold 1.72 trillion.</text>
  <text x="985" y="920" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">381bn</text>
