  <text x="116" y="170" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#38bdf8">KOSPI closed at 7,003.74, up 0.46%</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">It retook 7,000 from an open of 6,938.</text>
  <text x="985" y="190" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">7003</text>
