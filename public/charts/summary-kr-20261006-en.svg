  <text x="116" y="462" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f59e0b">SK hynix closed at 1,841,000 won, up 0.44%</text>
  <text x="116" y="509" font-family="Arial" font-size="17" fill="#9ca3af">Other corporations bought 905.3 billion won.</text>
  <text x="985" y="482" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">1.841M</text>
