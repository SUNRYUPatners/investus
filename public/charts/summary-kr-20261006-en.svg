  <text x="116" y="655" font-family="Arial" font-size="17" fill="#9ca3af">One of the stronger large-cap prints.</text>
  <text x="985" y="628" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">371000</text>
