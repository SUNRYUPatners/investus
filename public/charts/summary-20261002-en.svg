  <text x="116" y="268" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">About 11,153 Starlink satellites are now in orbit</text>
  <text x="116" y="302" font-family="Arial" font-size="16" fill="#9ca3af">The largest constellation. V3 is the next step.</text>
  <text x="985" y="282" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">11153</text>
  <rect x="60" y="342" width="960" height="100" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="342" width="8" height="100" rx="4" fill="#ef4444"/>
  <text x="116" y="378" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">Odds of a Fed hold on October 28 are 76.2%</text>
  <text x="116" y="412" font-family="Arial" font-size="16" fill="#9ca3af">A hike is 23.8%. Payrolls are tomorrow.</text>
  <text x="985" y="392" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">76.2%</text>
  <rect x="60" y="452" width="960" height="100" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
