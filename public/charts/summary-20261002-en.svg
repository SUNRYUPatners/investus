  <text x="116" y="488" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">Japan's 10-year yield is 3.1299%, a 30-year high</text>
  <text x="116" y="522" font-family="Arial" font-size="16" fill="#9ca3af">Up 0.0332 percentage points.</text>
  <text x="985" y="502" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">3.13%</text>
  <rect x="60" y="562" width="960" height="100" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="562" width="8" height="100" rx="4" fill="#4ade80"/>
  <text x="116" y="598" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">France's September Tesla registrations rose 61.9%</text>
  <text x="116" y="632" font-family="Arial" font-size="16" fill="#9ca3af">Sweden rose 38.4%. Tesla led Taiwan imports.</text>
  <text x="985" y="612" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">+61.9%</text>
  <rect x="60" y="672" width="960" height="100" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="672" width="8" height="100" rx="4" fill="#c084fc"/>
  <text x="116" y="708" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">81% of SpaceX stock is still locked</text>
  <text x="116" y="742" font-family="Arial" font-size="16" fill="#9ca3af">Another 5% unlocks on October 9 and 24.</text>
  <text x="985" y="722" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">81%</text>
  <rect x="60" y="782" width="960" height="100" rx="14" fill="#06121f" stroke="#4285f4" stroke-width="2"/>
  <rect x="60" y="782" width="8" height="100" rx="4" fill="#4285f4"/>
  <text x="116" y="818" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4285f4">Google sent four TPUs up on a Falcon 9</text>
  <text x="116" y="852" font-family="Arial" font-size="16" fill="#9ca3af">The first Project Suncatcher satellite.</text>
  <text x="985" y="832" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4285f4" text-anchor="end">4 TPUs</text>
  <rect x="60" y="892" width="960" height="100" rx="14" fill="#1a0e00" stroke="#ff9900" stroke-width="2"/>
  <rect x="60" y="892" width="8" height="100" rx="4" fill="#ff9900"/>
  <text x="116" y="928" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ff9900">Amazon bought 690 MW of nuclear power for 20 years</text>
  <text x="116" y="962" font-family="Arial" font-size="16" fill="#9ca3af">90 MW is new Calvert Cliffs capacity.</text>
  <text x="985" y="942" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ff9900" text-anchor="end">690MW</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">2.4 TWh · 11,153 Starlinks · Fed hold 76.2% · Japan 3.1299% · France +61.9% · 81% locked</text>
