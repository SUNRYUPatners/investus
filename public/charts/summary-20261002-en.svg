  <text x="116" y="158" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla charging delivered 2.4 TWh in the third quarter</text>
  <text x="116" y="192" font-family="Arial" font-size="16" fill="#9ca3af">69 million sessions, 2,700 new stalls, 1.1 billion liters saved.</text>
  <text x="985" y="172" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">2.4TWh</text>
