<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a1600"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#facc15"/><stop offset="100%" style="stop-color:#d4a017"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#facc1530" stroke="#facc15" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#facc15" text-anchor="middle">GOLD</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.29</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Spot gold fell more than $100 intraday and slipped below</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">$4,500 an ounce</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">🥇</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#facc15" text-anchor="middle">Below $4,500 an ounce</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The 24-hour decline was about 2.3%, undoing several days of gains in one session.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Aug 28, Asia hours</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">$4,580</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Buyers trimmed ahead of the speech</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#facc15" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#1c1805" stroke="#facc15" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#facc15" text-anchor="middle">Aug 29, overnight</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#facc15" text-anchor="middle">Under $4,500</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">It lost more than $100 intraday</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#1c1805" stroke="#facc15" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">📈</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">4.33%</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">US 2-year yield</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Up 10bp intraday</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#1c1805" stroke="#facc15" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🎯</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">$4,700</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Key resistance</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">It had approached that level</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#1c1805" stroke="#facc15" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">🛡️</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#facc15" text-anchor="middle">$4,530</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Key support</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">That zone is being tested</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#facc15" text-anchor="middle">Gold pays no interest, so a higher bond yield raises the cost of holding it. What matters is not the</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#facc15" text-anchor="middle">nominal yield but the real yield, which nets out inflation.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#1c1805" stroke="#facc15" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#facc15" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Gold fell on a rates story rather than a risk story. Still, the 10-day and 20-day moving averages remain in bullish</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">order, so the trend has not clearly broken. Watch real yields, the dollar index, and whether $4,530 support holds.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Gold · post Jackson Hole · 2026.08.29</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
