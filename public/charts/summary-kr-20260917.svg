  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#38bdf8">코스피가 5거래일 만에 반등해 6,717.97로 마감했습니다</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">전일보다 90.71포인트(1.37%) 올랐고, 기관이 1조2,117억 원을 순매수했습니다.</text>
