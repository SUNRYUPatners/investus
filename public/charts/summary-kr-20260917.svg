  <text x="116" y="706" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#34d399">삼성바이오로직스가 폴리펩타이드 공개매수에 들어갔습니다</text>
  <text x="116" y="742" font-family="Arial" font-size="17" fill="#9ca3af">10월 12일까지 진행되며 최대주주 55.65%가 응모를 확약했습니다.</text>
  <text x="985" y="732" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#34d399" text-anchor="end">2조7,000억</text>
