  <text x="116" y="881" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb7185">현대차는 36만2,000원으로 내려 반도체 강세와 갈렸습니다</text>
  <text x="116" y="917" font-family="Arial" font-size="17" fill="#9ca3af">지수 상승에도 하락 종목이 578개로 더 많았습니다.</text>
