  <text x="116" y="531" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f59e0b">SK하이닉스가 175만9,000원으로 올라 반등을 이끌었습니다</text>
  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">임단협 재합의안이 찬성 57.08%로 가결됐고 미국 생산 검토 소식도 나왔습니다.</text>
