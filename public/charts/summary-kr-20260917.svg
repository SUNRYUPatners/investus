  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">삼성전자가 25만3,500원으로 나흘 하락을 끊었습니다</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">외국인은 4,906억 원을 팔았지만 기관이 4,121억 원을 받아냈습니다.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">+2.01%</text>
  <rect x="60" y="472" width="960" height="165" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
