  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">산·터널처럼 지상망이 약한 곳(데드존)에서도 쓸 수 있다고 했습니다. 집 공유기 라우터 4와는…</text>
