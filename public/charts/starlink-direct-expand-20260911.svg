  <text x="540" y="736" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">휴대폰이 위성에 바로 붙으면, 로밍이나 산속 무음 구간을 위성이 메웁니다. 9월 28일은 그 커버가 일본 밖으로 나가는</text>
