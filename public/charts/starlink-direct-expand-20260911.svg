  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">화면에는 지구 사진과 소프트뱅크·스타링크 로고가 있고, 9월 28일 미국·캐나다·뉴질랜드에 먼저 열린 뒤 가을에</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">필리핀이 거론됐습니다. 다이렉트는 위성에서 휴대폰으로 바로 문자를 보내는 서비스입니다.</text>
