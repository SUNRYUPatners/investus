<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#06121f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="170" height="38" rx="19" fill="#60a5fa30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="125" y="44" font-family="Arial Black,Arial" font-size="15" font-weight="900" fill="#60a5fa" text-anchor="middle">SAMSUNG</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS KR DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.27</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Samsung Electronics rose 1.72% to 266,000 won as AI memory</text>
  <text x="540" y="142" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">demand outweighed the rate hike</text>
  <line x1="80" y1="158" x2="1000" y2="158" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="244" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#60a5fa" text-anchor="middle" opacity=".15">🧠</text>
  <text x="540" y="244" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#60a5fa" text-anchor="middle">🧠</text>
  <text x="540" y="304" font-family="Arial Black,Arial" font-size="46" font-weight="900" fill="#f9fafb" text-anchor="middle">266,000 KRW</text>
  <text x="540" y="344" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Up 1.72% on the day. A strong US AI-chip earnings print pushed server memory</text>
  <text x="540" y="370" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">demand expectations onto Korean semiconductor names.</text>
  <line x1="80" y1="392" x2="1000" y2="392" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="404" width="300" height="216" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="36" text-anchor="middle">💹</text>
  <text x="210" y="496" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa" text-anchor="middle">+1.72%</text>
  <text x="210" y="530" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Daily move</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Slightly ahead of the</text>
  <text x="210" y="590" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">KOSPI's ~1.53% gain</text>
  <rect x="390" y="404" width="300" height="216" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="36" text-anchor="middle">🏭</text>
  <text x="540" y="496" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa" text-anchor="middle">Server memory</text>
  <text x="540" y="530" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Demand engine</text>
  <text x="540" y="566" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">High-performance chips</text>
  <text x="540" y="590" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">that go into AI servers</text>
  <rect x="720" y="404" width="300" height="216" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="36" text-anchor="middle">🌍</text>
  <text x="870" y="496" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa" text-anchor="middle">Foreign flows</text>
  <text x="870" y="530" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Index thermometer</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A weaker won blunts the</text>
  <text x="870" y="590" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">impact of the same buying</text>

  <rect x="60" y="632" width="960" height="196" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">"Samsung Electronics closed at 266,000 won, up 1.72%. As the largest listed company in Korea,</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">it pulls the KOSPI along with it. Today's driver was not an earnings release but spillover</text>
  <text x="540" y="738" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">demand expectations after a US AI-chip maker beat estimates. Whether that expectation turns</text>
  <text x="540" y="766" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">into profit shows up in memory contract prices and monthly export data."</text>

  <rect x="60" y="846" width="960" height="120" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="876" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why this matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The key point is that Korea's biggest stock rose on the same day the central bank hiked for a second straight</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">meeting. Higher rates usually weigh on equities, but AI memory demand was the stronger force today. Hope</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">without profit tends to retrace, so track memory contract prices and monthly chip export growth next.</text>
  <text x="540" y="1000" font-family="Arial" font-size="15" fill="#374151" text-anchor="middle">Samsung Electronics · 266,000 KRW +1.72% · 2026.08.27</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr · SRP CHIEF INVESTMENT OFFICER · NOT FINANCIAL ADVICE</text>
</svg>
