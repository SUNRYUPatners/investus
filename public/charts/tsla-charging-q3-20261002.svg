  <text x="540" y="724" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">아끼지 않은 휘발유는 11억 리터이고, 피한 이산화탄소는 44억 킬로그램입니다. 분기 충전 세션은 6,900만</text>
