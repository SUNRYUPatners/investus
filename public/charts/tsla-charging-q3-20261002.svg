  <text x="540" y="676" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">이용률은 올라가는데, 기다리는 사람은 줄어들고 있습니다. 테슬라 충전망 3분기입니다. 슈퍼차저 칸</text>
