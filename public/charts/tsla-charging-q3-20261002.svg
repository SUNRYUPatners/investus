  <text x="540" y="912" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">7.0기가와트시는 전체 2.4테라와트시와 단위가 다릅니다. 호출 운행이 충전망 위에 올라오기 시작한 한 줄입니다. 다음 확인할 것은</text>
