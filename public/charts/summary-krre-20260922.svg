  <text x="116" y="635" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">정부가 2030년까지 공적주택 119만 호를 공급한다고 밝혔습니다</text>
  <text x="116" y="681" font-family="Arial" font-size="17" fill="#9ca3af">연평균 약 24만 호, 수도권 92만 호입니다.</text>
