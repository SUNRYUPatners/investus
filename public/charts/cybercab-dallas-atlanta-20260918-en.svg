<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.18</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Tesla Cybercabs were spotted in Dallas, Texas and Atlanta,</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Georgia</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="380" y="160" width="320" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">New city sightings</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#4ade80" text-anchor="middle">Dallas · Atlanta</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Cybercab is the wheel-and-pedal-free robotaxi. On top of Austin tests, units were caught on Dallas and</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Atlanta roads.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">📍</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Dallas</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Texas</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Same state as Austin,</text>
  <text x="176" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">new city</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">📍</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Atlanta</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Georgia</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">A Southeast hub city</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">🚘</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">No wheel</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Dedicated body</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Not a Model Y conversion</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">🌎</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Expansion</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">More test cities</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Data gathering before</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">paid rides</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">A sighting is road-data work, not a launch of paid service.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Inside Texas, a city after Austin is now clearly on the board.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">Robotaxis learn one city, then widen the map. Dallas is same-state expansion; Atlanta is a different-state</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">Southeast axis. Both landing on the same day’s feed is the story.</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="880" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">More cities make the mobility-revenue story more concrete. Sightings still lead paid rides by weeks or months. Next</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">is whether passenger permits show up in either city.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · Cybercab cities · 2026.09.18</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>