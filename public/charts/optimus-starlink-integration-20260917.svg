  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">테슬라의 인간형 로봇 옵티머스가 스타링크를 핵심 통신망으로 쓸</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">것이라는 관측이 나왔습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="220" y="166" width="640" height="46" rx="23" fill="#4ade8018" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"스타링크는 옵티머스에 선택이 아니라 필수다" — 그윈 숏웰 인용</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🤖</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">옵티머스는 스타링크를 씁니다</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">스타링크는 스페이스X의 위성 인터넷망입니다. 스페이스X 사장 숏웰의 9월 15일 발언에 따르면 옵티머스</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">두뇌의 일부가 이미 스타마인드(스타링크 기반 통신 체계)에 들어 있다는 것입니다.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">🧠</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">스타마인드</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">로봇 두뇌 일부</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">통신이 부가기능 아닌 핵심</text>
