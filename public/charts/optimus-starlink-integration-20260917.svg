  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">🔗</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">둘 다 가능</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">혼합 구성도 검토</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">아직 확정 방식은 비공개</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">숏웰은 "이건 단순한 연결성 이상이다. 옵티머스가 결심하면 네트워크는 더는 로봇이 연결하는 대상이 아니라</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">로봇의 일부가 된다"고 말했습니다.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">지금까지 스타링크는 주로 인터넷이 닿기 힘든 지역의 통신 수단으로 알려졌습니다. 로봇의 두뇌 통신망으로 쓰인다면 스타링크의</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">활용 범위가 가정·공장용 로봇까지 넓어질 수 있어, 스페이스X와 테슬라 두 회사의 접점이 한층 커지는 대목입니다.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">테슬라 · 옵티머스 · 스타링크 · 2026.09.17</text>
