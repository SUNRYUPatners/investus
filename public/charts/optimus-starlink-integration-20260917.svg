  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">📡</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">두 가지 방식</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">축소형 위성 단말 또는</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">5G→스타링크 중계</text>
