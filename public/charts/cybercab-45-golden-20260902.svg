  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">오스틴 사이버캡 45대, 지오펜스 약 264제곱마일, 9월 3일 행사</text>
