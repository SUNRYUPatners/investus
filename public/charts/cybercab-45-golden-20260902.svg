  <text x="540" y="776" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">등록 대수와 지오펜스 면적은 「상용화 속도」를 가늠하는 공개 지표입니다. D-1 구간은 기대가 최대일 때이므로 행사</text>
