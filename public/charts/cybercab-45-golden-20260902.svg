  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">골든 캡과 함께 지오펜스가 약 9% 확대됐습니다. 사이버캡은 운전석 없는 전용 로보택시 차량입니다.</text>
