  <text x="540" y="868" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">로보택시·에너지 스케일의 병목이 셀 화학이 아니라 양극재 공급망일 수 있다. 건식 공정은 공장 면적·</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">용제 비용을 줄이는 쪽이다. 허가(2022 Project Cathode)에서 실제 가동·수율까지가 다음 확인점이다.</text>
