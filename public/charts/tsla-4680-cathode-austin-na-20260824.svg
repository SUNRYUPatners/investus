  <text x="540" y="688" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"Tesla가 Austin에 4680용 북미 첫 대형 캐소드 공장을 연다고 했다. 캐소드는 배터리 양극재로, 세계 공급의 약</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">90%가 중국이다. 2025 수출통제 이후 현지화가 급해졌다. Tesla는 용매 슬러리 대신 건식 코팅을 쓰고, 풀 건식</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">전극은 2026년 1월 프레임이다."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.24</text>
