  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.14</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Starship V3's booster thrust is compared to lifting the</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Eiffel Tower's entire steel structure</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">🚀</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#c084fc" text-anchor="middle">20M lbs</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">That's the thrust of Starship V3's Super Heavy booster — comparable to lifting the Eiffel Tower's</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">roughly 7,300-ton steel frame.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Eiffel Tower</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">7,300t</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Total steel weight</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#c084fc" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">Super Heavy</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#c084fc" text-anchor="middle">20M lbs</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Booster thrust</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">🔥</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">Raptor</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">30+ engines</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Clustered on booster</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🛰</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">Mars</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Design goal</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Heavy cargo and crew</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">♻️</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">Reusable</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Booster and ship</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Goal: cut launch cost</text>
  <rect x="60" y="722" width="960" height="142" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="768" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">More than 30 Raptor engines firing together produce the largest thrust of any rocket humans have built.</text>
  <rect x="60" y="874" width="960" height="168" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="904" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">More thrust means more satellites, cargo, and people per launch. Starship was designed to carry crew and cargo all</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">the way to Mars. Next: watch whether this thrust holds up in flight and the booster is recovered as planned.</text>
  <text x="540" y="1056" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SpaceX · Starship thrust · 2026.09.14</text>
