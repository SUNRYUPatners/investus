  <rect x="360" y="166" width="360" height="46" rx="23" fill="#ff990018" stroke="#ff9900" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#ff9900" text-anchor="middle">⚡ 10% cuts · $10B+ robotaxi</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🚕</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#ff9900" text-anchor="middle">10%</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Cost reset overlaps Sept 3 Cybercab event day—near-term margins vs long-term fleet capex.</text>
