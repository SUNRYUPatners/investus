  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#ff9900" text-anchor="middle">10%</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Layoffs</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Largest since COVID</text>
