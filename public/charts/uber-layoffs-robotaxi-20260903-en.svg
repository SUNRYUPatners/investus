  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Same-day event</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#ff9900" text-anchor="middle">Uber is pushing margin defense (cuts) and fleet offense (robotaxi capex) together. A strong</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#ff9900" text-anchor="middle">Cybercab narrative may reprice Uber through a "competition cost" lens.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#201408" stroke="#ff9900" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#ff9900" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Cuts alone read as opex savings; capex alone reads as growth bet. Track quarterly FCF, margins, and autonomy</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">partnerships (vehicles, maps, insurance) on one sheet. Sept 3 Tesla headlines may fuel the platform vs OEM fleet</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">debate.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">UBER · layoffs · robotaxi · 2026.09.03</text>
