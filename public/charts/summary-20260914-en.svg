  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.14 Daily Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Ellison canceled his $7.5B Oracle stock-sale plan a day after filing</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">The 50M-share trading plan was scrapped by the founder himself.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">$7.5B</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla will unveil the new Roadster on Oct 1 in Waco, Texas</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">RSVP deadline is Sep 16 midnight Pacific time.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">Oct 1</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#a78bfa"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">Anthropic's stacked compute deals now total $517B</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">About 15,000 MW secured; Nvidia is reportedly weighing an investment.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">$517B</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Cybercab wait times in Austin spiked to 40x Model Y at times</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Surge pricing made it cost more than a Model Y ride.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">40x</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">The EU is set to vote on Tesla FSD approval on Oct 6</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">6 countries approved, 6 more signaling yes — 62% of EU population.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">Oct 6</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">The Fed has posted $212B in operating losses over three years</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">High rates made its interest payouts exceed its asset income.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">$212B</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX completed its 700th Falcon-family launch</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">2025 alone saw 165 launches as the cadence keeps accelerating.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">700</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Oracle $7.5B · Roadster Oct 1 · Anthropic $517B · Cybercab 40x · EU Oct 6 · Fed $212B · 700 launches</text>
