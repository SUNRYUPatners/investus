  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">SAMZN 인도 시작</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">첫 고객</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">3배 확장</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">2년 rollout</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Amrise EV fleet</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">SHAY BOLOOR</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"Tesla Semi가 사상 최대 상용 계약 확보·Amrise가 500대를 미국 주요 화물 회랑에 배치 계획·</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">9월 SAMZN 등에 인도·2년 rollout이 Amrise 전기 트럭 fleet 3배 확장 예상"</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Just landed its largest Semi commitment yet with Amrise planning to deploy 500 trucks across major U.S.</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">freight corridors · Deliveries begin in September for SAMZN and other customers with the 2-year rollout</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Shay Boloor · 2026.08.18</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Tesla Semi 상용 배치의 최대 계약이 확인됐습니다. 9월 인도 시작이 실 매출 반영 시점입니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA Semi · Amrise 500대 · 2026.08.19</text>
