  <text x="540" y="780" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="820" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">중국 수요와 통제 강화는 꼬리 위험입니다. 회사 입장과 매출 비중을 확인하시고, 한 건의 기사만으로 중장기 비중을 크게 바꾸지 마세요.</text>
