  <text x="540" y="230" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#60a5fa" text-anchor="middle">수출</text>
  <text x="540" y="280" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">고급 AI 칩을 중국으로 밀반출한 혐의로 직원이 기소됐다는 보도입니다. 수출 통제와 내부 준수, 우회 수요</text>
  <text x="540" y="306" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">이슈로 읽힙니다.</text>
  <rect x="80" y="320" width="920" height="240" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="400" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">"엔비디아 직원이 고급 칩을 중국으로 밀반출한 혐의로 기소됐다는 보도가 나왔습니다.</text>
  <text x="540" y="430" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">미국은 AI 칩 중국 수출을 제한합니다. 개인 사건과 회사 정책 위반은 구분해야 하지만,</text>
  <text x="540" y="460" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">시장은 내부 통제·규제 감독·</text>
  <text x="540" y="490" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">우회 수요 이야기와 연결해 읽습니다. 합법 매출과 암시장 수요를 나눠 보셔야 합니다."</text>
