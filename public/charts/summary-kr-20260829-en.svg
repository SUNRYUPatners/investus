<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.08.29 Korea Market Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="112" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="112" rx="4" fill="#ef4444"/>
  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444">KOSPI fell 1.79% to close at 6,788.88</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">It gave back most of the prior session gain and lost the 6,800 line.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444" text-anchor="end">-1.79%</text>
  <rect x="60" y="246" width="960" height="112" rx="14" fill="#06171c" stroke="#22d3ee" stroke-width="2"/>
  <rect x="60" y="246" width="8" height="112" rx="4" fill="#22d3ee"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#22d3ee">Foreign investors sold a net 1.756 trillion won</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">Institutions sold 284bn won while retail absorbed 424bn won.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee" text-anchor="end">Foreign</text>
  <rect x="60" y="370" width="960" height="112" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="370" width="8" height="112" rx="4" fill="#f59e0b"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f59e0b">SK Hynix dropped 4.45% and led chips lower</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">Samsung Electronics fell around 3% and tech hardware lost over 3%.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b" text-anchor="end">-4.45%</text>
  <rect x="60" y="494" width="960" height="112" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#4ade80"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80">The won closed 8.4 won stronger at 1,372.5</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">Global dollar weakness outweighed foreign equity selling.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80" text-anchor="end">1372.5</text>
  <rect x="60" y="618" width="960" height="112" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="618" width="8" height="112" rx="4" fill="#a78bfa"/>
  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa">Memory tightness is seen lasting through end-2030</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">The comment came at the Indiana HBM packaging groundbreaking.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa" text-anchor="end">2030</text>
  <rect x="60" y="742" width="960" height="112" rx="14" fill="#0f1419" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="742" width="8" height="112" rx="4" fill="#94a3b8"/>
  <text x="116" y="784" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#94a3b8">The hawkish Jackson Hole speech is next week risk</text>
  <text x="116" y="822" font-family="Arial" font-size="18" fill="#9ca3af">September hike odds at 59.7% can move the won and foreign flows.</text>
  <text x="985" y="808" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8" text-anchor="end">JH</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Also: KOSPI 6,788.88 · foreign net sell 1.756T won · Hynix -4.45% · USDKRW 1,372.5 · memory tight to 2030 · Jackson</text>
  <text x="540" y="1032" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Hole</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
