<text x="201.5" y="54" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="900">FSD</text><text x="54" y="104" font-family="Arial,sans-serif" font-size="24" fill="#8B949E">2026.10.19 · Tesla FSD user stories</text><text x="54" y="200" font-family="Arial Black,Arial,sans-serif" font-size="100" fill="url(#hG)" font-weight="900">87·83·92</text><text x="54" y="254" font-family="Arial,sans-serif" font-size="26" fill="#A7F3D0">yr olds — FSD restored their mobility &amp; independence</text><rect x="54" y="282" width="972" height="3" fill="url(#divG)" rx="2"/><rect x="54" y="314" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="314" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="462" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">92</text><text x="114" y="502" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">yrs</text><text x="196" y="380" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">"I let my 92-yr-old</text><text x="196" y="416" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">neighbor test drive</text><text x="196" y="452" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">with FSD. They</text><text x="196" y="488" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">bought one the next</text><text x="196" y="524" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">day."</text><rect x="54" y="584" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="584" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="732" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">83</text><text x="114" y="772" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">yrs</text><text x="196" y="650" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">"My 83-yr-old dad</text><text x="196" y="686" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">drives at night to</text><text x="196" y="722" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">see grandkids and</text><text x="196" y="758" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">dine out. 98% FSD.</text><text x="196" y="794" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">Truly</text><text x="196" y="830" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">transformational."</text><rect x="54" y="854" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="854" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="1002" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">87</text><text x="114" y="1042" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">yrs</text><text x="196" y="920" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">"My dad uses FSD to</text><text x="196" y="956" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">get just about</text><text x="196" y="992" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">everywhere. He'd</text><text x="196" y="1028" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">never get on the</text><text x="196" y="1064" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">highway without it."</text><rect x="54" y="1132" width="972" height="88" rx="16" fill="#0D1A14" stroke="#34D399" stroke-width="1.5"/><text x="84" y="1166" font-family="Arial,sans-serif" font-size="20" fill="#A7F3D0">FSD is not just autonomous driving — it's </text><text x="84" y="1200" font-family="Arial,sans-serif" font-size="20" fill="#A7F3D0">emerging as an accessibility technology restoring independence to mobility-limited users</text><rect x="0" y="1278" width="1080" height="72" fill="#161B22"/>
