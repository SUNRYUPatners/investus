  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">Scores on the card</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">Long office work scored 1,657 versus 1,546 on 4.6</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">The legal-agent score is a low 19.6%, still up from 15.8%</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">Half-price or 2× speed claims do not match the table. Price is unchanged</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#201018" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#fb7185" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A cheaper model that climbs coding and electrical tasks can cut factory and satellite software cost. A table is not</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">all of real work. Next, watch Cursor and API usage.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SpaceX · Grok 4.7 · 2026.09.22</text>
