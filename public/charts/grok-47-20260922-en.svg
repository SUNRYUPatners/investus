  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🤖</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#fb7185" text-anchor="middle">Grok 4.7</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Grok is the SpaceX AI lab’s chat model. Input is $2 and output $6 per million tokens, matching 4.6, while</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">scores rose.</text>
