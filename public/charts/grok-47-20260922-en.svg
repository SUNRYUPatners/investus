  <text x="210" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Price</text>
  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">$2 / $6</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">In and out per million tokens</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">The same row as 4.6</text>
  <rect x="390" y="400" width="300" height="200" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="540" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Coding</text>
  <text x="540" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">46.3%</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">CursorBench 4.0</text>
  <text x="540" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">Up from 40.4% on 4.6</text>
  <rect x="720" y="400" width="300" height="200" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="870" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Electrical</text>
  <text x="870" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">64.0%</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">EE bench</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">Ahead of the comparison set</text>
