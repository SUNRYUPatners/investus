  <text x="540" y="648" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">그록 4.8이 가까워지고 있습니다. xAI 공식 그록 빌드 저장소에 이름이 보이기 시작했습니다. 모델 선택 화면과 경로</text>
  <text x="540" y="672" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">시험이 돌아가고, 코드에는 그록 4.8과 그록 4.5가 참조됩니다. 출시가 당장 임박했다는 뜻은 아닙니다. 아직</text>
  <text x="540" y="696" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">일주일, 또는 이주가 더 걸릴 수 있습니다.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="838" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="864" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">저장소에 적힌 이름은 출시 공지가 아닙니다. 빌드 시험의 흔적입니다. 파라미터 규모를 말한 어제 글과 오늘 버전 이름은 확인하는</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">질문이 다릅니다. 하나가 나와도 다른 숫자가 확정되지는 않습니다. 경로 시험은 어떤 질문에 어떤 모델을 붙일지 고르는</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">작업입니다. 이용자 화면에 이름이 뜨기 전과 저장소에만 있는 단계를 구분합니다. 일주일과 이주라는 폭은 날짜가 아니라</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">여유입니다. 이용자 설정에 이름이 들어가기 전과 저장소에만 있는 단계를 구분합니다. 파라미터 규모와 버전 번호는 같이 확정되지</text>
  <text x="540" y="944" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">않습니다. 설정 화면에 이름이 들어가기 전에는 출시일로 적지 않습니다. 날짜는 비워 둡니다. 공지가 먼저입니다.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">2026.10.01</text>
