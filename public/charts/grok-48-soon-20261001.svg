  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">4.8</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">출시 공지는 아닙니다. 일주일에서 이주 여유.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="386" width="300" height="210" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">📦</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">4.8</text>
  <text x="210" y="524" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">저장소</text>
  <text x="210" y="568" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">이름이 보이기 시작</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">🔀</text>
