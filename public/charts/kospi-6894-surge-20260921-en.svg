  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Advancers 407 vs decliners 465 — the index rose on mega-cap chips.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">KOSDAQ rose 4.94 points to 827.12, a smaller gain than KOSPI.</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">Electronics rose 4.46% and pulled the index. Finance fell 1.73%, splitting sectors.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#0a1a26" stroke="#38bdf8" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">Why it matters</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A 2.66% jump was a chip-led squeeze. Whether the ₩424.5B foreign bid lasts a second day is the test. Buybacks may</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">end by mid-October, changing the flow mix.</text>
  <text x="540" y="1026" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">KOSPI · Surge close · 2026.09.21</text>
