  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#38bdf8" text-anchor="middle">6,894.23</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 18 close, up 178.82 points. Foreigners broke a multi-session selling streak.</text>
