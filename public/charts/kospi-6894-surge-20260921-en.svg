  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">₩1,383</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">USD/KRW</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The won stayed in a weak</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">band</text>
