  <text x="540" y="648" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">선택은 차만 살지, 차와 운전사를 같이 살지였습니다. 감독 완전자율주행은 사람들이 말하는 만큼 좋고, 앞으로는 더</text>
