  <text x="540" y="820" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">메모리는 인공지능 서버에서 연산 칩과 함께 병목이 되는 부품입니다. 연구 투자는 다음 세대 제품 경쟁력의 선행 지표이지만 실적</text>
