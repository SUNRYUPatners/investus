  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">NVL72</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">베라 루빈 NVL72는 엔비디아의 차세대 가속기 랙 설계입니다. 지상에서는 그록 학습·추론에, 우주에서는</text>
