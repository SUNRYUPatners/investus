  <text x="540" y="688" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">"그록을 돌리는 지상 공장과 스타마인드라는 1세대 위성에 베라 루빈 NVL72 계열을 쓰겠다는 설명이 나왔습니다.</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">NVL72는 여러 가속기를 한 랙처럼 묶는 설계입니다. 궤도 데이터센터는 지상 랙보다 가볍고 밀도 높게 만들겠다는</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">주장과 같이 갑니다. 일정은 실적 발표를 봐야 합니다."</text>
