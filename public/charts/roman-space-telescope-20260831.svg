  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">지구 2차 궤도(L2)는 태양·지구 중력이 맞서 관측에 유리한 위치입니다</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">대형 과학 위성이 재사용 로켓으로 올라가면 발사 비용 구조가 달라집니다</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">로마 망원경은 암흑물질·외계행성 탐색을 위한 NASA 과학 임무입니다. 10.15톤은 승무원 없이 올리는 화물 중 매우</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">무거운 편이며, 같은 주에 AI·우주 상업 뉴스가 겹치며 우주 경제 논의가 다시 커졌습니다.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">과학 위성 발사는 스페이스X 수익의 한 축이 아니지만, 헤비급 신뢰성과 대형 화물 실적은 상업·정부 계약 협상에 영향을 줍니다. L2</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">도달과 개막 후 첫 관측 일정이 다음 확인 포인트입니다. 우주 과학과 상업 발사 역량이 같은 브랜드 아래 묶이는지도 장기적으로</text>
  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">봐야 합니다.</text>
