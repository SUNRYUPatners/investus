  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">8월 30일 오전 7시 26분(동부) 발사. 과학 임무용 대형 광학 기기가 상업 로켓으로 올라갔습니다.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
