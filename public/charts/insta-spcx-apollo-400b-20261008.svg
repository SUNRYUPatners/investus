  <text x="200" y="804" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">엔비디아 칩</text>
  <text x="200" y="836" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">테라팹 연산 인프라</text>
  <rect x="390" y="714" width="300" height="156" rx="16" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="540" y="756" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">주도사</text>
  <text x="540" y="804" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#8b5cf6" text-anchor="middle">아폴로 G.M.</text>
  <text x="540" y="836" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">사모신용 $3,000억</text>
  <rect x="730" y="714" width="300" height="156" rx="16" fill="#1e0a3c" stroke="#c084fc" stroke-width="1.5"/>
  <text x="880" y="756" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">특징</text>
  <text x="880" y="804" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc" text-anchor="middle">희석 없음</text>
  <text x="880" y="836" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">공모 아닌 비공개 구조</text>
  <!-- Message box -->
  <rect x="50" y="918" width="980" height="318" rx="18" fill="#0d0520" stroke="#8b5cf633" stroke-width="1.5"/>
  <text x="540" y="968" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#8b5cf6" text-anchor="middle">투자 포인트</text>
  <text x="80" y="1014" font-family="Arial" font-size="23" fill="#e2e8f0">① IPO 직전 최대 라운드 — 밸류에이션 기준선 형성</text>
