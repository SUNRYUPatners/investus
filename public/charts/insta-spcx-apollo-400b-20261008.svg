  <text x="80" y="1094" font-family="Arial" font-size="23" fill="#e2e8f0">③ 같은 날 젠슨황 방문 + FCC 승인 동시 발생</text>
  <text x="80" y="1134" font-family="Arial" font-size="23" fill="#e2e8f0">④ MS OW $300 · 씨티 $900 — 파이낸싱 위</text>
