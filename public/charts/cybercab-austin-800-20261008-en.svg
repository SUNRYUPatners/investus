  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#f9fafb" text-anchor="middle">Austin Cybercab Driverless</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#4ade80" text-anchor="middle">Sightings Hit 800 on Oct 3</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#021a0e" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">All-time single-city robotaxi sighting record</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="80" font-weight="900" fill="#4ade80" text-anchor="middle">800</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Total up +68% · Driverless up +50% vs. prior Tuesday — 5 days near 500</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#021a0e" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#021209" stroke="#4ade80" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Oct 3 peak</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#4ade80" text-anchor="middle">800+</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Total sightings</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">All-time single-day record</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#021209" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Week-over-week</text>
