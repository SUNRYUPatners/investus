  <text x="540" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Total sightings</text>
  <text x="540" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">vs. prior Tuesday</text>
  <rect x="730" y="420" width="310" height="195" rx="14" fill="#021209" stroke="#4ade80" stroke-width="2"/>
  <text x="885" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Driverless jump</text>
  <text x="885" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#4ade80" text-anchor="middle">+50%</text>
  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Driverless mode</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">5 days near 500</text>
  <rect x="40" y="632" width="1000" height="268" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">Background</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">Cybercab is in the public road testing phase in Austin, Texas.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">Texas regulations make Austin the most permissive testing ground.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">September average ~200/day; October first week surged 4x to 800+.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">One analyst models $240M annual revenue if fleet hits 5,000 by year-end.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* Sightings vs. permitted units (169) are different counts — track commercial launch</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#021209" stroke="#4ade80" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80">Key Points</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">Sighting frequency is a leading indicator of test intensity and launch visibility.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">800 is an all-time single-city robotaxi sighting record globally.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">Wedbush $600 target hinges on robotaxi commercialization pace.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">Morgan Stanley $840 bull case requires robotaxi revenue to actually land.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#16a34a">Formal commercial launch and fare disclosure are the thesis confirmation.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · TSLA · Cybercab Austin</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">Do not multiply 800 sightings × $240M revenue — 5,000 fleet is the prerequisite</text>
  <rect x="0" y="1280" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1318" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
