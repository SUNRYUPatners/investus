  <text x="540" y="874" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Plus 7.18% YTD is cumulative. Higher jeonse lifts monthly-rent shifts and deposit risk. If buy-side demand parks in</text>
