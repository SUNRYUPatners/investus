  <text x="540" y="686" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Jeonse is a large refundable deposit lease. 711.78 million won means more cash and credit locked</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">up. Contract quality and guarantees matter more than the headline print.</text>
