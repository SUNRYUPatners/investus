  <text x="540" y="916" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">3.3%보다 낮았습니다. 10월 금리 인상 확률은 약 37.1%로, 지난주 약 70.9%에서 내려가 있었습니다. 물가가 낮아도 장기 금리는</text>
