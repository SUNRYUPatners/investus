  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#38bdf8">KOSPI slipped 0.04% to close at 6,715.41 on Sept 17</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners sold ₩2.28T; retail bought ₩414B and institutions ₩159B.</text>
  <text x="985" y="207" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">6,715.41</text>
