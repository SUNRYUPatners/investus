  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">Samsung Electronics fell 0.39% to 252,500 won</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">The session high was 259,000 won; foreigners sold ₩563B.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">₩252,500</text>
  <rect x="60" y="472" width="960" height="165" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="472" width="8" height="165" rx="4" fill="#f59e0b"/>
  <text x="116" y="531" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f59e0b">SK Hynix dropped 0.80% to 1,745,000 won</text>
  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners sold ₩1.23T, the center of electronics outflows.</text>
  <text x="985" y="557" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">₩1,745,000</text>
  <rect x="60" y="647" width="960" height="165" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="647" width="8" height="165" rx="4" fill="#fb7185"/>
  <text x="116" y="706" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb7185">Hyundai Motor bounced 0.28% to 363,000 won</text>
  <text x="116" y="742" font-family="Arial" font-size="17" fill="#9ca3af">A modest rebound for the top-cap automaker after the prior drop.</text>
  <text x="985" y="732" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">₩363,000</text>
  <rect x="60" y="822" width="960" height="165" rx="14" fill="#052015" stroke="#34d399" stroke-width="2"/>
  <rect x="60" y="822" width="8" height="165" rx="4" fill="#34d399"/>
  <text x="116" y="881" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#34d399">KB Financial rose 1.41% to 178,700 won on rate-hike hopes</text>
  <text x="116" y="917" font-family="Arial" font-size="17" fill="#9ca3af">Bank shares moved opposite the index the day after the Fed hike.</text>
  <text x="985" y="907" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#34d399" text-anchor="end">+1.41%</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: KOSPI 6,715.41 · Samsung 252,500 · Hynix 1,745,000 · Hyundai +0.28% · KB +1.41%</text>
