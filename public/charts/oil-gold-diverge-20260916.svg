  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">미 10년물 국채금리가 2007년 이후 최고 수준까지 오른 점도 금값을 눌렀습니다. ING는 매파적 연준 리스크가 이미 상당 부분</text>
