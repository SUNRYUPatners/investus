  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">사우디 동서송유관 복구가 늦어지는 가운데 리비아 유전 가동도 멈췄습니다.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">유가 급등이 인플레이션 우려를 키워 연준 금리인상 전망을 강화했습니다.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">금리가 오르면 이자 없는 금의 상대적 매력이 떨어져 두 자산이 반대로 움직였습니다.</text>
