  <text x="540" y="878" font-family="Arial" font-size="18" fill="#818cf8" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Ether is more than a payment token — it's a platform for DeFi and NFTs. Its higher volatility (beta) versus Bitcoin</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">also played into this pullback. Next: watch whether on-chain stablecoin and DeFi activity keeps growing regardless</text>
