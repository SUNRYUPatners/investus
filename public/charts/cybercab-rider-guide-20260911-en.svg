  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Insurers and regulators start talks faster when a standard guide exists. Today is a PDF day. Over 3–5 years, shared</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">boarding rules can speed city-by-city expansion.</text>
