  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">A guide means the company is preparing a car a stranger can board alone. It covers doors, belts, and</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">emergency contacts. Next: cities where this guide is used for hails.</text>
