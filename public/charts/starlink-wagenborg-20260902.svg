  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">선박 연결은 스타링크 수익의 새 축입니다. 가정용 가입자 수만큼 B2B·해상·항공 계약이 쌓이면 ARPU(가입자당 매출) 구조가</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">달라집니다. 다음에는 선박당 요금·데이터 사용량·경쟁 위성 서비스와의 가격 비교를 확인하시면 됩니다. 해상 확대는 V3 위성 용량</text>
