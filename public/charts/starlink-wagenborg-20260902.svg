  <text x="540" y="656" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">해상 스타링크(Starlink Maritime)는 항구·연안이 아니라 원양 구간에서도 인터넷을 쓰게 해 줍니다. 약</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">160척 규모 선단에 확대되면 「연결」이 「운항·연료·화물 추적 데이터」로 이어집니다. 위성 인터넷은 이미</text>
