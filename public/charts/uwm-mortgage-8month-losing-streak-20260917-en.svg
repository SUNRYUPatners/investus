  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Biggest in the US</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">A bellwether for</text>
  <text x="640" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">mortgages</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">💵</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#ef4444" text-anchor="middle">~5% rates</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Mortgage rate…</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Compounded by the Fed</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">hike</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">A prolonged stock decline often signals weakening demand for home loans.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">This week’s Fed rate hike adds to worries that mortgage rate pressure could deepen further.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#ef4444" text-anchor="middle">One market outlet reported: "United Wholesale Mortgage is going for its 8th straight red month, its longest</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#ef4444" text-anchor="middle">losing streak in history, after suffering its largest single-day drop in history last month."</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#1c0d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="540" y="880" font-family="Arial" font-size="18" fill="#ef4444" text-anchor="middle">Why it matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A mortgage lender’s results track home sales volume closely. Eight straight down months suggests softer loan</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">demand and housing turnover for a while now — watch whether this week’s rate hike deepens that trend.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">UWM · Mortgage Market · 2026.09.17</text>
