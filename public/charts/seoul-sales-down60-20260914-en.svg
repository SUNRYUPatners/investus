<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#120b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">SALES</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.14</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul apartment sales plunged 60% MoM to 2,322 units in</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">August, with Gangnam 3's share at a record-low 9.1%</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">🏢</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#a78bfa" text-anchor="middle">2,322</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">That's August's Seoul apartment sales count — a quarter of the April-May peak of 8,600-9,000 and</text>
  <text x="540" y="383" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">down 60% from July's 5,800.</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="418" width="300" height="176" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">August volume</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#a78bfa" text-anchor="middle">2,322</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">-60% MoM</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Per MOLIT filings</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Gangnam 3 share</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#a78bfa" text-anchor="middle">9.1%</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Yearly low</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Was 16.1% in May</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Non-Gangnam share</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#a78bfa" text-anchor="middle">90.9%</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Yearly high</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Lower loan barriers</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">Why sales collapsed</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">A May capital-gains-tax grace period ending pulled forward quick sales.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">Tighter mortgage rules and two rate hikes hit at the same time.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">Delay in finalizing the Aug. 3 tax overhaul left buyers and sellers waiting.</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Over the past year, prices actually rose most in non-Gangnam and Gyeonggi areas like Bundang (29.5%) and</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Gwangmyeong (28.4%). Loan restrictions hit high-priced Gangnam homes harder. Next: watch how the Aug. 3 tax</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">overhaul is finalized in the National Assembly.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Sales · Volume drop · 2026.09.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>