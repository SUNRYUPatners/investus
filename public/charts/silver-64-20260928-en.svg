  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Week</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#94a3b8" text-anchor="middle">−3–4%</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Weekly drop</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Softer than gold’s about 2%</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Low</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#94a3b8" text-anchor="middle">$63.26</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Week low</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">$63 is cited as support</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Ratio</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#94a3b8" text-anchor="middle">67</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Gold / silver</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">$4,285 gold over $64 silver</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the tape says</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">Industrial and investment demand share one metal</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">A week’s price still follows yields and the dollar first</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">Silver often follows after gold makes a floor</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Silver remains a multi-year industrial and monetary metal. A 3% week does not erase that. Read it beside gold and the</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">ratio.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Silver · $64 · 2026.09.28</text>
