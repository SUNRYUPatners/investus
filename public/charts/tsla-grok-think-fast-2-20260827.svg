<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.27</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">그록 Think Fast 2.0이 음성 대화 1위로 올라 차량·설정·내비·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">음악을 제어합니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="230" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle">#1 S2S</text>
  <text x="540" y="280" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">음성 대화(speech-to-speech) 1위. 차량·설정·내비·음악 음성 제어.</text>
  <rect x="80" y="320" width="920" height="240" rx="18" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="400" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">"그록 Think Fast 2.0이 음성 대화 벤치 1위입니다. 텍스트 없이 말로 대화하고, 차량·설정</text>
  <text x="540" y="430" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">내비·음악을 조작합니다. 운전 중 손을 떼지 않는 UX가 목표입니다. 벤치 1위와 실차</text>
  <text x="540" y="460" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">만족도는 다를 수 있으니 OTA 후 리뷰를 보세요."</text>
  <rect x="120" y="590" width="400" height="120" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="320" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">#1</text>
  <text x="320" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">음성 대화</text>
  <rect x="560" y="590" width="400" height="120" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="760" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">4-in-1</text>
  <text x="760" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">차량·내비·음악</text>
  <rect x="60" y="740" width="960" height="200" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="780" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="822" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">차 안 AI는 단순 음성 비서가 아니라 차량 설정·내비·음악까지 제어하는 OS 기능입니다. 그록 Think Fast 2.0은</text>
  <text x="540" y="846" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">음성 대화 벤치마크 1위로 잡혀, 소프트웨어 업데이트만으로 차량 경험이 바뀐다는 메시지입니다.</text>
  <text x="540" y="870" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">로보택시와 별개로 구독·프리미엄 AI 수익 축이 생길 수 있습니다. OTA 배포 차종·지역·유료 여부를 확인하세요.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Grok Think Fast 2.0 · 2026.08.27</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">INVESTUS · SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>