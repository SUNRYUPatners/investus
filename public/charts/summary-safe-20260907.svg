<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.07 안전자산 한장 요약</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="112" rx="14" fill="#1a0f00" stroke="#f7931a" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="112" rx="4" fill="#f7931a"/>
  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f7931a">비트코인이 8만 달러 안팎에서 거래되며 주중 81,400 근접…</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">9월 6일 약 79,818달러입니다. 금과의 상관이 나스닥보다 높게 읽힙니다.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f7931a" text-anchor="end">~79,818</text>
  <rect x="60" y="246" width="960" height="112" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="246" width="8" height="112" rx="4" fill="#facc15"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#facc15">금·비트코인 90일 상관이 50%를 넘고 나스닥 상관은 약…</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">위험온만으로 비트코인을 설명하기 어려운 구간입니다. 달러·금리 채널을 같이 보시면 됩니다.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15" text-anchor="end">50%+</text>
  <rect x="60" y="370" width="960" height="112" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="370" width="8" height="112" rx="4" fill="#ef4444"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444">월러 동결 기대 이후 인상 확률이 약 50% 안팎으로…</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">미국 장기국채와 실질금리가 같은 축입니다. 9월 15~16일 연준 회의가 확정 스위치입니다.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444" text-anchor="end">~50%</text>
  <rect x="60" y="494" width="960" height="112" rx="14" fill="#0a0f24" stroke="#627eea" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#627eea"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#627eea">이더리움은 비트코인 베타가 큰 동행으로 같이 보시면 됩니다</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">알트 레버리지는 회의 전 청산이 먼저입니다. 현물 펀드 유입이 품질입니다.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#627eea" text-anchor="end">이더</text>
  <rect x="60" y="618" width="960" height="112" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="618" width="8" height="112" rx="4" fill="#f59e0b"/>
  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f59e0b">고유가가 인플레 변수로 남으며 동결 기대와 충돌할 수…</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">금·비트코인·장기국채가 같은 할인율 축에서 출렁일 수 있습니다.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b" text-anchor="end">유가</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 비트코인 약 8만 달러 · 금 상관 50%+ · 인상확률 ~50% · 이더 베타 · 유가 · FOMC 15-16</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>