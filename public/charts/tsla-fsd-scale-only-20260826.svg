<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.26</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">규모 있는 자율주행을 실제로 하는 회사는 테슬라뿐이라는 주장이</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">나왔습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="230" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle">규모</text>
  <text x="540" y="280" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">규모 있는 자율주행은 시험차 몇 대가 아니라, 많은 차가 매일 실제 도로에서 소프트웨어로 운행하는 상태를</text>
  <text x="540" y="306" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">뜻합니다. 이번 주장은 그 기준에서 테슬라만 해당한다는 쪽입니다.</text>
  <rect x="80" y="320" width="920" height="240" rx="18" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="400" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">"규모 있는 자율주행을 하고 있는 회사는 테슬라뿐이라는 주장이 나왔습니다. 규모란 상용에</text>
  <text x="540" y="430" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">가까운 차량 수와 운행 시간을 뜻합니다. 웨이모·주스 등은 다른 도시·다른 조건에서</text>
  <text x="540" y="460" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">경쟁합니다. ‘유일’ 여부는 완전 무인인지, 유료인지, 누적 마일이 얼마인지 정의에</text>
  <text x="540" y="490" font-family="Arial" font-size="21" fill="#f9fafb" text-anchor="middle">달립니다. 주장과 공식 통계를 나눠 보셔야 합니다."</text>
  <rect x="120" y="590" width="400" height="120" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="320" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">로보택시</text>
  <text x="320" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">오스틴·달러스</text>
  <rect x="560" y="590" width="400" height="120" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="760" y="640" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">FSD</text>
  <text x="760" y="680" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">감독 주행</text>
  <rect x="60" y="740" width="960" height="200" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="780" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="820" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">독점 이야기는 테슬라 밸류에이션 프리미엄과 연결됩니다. 정의를 좁혀 유료 마일과 도시 수로 검증하세요. 경쟁사가 유료·</text>
  <text x="540" y="844" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">무인을 늘리면 프레임이 약해질 수 있습니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 자율주행 규모 · 2026.08.26</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">INVESTUS · SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>