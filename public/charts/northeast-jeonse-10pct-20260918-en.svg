  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0d02"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#fb923c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="113" height="38" rx="19" fill="#fb923c30" stroke="#fb923c" stroke-width="1.5"/>
  <text x="96.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#fb923c" text-anchor="middle">JEONSE</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.18</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul northeast jeonse is up 10.11% year to date, the first</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">double-digit rise in 11 years</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">🏘️</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#fb923c" text-anchor="middle">+10.11%</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Jeonse is a large-deposit rental. Northeast Seoul deposits have risen 10.11% this year, the first</text>
  <text x="540" y="383" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">double-digit pace since 2015.</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Listings</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#fb923c" text-anchor="middle">-44.6%</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Northeast stock</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Down sharply since the Oct 15 policy</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Seoul average</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#fb923c" text-anchor="middle">₩712M</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">KB jeonse mean</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Up 9.2% year on year</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Span</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#fb923c" text-anchor="middle">11 years</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Double digits</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">First such print since 2015</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">What stacked in the northeast</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">Rebuild move-outs concentrated demand there first</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">Occupancy rules locked listings, down 44.6% after Oct 15</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">KB’s Seoul average of ₩711.78M points the same way</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#20130a" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The northeast is the front line of the jeonse squeeze. Whether the occupancy delay brings listings back is the</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">October test. Watch whether weekly gains push beyond 10.11%.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Jeonse · Northeast Seoul · 2026.09.18</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>