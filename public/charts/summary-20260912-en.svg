  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Starship Flight 14 is set for the Sep 18 morning window</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">7:15–9:14 a.m. CDT. First revenue flight with V3 Starlinks.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">9/18</text>
