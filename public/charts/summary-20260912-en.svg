  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">FSD v15 was said to predict hazards earlier and avoid collisions…</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">Next supervised upgrade. Japan said 2026 is the top priority.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">v15</text>
