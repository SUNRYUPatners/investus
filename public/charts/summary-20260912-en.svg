  <rect x="60" y="372" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Fifteen Cybercabs were ready to leave a Pennsylvania lot</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Hong Kong debuted Sep 9; Tokyo is next.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">15</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#ef4444"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">U.S. home sellers outnumbered buyers by 57.9%, a record</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">August print. Not a 57% one-day price crash.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">57.9%</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX said an AI compute deal starts at $1.11B a month on Dec 1</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">$13.3B annualized. December run-rate was framed as $100B ARR.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">$1.11B</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#06121f" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Microsoft printed a 2032 data-center goal above 38 GW</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">About 12 GW now. NVIDIA’s CEO called AI the new electricity.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">38GW</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Cybercab was drawn at $0.25 a mile and a fleet-buyer form wen…</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">Unsupervised miles 380k→1M. A forecast, not today’s fare.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">$0.25</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Sep 18 · FSD v15 · 15 cabs · housing 57.9% · $1.11B/mo · 38 GW</text>
