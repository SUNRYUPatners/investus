<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#120b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">POLICY</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.14</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul's land-permit applications fell 34.8% to 3,012 in August,</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">the lowest since the district designation</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">📋</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">3,012</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">That's August's application count, down 34.8% from July's 4,618 — a fourth straight monthly</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">decline since April's peak of 8,896.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">April peak</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">8,896</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Permit applications</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#a78bfa" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="middle">August</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#a78bfa" text-anchor="middle">3,012</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">4th straight decline</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">🏙</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">North Seoul 48.8%</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Nearly half of total</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Led by lower-priced areas</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🏠</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">4.5%</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Occupancy-waiver requests</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Policy impact still small</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">⏳</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">Tax overhaul</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Pending in Assembly</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Delay is the backdrop</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">The end of a capital-gains grace period, tighter loans, and the delayed tax overhaul are keeping buyers</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">on the sidelines.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The land-transaction permit system requires pre-approval for home purchases in speculation-prone zones. This</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">decline tracks with August's 60% sales drop. Next: watch whether pending demand moves once the Aug. 3 tax overhaul</text>
  <text x="540" y="984" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">is finalized.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Policy · Land permits · 2026.09.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>