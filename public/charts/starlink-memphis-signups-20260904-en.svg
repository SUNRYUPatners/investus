  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Starlink is satellite internet. Two thousand homes is small versus the metro, but half-off plus no kit</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">fee can speed the ramp. Do not mix enterprise circuits with residential ARPU.</text>
