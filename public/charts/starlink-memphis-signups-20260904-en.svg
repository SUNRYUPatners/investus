  <text x="540" y="908" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Signups are not revenue. Churn, ARPU, and capacity sit on another sheet. Southaven compute leases and home</text>
