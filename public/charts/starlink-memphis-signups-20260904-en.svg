  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">New customers skip the upfront kit. Consumer broadband demand is rising in the same metro as</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">the data-center push.</text>
