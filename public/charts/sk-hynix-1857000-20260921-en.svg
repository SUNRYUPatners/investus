  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle">HYNIX</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.21</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">SK Hynix jumped 6.42% to 1,857,000 won as the center of</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">foreign buying</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">💾</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#f59e0b" text-anchor="middle">₩1,857,000</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 18 close, up 112,000 won (6.42%). It opened at 1,810,000 and closed on the high.</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Foreign</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f59e0b" text-anchor="middle">+₩1.33T</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">One-day buying</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The cash-market top buy</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Institutions</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f59e0b" text-anchor="middle">+₩284B</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Same-side bid</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">They bought with foreigners</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Buyback</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f59e0b" text-anchor="middle">58.79%</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">₩24.4T spent</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">9.92 million shares left</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the flow says</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">Foreigners sold Samsung and bought this name</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">A close on the high means the last print was the peak</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">A 6% move in the No. 2 name powered the 2.66% index</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#201408" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#f59e0b" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A ₩1T-class foreign bid was the Friday rally’s core. Whether 1,857,000 won becomes support is the next check. If</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">the buyback ends by mid-October, the flow mix changes.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SK Hynix · Stock · 2026.09.21</text>
