  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee">청년 공공임대·월세 지원이 2027년 예산 축으로 강조됐습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">서울 임차보증금 이자지원은 최대 2억 원·연 2.0%입니다.</text>
