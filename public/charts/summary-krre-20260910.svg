  <rect x="60" y="747" width="960" height="115" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#ef4444"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">종부세 과표 12억은 시가 약 44억 원대 주택 이야기입니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">중저가 전월세난과 정책 대상이 다릅니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">한계</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">정책 일관성과 가을 이사 시즌을 같은 신호로 묶지 마시기 바랍니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">대출 한도 조회 없는 계약은 거절하시기 바랍니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">일정</text>
