  <rect x="60" y="497" width="8" height="115" rx="4" fill="#38bdf8"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8">실거주 공제 14억 원과 비거주 12억 원은 차등입니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">공동명의 비거주도 합산 12억으로 맞췄습니다. 시행 숫자는 고지서로 확인하시기 바랍니다.</text>
