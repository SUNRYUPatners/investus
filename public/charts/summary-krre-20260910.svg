  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">비거주 1주택 종부세 공제 12억 원 유지가 다시 확인됐습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">9억 축소안은 철회됐고, 세부담 상한 150%·공정시장가액비율 70%입니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">종부세</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#fb923c"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c">서울 아파트 전세 매물이 약 1만 9,902건으로 1년 전보다 12.8%…</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">종부세 유턴만으로 중저가 전세 물량이 늘어나기 어렵다는 평가입니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">전세</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#1a0d02" stroke="#f97316" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#f97316"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f97316">월세 매물은 약 1만 6,921건으로 전년 대비 11.9% 줄었습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">전세와 월세가 같이 줄면 협상력이 임차인에게 불리합니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">월세</text>
