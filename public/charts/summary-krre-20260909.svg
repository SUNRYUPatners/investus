  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.09 한국부동산 한장 요약</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="112" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="112" rx="4" fill="#fb923c"/>
  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#fb923c">7월 서울 아파트 갱신권 없이 재계약한 전세의 약 87.6~88%…</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">평균 약 4,680만 원(약 9.1%) 인상, 갱신권 사용 시 평균 약 2,750만 원으로 약 1.7배 낮습니다.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c" text-anchor="end">전세</text>
  <rect x="60" y="246" width="960" height="112" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="246" width="8" height="112" rx="4" fill="#ef4444"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444">1억 원 이상 인상 360건·3억 원 이상 20건이 집계됐고 개별…</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">자극적 헤드라인보다 분포와 평균을 같이 보시기 바랍니다.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444" text-anchor="end">사례</text>
  <rect x="60" y="370" width="960" height="112" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="370" width="8" height="112" rx="4" fill="#a78bfa"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa">서울 전세 매물이 약 20,432건으로 전년 대비 약 12%…</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">전세가격지수는 101.9로 2022년 10월 이후 최고 수준입니다.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa" text-anchor="end">매물</text>
  <rect x="60" y="494" width="960" height="112" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#38bdf8"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#38bdf8">순수 전세에서 월세로 바뀌는 전환과 가을 이사 시즌 위험이…</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">대출 한도가 계약 관문입니다. 노룩 계약은 거절하시기 바랍니다.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8" text-anchor="end">월세</text>
  <rect x="60" y="618" width="960" height="112" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="618" width="8" height="112" rx="4" fill="#c084fc"/>
  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc">실거주·허가구역·공급 불일치 논쟁은 전세 숫자와 다른 칸에…</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">공급은 느리고 규제는 빠릅니다. 급매수·급계약은 하지 마시기 바랍니다.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc" text-anchor="end">정책</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 갱신 없이 인상 88% · 평균 +4688만 · 매물 20432 · 지수 101.9 · 가을 이사</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
