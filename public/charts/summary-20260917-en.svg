  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b">SK Hynix explores US output by leasing Intel’s Ohio plant</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">It would be SK Hynix’s first-ever memory chip production on US soil.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">US talks</text>
