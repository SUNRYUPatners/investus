  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla crossed 200,000 registered vehicles in Norway</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">The Model Y alone now makes up more than half of all Teslas there.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">200,000</text>
