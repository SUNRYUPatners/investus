  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Morgan Stanley sees Nvidia taking 37.3% of HBM demand</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">Google gets 36% and AMD 12.1% — together about 85% of the market.</text>
