  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Shares rose more than 5% in a day after the Sept 22 flight 14 announcement.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">+$51.8B</text>
