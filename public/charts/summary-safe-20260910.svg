  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f7931a">비트코인이 8만 달러를 되찾지 못하고 7만 8천 달러권에 머물렀습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">약 7만 8,208~7만 8,273달러, 현물 ETF 4,665만 달러 유출입니다.</text>
