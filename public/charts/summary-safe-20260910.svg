  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">달러·엔이 153엔 안팎까지 내려가 2월 이후 엔 강세 구간입니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">캐리 청산 우려가 위험자산 부담으로 거론됐습니다.</text>
