  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#818cf8">이더리움은 약 2,464~2,488달러로 비트코인보다 조금 더 약했습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">24시간 약 −0.59% 설명이 있습니다. 알트 레버리지부터 줄이시기 바랍니다.</text>
