  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">암호화폐 청산 약 1억 5,187만 달러가 경계 심리로 붙었습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">가격 자체보다 거시 불확실성이 중심에 있다는 설명입니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">청산</text>
