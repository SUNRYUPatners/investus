  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">금은 온스 약 4,375~4,450달러권에서 헤지 수요를 받았습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">선물 약 4,450달러(+0.27%) 설명이 있습니다. 비트코인과 칸을 나누시기 바랍니다.</text>
