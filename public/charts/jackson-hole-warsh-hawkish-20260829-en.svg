<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0c1017"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#94a3b8"/><stop offset="100%" style="stop-color:#64748b"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#94a3b830" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">MACRO</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.29</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Warsh used his first Jackson Hole keynote to say rates can go</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">higher if inflation does not fall enough</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="314.5" y="166" width="451" height="46" rx="23" fill="#94a3b818" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#94a3b8" text-anchor="middle">🌐 Jackson Hole keynote · Aug 28, 2026</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🎤</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#94a3b8" text-anchor="middle">There is work left to do</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">He said that if he cannot be confident inflation is falling enough, there is still work left to do,</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">keeping another hike on the table.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">🎯</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">2%</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Inflation target</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Returning to target is now the</text>
  <text x="210" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">policy center</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">📊</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">54%</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Items up over 3%</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The pre-Covid 20-year average was</text>
  <text x="540" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">32%</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">🧮</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">4.1%</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">6-month annualized</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Recent improvement is not yet a</text>
  <text x="870" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">trend</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">"If I cannot be confident that inflation is falling enough, there is work left to do." He also said he</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">will not offer forward guidance on specific meetings, and noted that AI-related investment is</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">growing at the fastest pace since 2021.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">This effectively retires the rate-cut expectations that dominated early in the year. No forward guidance means</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">every meeting is data dependent, so the August jobs and CPI prints due in early September become the next real test.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Jackson Hole · Warsh first keynote · 2026.08.29</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>