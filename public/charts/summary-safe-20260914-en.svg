  <text x="116" y="608" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f97316">Oil fell about 2% on Hormuz talks but held above $100</text>
  <text x="116" y="638" font-family="Arial" font-size="17" fill="#9ca3af">Brent settled at $104.61, WTI at $100.05.</text>
