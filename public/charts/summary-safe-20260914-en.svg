  <text x="116" y="170" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f7931a">Bitcoin slipped near $77K awaiting this week's FOMC</text>
  <text x="116" y="200" font-family="Arial" font-size="17" fill="#9ca3af">CoinMarketCap showed $77,255; OKX showed $76,985.</text>
