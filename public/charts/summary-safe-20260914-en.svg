  <text x="116" y="462" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#facc15">Gold held $4,330-4,350 despite rising real yields</text>
  <text x="116" y="492" font-family="Arial" font-size="17" fill="#9ca3af">The 10-year yield hit 4.96%; Mideast tension is capping the drop.</text>
  <text x="985" y="484" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">$4,330</text>
