  <text x="116" y="316" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#818cf8">Ether underperformed Bitcoin, falling to about $2,505</text>
  <text x="116" y="346" font-family="Arial" font-size="17" fill="#9ca3af">Bitcoin's market share rose while Ether's edged lower.</text>
  <text x="985" y="338" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#818cf8" text-anchor="end">$2,505</text>
