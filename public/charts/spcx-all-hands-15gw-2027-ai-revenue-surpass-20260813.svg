  <text x="540" y="714" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">"우리의 AI 매출은 다음 달(9월)부터 다른 모든 SpaceX 매출을 초과할 것이고, 4분기에는 다른 모든 매출을</text>
