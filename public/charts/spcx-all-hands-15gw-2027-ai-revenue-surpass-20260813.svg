  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">15 GW</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Sawyer Merritt과 Kay가 전한 Musk 전 직원 회의에서 스페이스X의 2027년 말 AI 통신 용량 목표가 15</text>
