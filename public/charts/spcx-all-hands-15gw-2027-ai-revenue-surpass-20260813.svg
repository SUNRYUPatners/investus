  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Our AI revenue will exceed all other SpaceX revenue probably next month (September) and will significantly</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">exceed all other SpaceX revenue in Q4 · AI has become an extremely important part of SpaceX future</text>
