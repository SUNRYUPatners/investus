  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">분기에 확정되는 공시는 오늘 없습니다. 두 배라는 질문은 예 아니오의 시장이고, 전기 비중은 신용평가사의 시나리오입니다. 발전소</text>
  <text x="540" y="968" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">착공 건수와 이 비율을 같은 표에 두면 분모가 섞입니다. 2030년은 달력의 끝이고 올해 청구서는 그 전이 아닙니다. 신용평가</text>
