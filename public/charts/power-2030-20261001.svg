  <text x="540" y="758" font-family="Arial" font-size="17" fill="#94a3b8" text-anchor="middle">예측 시장은 미국 데이터센터 전력 수요가 2030년 전에 두 배가 되는지를 묻습니다. 무디스는 2030년 데이터센터가 미국</text>
