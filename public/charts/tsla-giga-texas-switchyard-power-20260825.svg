  <text x="540" y="688" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"기가 텍사스에 스위치야드가 약 아홉 달 만에 올라왔다는 설명이 나왔습니다. 스위치야드는 공장과 데이터 학습</text>
