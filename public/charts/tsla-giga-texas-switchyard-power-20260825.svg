  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">스위치야드는 고압 전력을 공장에 나누어 주는 변전 설비입니다. 오스틴 기가팩토리와 코텍스 인공지능</text>
