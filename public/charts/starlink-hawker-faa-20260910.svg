  <rect x="40" y="20" width="110" height="38" rx="19" fill="#c084fc30" stroke="#c084fc" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#c084fc" text-anchor="middle">SPCX</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">호커 700·800·900에 스타링크가 올라가고 에어로멕이 FAA 경로를</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">맡는다는 설명이 나왔습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#c084fc18" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">✈ 호커 · FAA</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">✈</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#c084fc" text-anchor="middle">1Gbps</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">비즈니스젯 호커 700·800·900 기종에 스타링크 단말이 장착되는 서사입니다. 에어로멕이 FAA(미 항공청)</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">인증 경로를 맡고, 속도는 내려받기 약 1Gbps·올리기 약 100Mbps·지연 약 20ms로 거론됐습니다.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">⬇</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">1Gbps</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">내려받기</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">기내 광대역 상한</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">⬆</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">100Mbps</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">올리기</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">화상·업로드용</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">⏱</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">~20ms</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">지연 시간</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">위성인데도 짧은 편</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">1Gbps는 항공기 단말 사양이지 전 세계 가입자 평균이 아닙니다. FCC 1,000MHz 스펙트럼 허가와 칸을</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">나누시기 바랍니다. 다음 확인할 것은 장착 대수와 인증 일정입니다.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">비즈니스젯은 고단가·소수 대수 시장입니다. 일반 항공·선박으로 바로 확장되지 않습니다. 장기적으로 항공기 연결은 스타링크 기업</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">매출 믹스를 두껍게 할 수 있습니다.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">스페이스X · 호커 스타링크 · 2026.09.10</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
