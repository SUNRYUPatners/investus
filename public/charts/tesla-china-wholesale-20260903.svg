  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">도매(wholesale)는 공장에서 출하된 대수, 소매(retail)는 고객 등록에 가깝습니다. 수출 비중이 크면 중국</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">내수 회복과 별개로 읽혀야 합니다.</text>
  <rect x="60" y="844" width="960" height="148" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="874" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">중국 숫자는 미국 사이버캡과 규제·수요 축이 다릅니다. 8월 +3.57%는 완만한 회복 신호일 수 있으나, BYD 등 현지 경쟁·가격 인하와</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">함께 ASP·마진을 분기 실적에서 확인하시기 바랍니다. 수출 58,917대는 유럽·아시아 수요와 연결됩니다.</text>
