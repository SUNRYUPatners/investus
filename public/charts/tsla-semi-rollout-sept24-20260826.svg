  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.26</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">테슬라 세미 롤아웃 행사가 2026년 9월 24일 네바다 스파크스에서</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">열립니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="250" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#4ade80" text-anchor="middle">9/24</text>
  <text x="540" y="310" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f9fafb" text-anchor="middle">세미 롤아웃</text>
  <text x="540" y="350" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026년 9월 24일 네바다 스파크스 공장에서 테슬라 세미 공개·</text>
  <text x="540" y="376" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">양산 일정이 묶인 행사가 열립니다. 대형 전기 트럭 상용 캘린더의 앵커입니다.</text>
  <rect x="120" y="390" width="840" height="100" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="540" y="450" font-family="Arial" font-size="18" fill="#e5e7eb" text-anchor="middle">"테슬라 세미 롤아웃이 2026년 9월 24일 스파크스에서 열린다고 알려졌습니다. 세미는 대형</text>
  <text x="540" y="474" font-family="Arial" font-size="18" fill="#e5e7eb" text-anchor="middle">화물용 전기 트럭입니다. 행사에서 생산·가격·충전·고객 인도 코멘트가 나올 수 있습니다. 같은</text>
  <text x="540" y="498" font-family="Arial" font-size="18" fill="#e5e7eb" text-anchor="middle">달 9월 3일 사이버캡 행사와 겹쳐, 하드웨어 실행력을 두 번 보여주는 달입니다."</text>

  <rect x="60" y="520" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="568" font-family="Arial" font-size="36" text-anchor="middle">🚛</text>
  <text x="210" y="612" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">세미</text>
  <text x="210" y="646" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">대형 전기트럭</text>
  <text x="210" y="706" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">화물용</text>
  <rect x="390" y="520" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="568" font-family="Arial" font-size="36" text-anchor="middle">🏭</text>
  <text x="540" y="612" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">스파크스</text>
  <text x="540" y="646" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">네바다 공장</text>
  <text x="540" y="706" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">생산 거점</text>
  <rect x="720" y="520" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="568" font-family="Arial" font-size="36" text-anchor="middle">📅</text>
  <text x="870" y="612" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">9월 24일</text>
  <text x="870" y="646" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">2026년</text>
  <text x="870" y="706" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">행사 일정</text>
  <rect x="60" y="760" width="960" height="200" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="800" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="840" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">9월에 사이버캡(3일)과 세미(24일) 촉매가 겹칩니다. 행사만 보고 매출을 당기지 마시고, 생산·총소유비용·충전·</text>
  <text x="540" y="864" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">인도 숫자를 보시면 됩니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 세미 9/24 · 2026.08.26</text>
