  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">AI server demand</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Dell’s medium-term axis</text>
