  <text x="540" y="768" font-family="Arial" font-size="17" fill="#a1a1aa" text-anchor="middle">+331% is the path after that buy date. A filing is not an earnings acceleration. Keep server orders and</text>
  <text x="540" y="791" font-family="Arial" font-size="17" fill="#a1a1aa" text-anchor="middle">margins on another cell.</text>
  <rect x="60" y="874" width="960" height="168" rx="14" fill="#141416" stroke="#a1a1aa" stroke-width="1"/>
  <text x="540" y="904" font-family="Arial" font-size="18" fill="#a1a1aa" text-anchor="middle">Why it matters</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A politician’s trade is an attention signal, not a valuation case. Do not mash with the NVL72 rack forecast. Next:</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Dell server sales and inventory. Lasting enterprise AI server demand can leave Dell an assembly-and-channel moat.</text>
  <text x="540" y="1056" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">DELL · +331% since filing · 2026.09.10</text>
