  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a1a1aa" text-anchor="middle">+331%</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">A public filing showed a Feb 10 Dell buy of up to $5 million. The stock later printed about +331% to</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">$535.25.</text>
