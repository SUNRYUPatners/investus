  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Start of the path</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#141416" stroke="#a1a1aa" stroke-width="1.5"/>
