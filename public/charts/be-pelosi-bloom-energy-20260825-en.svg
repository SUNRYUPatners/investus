  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Upper band</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Stock + calls</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">💻</text>
