  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Same filing</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="688" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">"Nancy Pelosi’s filing lists Bloom Energy stock and call buys. A call is the right to buy at a set</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">price. Amounts are ranges, not share counts. Intel calls and stock sit on the same table. Trades</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#f59e0b" text-anchor="middle">were late July; the file date is August 21."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.25</text>
  <rect x="60" y="838" width="960" height="140" rx="14" fill="#201408" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#f59e0b" text-anchor="middle">Why this matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Politician trades make headlines, but range filings are weak flow signals. Fuel cells overlap the datacenter power</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">theme. Keep conflict debate separate from fundamentals.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">BE · Pelosi filing · 2026.08.25</text>
