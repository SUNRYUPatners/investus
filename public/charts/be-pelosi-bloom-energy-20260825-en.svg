  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">Aug 21</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Filed</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Traded late July</text>
