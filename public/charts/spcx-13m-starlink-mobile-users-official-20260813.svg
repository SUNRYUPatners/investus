  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">"위협 과장" 폄하 대비 대량 사용자는 SPCX 통신 위협의 실체이며, 오늘 SPCX 5일 +40% 시세 상승의 근거가 됩니다.</text>
