  <text x="540" y="700" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"Tesla가 네바다 교통당국 회의에서 Austin 첫 공개 Cybercab 라이드가 임박하다고 밝혔다."</text>
