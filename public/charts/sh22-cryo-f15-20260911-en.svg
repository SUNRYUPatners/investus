  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A ground pass is not a launch license. Split from revenue-flight remarks. Next: static fire and a launch window.</text>
