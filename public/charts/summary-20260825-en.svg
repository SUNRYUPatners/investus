  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa">Metas AI infrastructure spend</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">Chip, power, and datacenter outlays could exceed $500 billion over the coming years.</text>
  <text x="970" y="684" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="end">$500B+</text>

