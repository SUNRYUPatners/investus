  <text x="116" y="784" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ff9900">Amazon Zoox is on city streets</text>
  <text x="116" y="822" font-family="Arial" font-size="18" fill="#9ca3af">Vehicles with no wheel or pedals run in San Francisco and charge for rides in Las Vegas.</text>

  <rect x="60" y="866" width="960" height="112" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
