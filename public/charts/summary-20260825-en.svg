  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80">Cybercabs are leaving the factory</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">Ahead of the September 3 Austin event, dedicated robotaxis are shipping from Giga Texas.</text>
  <text x="970" y="312" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="end">9/3</text>

