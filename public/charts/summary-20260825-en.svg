  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80">Germany is talking robotaxis</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">A German state is in talks with Tesla to deploy robotaxis in remote regions.</text>

