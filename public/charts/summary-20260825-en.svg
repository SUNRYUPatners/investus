  <text x="116" y="946" font-family="Arial" font-size="18" fill="#9ca3af">Net interest is about 3.2% of GDP, the highest share since 1991.</text>
  <text x="970" y="932" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="end">3.2%</text>

  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Also: Giga Texas power · 20M AI agents · gold and bitcoin · Bloom Energy buys</text>
