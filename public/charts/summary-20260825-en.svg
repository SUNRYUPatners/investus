  <rect x="60" y="370" width="8" height="112" rx="4" fill="#60a5fa"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa">Nvidia price target $325</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">Earnings are expected to beat estimates, with the next chip architecture as a growth driver.</text>
  <text x="970" y="436" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa" text-anchor="end">$325</text>

  <rect x="60" y="494" width="960" height="112" rx="14" fill="#0a0a14" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#c084fc"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#c084fc">AI compute is heading to orbit</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">The same chip design is framed for Grok on the ground and Starmind satellites in space.</text>

  <rect x="60" y="618" width="960" height="112" rx="14" fill="#0a1420" stroke="#1877f2" stroke-width="2"/>
