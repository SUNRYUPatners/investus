  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#f9fafb" text-anchor="middle">Nvidia NVLink Fusion</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a3e635" text-anchor="middle">$120B Partnership Estimate</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#1a2a08" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Nvidia's take from Intel + AMD adoption through the 2030s</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#a3e635" text-anchor="middle">$120B</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Intel $88B + AMD $55B adoption basis — connection fee model</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1a2a08" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#a3e635" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Total estimate</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#a3e635" text-anchor="middle">$120B</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Nvidia's portion</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Through the 2030s</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#65a30d" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Intel adoption</text>
  <text x="540" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#65a30d" text-anchor="middle">$88B</text>
  <text x="540" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Intel estimate</text>
  <text x="540" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">NVLink Fusion adoption</text>
  <rect x="730" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#a3e635" stroke-width="2"/>
  <text x="885" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">AMD adoption</text>
  <text x="885" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#a3e635" text-anchor="middle">$55B</text>
  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">AMD estimate</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">NVLink Fusion adoption</text>
  <rect x="40" y="632" width="1000" height="268" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">Background</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">NVLink Fusion is an open spec letting non-Nvidia chips join NVLink topology.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">Intel and AMD adoption extends Nvidia's network effect into x86 territory.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">The model captures a connection fee beyond the initial GPU sale — recurring.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">Citi maintains a Buy on NVDA with a $315 price target.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* Intel $88B + AMD $55B ≠ $143B — $120B is Nvidia's share after splits</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#0a1505" stroke="#a3e635" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#a3e635">Key Points</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">Becoming the infra standard lets Nvidia collect a toll on the whole chip industry.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">Recurring connection fees generate revenue independent of new GPU sales.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">Competitors adopting the standard paradoxically expands the Nvidia moat.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">Adoption schedule announcement converts $120B estimate to real contracts.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#65a30d">First contract disclosure is the proof-of-standard-status test.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · NVDA · NVLink Fusion</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">Adoption schedule converts the estimate — watch for first contract disclosure</text>
  <rect x="0" y="1280" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1318" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
