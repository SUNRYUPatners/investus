<text x="201.5" y="54" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="900">FSD</text><text x="54" y="104" font-family="Arial,sans-serif" font-size="24" fill="#8B949E">2026.10.19 · Tesla FSD 사용자 사례</text><text x="54" y="200" font-family="Arial Black,Arial,sans-serif" font-size="100" fill="url(#hG)" font-weight="900">87·83·92</text><text x="54" y="254" font-family="Arial,sans-serif" font-size="26" fill="#A7F3D0">세 — FSD가 노인 이동 자유를 되돌렸습니다</text><rect x="54" y="282" width="972" height="3" fill="url(#divG)" rx="2"/><rect x="54" y="314" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="314" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="462" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">92세</text><text x="114" y="502" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">세</text><text x="196" y="380" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">이웃에게 FSD 테스트 드라이브</text><text x="196" y="416" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">시켜줬는데 다음 날 바로 Model</text><text x="196" y="452" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">Y를 구매했습니다.</text><rect x="54" y="584" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="584" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="732" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">83세</text><text x="114" y="772" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">세</text><text x="196" y="650" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">야간에 손주 행사 참석, 겨울 저녁</text><text x="196" y="686" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">외식이 가능해졌습니다. FSD 98%</text><text x="196" y="722" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">수준. 정말 혁명입니다.</text><rect x="54" y="854" width="972" height="248" rx="16" fill="#161B22" stroke="#34D399" stroke-width="2"/><rect x="54" y="854" width="120" height="248" rx="16" fill="#34D39922"/><text x="114" y="1002" font-family="Arial Black,Arial,sans-serif" font-size="52" fill="#34D399" text-anchor="middle" font-weight="900">87세</text><text x="114" y="1042" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7" text-anchor="middle">세</text><text x="196" y="920" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">아버지가 Y로 거의 모든 곳을</text><text x="196" y="956" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">다닙니다. FSD 없었으면 고속도로는</text><text x="196" y="992" font-family="Arial,sans-serif" font-size="24" fill="#E6EDF3">못 타셨을 거예요.</text><rect x="54" y="1132" width="972" height="88" rx="16" fill="#0D1A14" stroke="#34D399" stroke-width="1.5"/><text x="84" y="1166" font-family="Arial,sans-serif" font-size="20" fill="#A7F3D0">FSD는 단순 자율주행이 아니라 이동 약자의 사회 </text><text x="84" y="1200" font-family="Arial,sans-serif" font-size="20" fill="#A7F3D0">참여를 확대하는 복지 기술로 자리잡고 있습니다</text><rect x="0" y="1278" width="1080" height="72" fill="#161B22"/>
