  <text x="540" y="646" font-family="Arial" font-size="19" fill="#22d3ee" text-anchor="middle">9월 30일 코스피에서 외국인은 2조 520억 원을 순매도했습니다. 기관은 7,680억 원 순매도, 개인은 1조</text>
