<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#120b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">POLICY</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.21</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Toheo occupancy deferral is extended to end-2027 and starts</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Oct 1</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">📋</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">Deferral+</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Buyers of tenanted homes get one more year before they must move in. One renewal can push that</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">to end-2029.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Before</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">End-2026</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">File by Dec 31 this year</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#a78bfa" text-anchor="middle">&#8594;</text>
  <rect x="600" y="356" width="420" height="168" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="810" y="400" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="middle">After</text>
  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#a78bfa" text-anchor="middle">End-2027</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">File by Dec 31 next year</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="210" y="592" font-family="Arial" font-size="32" text-anchor="middle">📅</text>
  <text x="210" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">Oct 1</text>
  <text x="210" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Start date</text>
  <text x="210" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The revision applies that day</text>
  <rect x="390" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="540" y="592" font-family="Arial" font-size="32" text-anchor="middle">🔁</text>
  <text x="540" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">+2 years</text>
  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">One renewal</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Move-in by end-2029 at latest</text>
  <rect x="720" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="870" y="592" font-family="Arial" font-size="32" text-anchor="middle">👤</text>
  <text x="870" y="634" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa" text-anchor="middle">May 12</text>
  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Homeless rule</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Must stay homeless from that day</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">The policy lengthens the lease window; it does not add completions. A two-year live-in duty after</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">move-in remains.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Deferral buys time; it does not add supply. The effect shows only if listings rise after October. The 2028 relocation</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">gap stays a separate line.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Policy · Occupancy deferral · 2026.09.21</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>