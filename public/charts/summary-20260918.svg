  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">테슬라 메가팩이 전 세계에 77기가와트시 넘게 깔렸습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">가동률 99.3%에 라스롭·텍사스 공장이 연 90기가와트시 규모로 돌아갑니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">77+GWh</text>
