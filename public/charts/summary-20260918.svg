  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스타십 14차 비행이 9월 22일에서 28일로 미뤄졌습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">첫 궤도 비행이자 스타링크 V3 위성 26기를 처음 실어 나르는 일정입니다.</text>
