  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">삼성 텍사스 테일러 공장에서 테슬라 AI5 칩 시험생산이 시작됐습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">2나노 공정 웨이퍼가 나와 양산 검증에 들어갔고, 칩은 2027년 공급을 목표로 합니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">2nm</text>
