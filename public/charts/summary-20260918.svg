  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">Nebius가 10월 1일부터 GPU 임대료를 약 20% 올린다고 알렸습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">인공지능 연산 수요가 렌탈 가격을 밀어 올리는 신호입니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">+20%</text>
