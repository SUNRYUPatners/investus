  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">외국인이 미국 주식을 국채보다 더 산 것은 이번 세기 세 번째입니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">해외 자금이 안전자산보다 미국 기업 지분을 택한 드문 흐름입니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">주식&gt;국채</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 스타십 9/28 · 메가팩 77GWh · 삼성 테일러 AI5 · 스페이스X 시총 · Nebius +20% · 사이버캡 요금 · 외국인 주식매수</text>
