  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">사이버캡 요금이 마일당 30~40센트로 거론됐습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">오스틴 실차에는 운전대와 페달이 없고, 객실 조명이 음악에 맞춰 움직입니다.</text>
