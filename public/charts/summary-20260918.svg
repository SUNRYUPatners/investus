  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스페이스X 주가가 한 달 고점 근처에서 시총 510억 달러를 더했습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">실패한 스타트업 데이터를 인공지능 학습에 쓰려는 논의가 같이 나왔습니다.</text>
