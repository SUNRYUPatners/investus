  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Polymarket puts 52% odds on a Tesla-SpaceX merger by end-2027</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">Musk dodged a direct answer, citing how closely the two firms already collaborate.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">52%</text>
