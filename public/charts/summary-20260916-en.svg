  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla now discounts insurance up to 60% for FSD drivers</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">A $175/mo premium plus the FSD subscription nets out near $40/mo effectively.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">60%</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla’s European weekly sales rebounded more than 88%</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Still, the quarter-to-date total remains below last year’s pace.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">+88%</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#ef4444"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">The US 10-year Treasury yield hit its highest level since 2007</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">Rising oil prices and inflation worries pushed yields higher.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">5.04%</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">China opened a factory making a humanoid robot every 10 minutes</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">Described as the world’s first mass-production line of its kind.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">every 10min</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#1a0d02" stroke="#f97316" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#f97316"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f97316">Supertanker charter rates topped $1 million a day for the first…</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">Surging freight costs are adding to global shipping expenses.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">$1M/day</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Tesla-SpaceX merger odds · Starship 9/22 · FSD insurance discount · Europe sales rebound · 10Y yield 5%+ ·</text>
  <text x="540" y="1032" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">China robot factory · Tanker rates</text>
