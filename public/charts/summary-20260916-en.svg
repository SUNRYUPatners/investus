  <rect x="60" y="247" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX locked in Sept 22 for Starship’s 14th test flight</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">The first flight to reach orbit, deploying 26 new Starlink V3 satellites.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">Sept 22</text>
