  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">보도에 따르면 여성 운전자는 "차체가 부서지는 와중에도 크게 다치지 않았다"며 모델Y의 충돌 구조를 신뢰해</text>
