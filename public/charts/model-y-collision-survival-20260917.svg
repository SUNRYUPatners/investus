  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">모델Y는 테슬라의 준중형 SUV입니다. 불법 좌회전 차량과 정면으로 부딪히는 큰 충돌이었지만, 탑승자는</text>
