  <text x="870" y="438" font-family="Arial" font-size="40" text-anchor="middle">🚫</text>
  <text x="870" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">개인 비매</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">오늘 기준 고지</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">플릿·호출 먼저</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">당국이 「완전 자동화로 가는 길」 톤으로 레벨4를 설명하며, 핸들·페달 없는 그림을 올렸습니다. 이는</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">사이버캡(운전석 없는 전용 로보택시) 설계와 맞닿습니다. 동시에 오늘 소비자가 사서 탈 제품은 아니라고 명시해,</text>
  <text x="540" y="706" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">매출은 플릿·호출이 먼저입니다.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">규제 언어가 차량 형태와 정렬되면 허가 협상 비용이 줄어들 수 있습니다. 지오펜스(지정 운행 구역) 확장이 곧 매출 속도이며, 당국</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">가이드·조사·리콜을 캘린더에 두시기 바랍니다. SAE 정의와 상용 허가는 별도 칸입니다. 장기적으로는 문서와 실제 운행이 겹칠수록</text>
  <text x="540" y="912" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">로보택시 상용 일정이 달력으로 내려옵니다.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">테슬라 · 레벨4 규제 · 2026.09.08</text>
