  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.08</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">당국이 레벨4를 「완전 자동화로 가는 길」로 설명하며 무핸들 그림을</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">올렸습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">📋</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">레벨4</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">레벨4(자율주행 4단계)는 켜지면 시스템이 운전하고 사람은 승객이며, 지정 구역에서만, 사람 운전자가 필요</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">없습니다. 오늘 소비자 개인 구매 상품은 아니라고 명시합니다.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">🛣</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">레벨4</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">시스템이 운전</text>
  <text x="210" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">사람은 탑승만</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">🎛</text>
  <text x="540" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">핸들 없음</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">당국이 올린 그림</text>
  <text x="540" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">페달도 없음</text>
