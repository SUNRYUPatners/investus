<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0a10"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#fb7185"/><stop offset="100%" style="stop-color:#f43f5e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#fb718530" stroke="#fb7185" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#fb7185" text-anchor="middle">MUSK</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.23</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Musk said AI will beat all fields by the end of next year, or</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">2028 at the latest</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#fb718518" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#fb7185" text-anchor="middle">Remark · not a ship date</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">💬</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#fb7185" text-anchor="middle">2027–28</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Beating all fields reads as outperforming people on tests and jobs. It is not a product-release</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">date.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">📅</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb7185" text-anchor="middle">Next year</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The fast slot is year-end nex…</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">That reads as end-2027</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">🕒</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb7185" text-anchor="middle">2028</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The slower slot is that year…</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">One extra year of slack</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">🧠</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb7185" text-anchor="middle">Talk</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">A goal, not a contract</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Permits and safety stats sit on</text>
  <text x="870" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">another line</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#fb7185" text-anchor="middle">A claim that intelligence grows is not the month a car drives alone. It is one remark.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#201018" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#fb7185" text-anchor="middle">Why it matters</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When a founder names a year, investor clocks move forward. It is not a locked calendar. Next, watch product</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">versions and permits.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Musk · AI timeline · 2026.09.23</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>