  <text x="540" y="892" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">온도를 보여 주는 참고 지표가 됩니다. 반도체·자동차가 수출로 움직인다면, 네이버는 국내 소비와 기업 광고비로</text>
