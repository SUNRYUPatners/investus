  <text x="540" y="874" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Plus 5.68% beat the index for the market leader. Do not blend buybacks/other-corps with foreign flow on one screen.</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Pair relative performance and the won before this week’s inflation and FOMC. Next: 270,000 support and whether</text>
