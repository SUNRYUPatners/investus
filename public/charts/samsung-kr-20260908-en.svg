  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">270,000</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Plus 5.68% on Sep 7. With Hynix, ~2.25T foreign focus was cited. A 400k PT is a medium-term</text>
