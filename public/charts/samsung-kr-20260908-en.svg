  <text x="540" y="686" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">One-day foreign buying is a flow anchor, not demand proof. PT raises are consensus</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">opinions—weight them apart from the print. Write a 270,000 scaling rule in a sentence.</text>
