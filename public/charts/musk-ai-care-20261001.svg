  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">범위가 섞입니다. 인터뷰에서 든 사례는 그가 본 자리입니다. 병원 도입이나 보험 적용은 규제 문서가 나와야 일정입니다. 영상 판독</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">일화와 생활 정리 도움은 범위가 다릅니다. 허가 번호가 없는 인터뷰로 남깁니다. 영상 판독 일화와 일정 정리를 같은 정확도로</text>
