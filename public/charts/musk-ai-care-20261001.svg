  <text x="540" y="648" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">9월 30일 인터뷰에서 머스크는 인공지능이 사람들이 생활과 일을 정리하는 데 도움이 된다고 했습니다. 의사가 틀린</text>
