  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🧊</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">B22</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Booster 22 passed two cryo proofs on Sep 9 and 10. Ship 42 finished its campaign earlier this month.</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Another vehicle waits behind the one on the pad.</text>
