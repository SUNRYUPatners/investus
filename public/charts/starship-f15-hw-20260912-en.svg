  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the photos show</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">📍 Three frames of a stacked vehicle on the Starbase tower</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">🧊 Cryo fills tanks with cold propellant to hunt leaks</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">🚀 A ground test, not a launch success</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A spare on the pad shortens the gap. Today printed 22 and 42. Over 3–5 years a weekly rhythm can make rockets read</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">like logistics.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · Flight 15 hardware · 2026.09.12</text>
