  <rect x="60" y="400" width="300" height="200" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="210" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Booster</text>
  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#c084fc" text-anchor="middle">22</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Cryo Sep 9–10</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">A ground leak check</text>
