  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">연준이 기준금리를 0.25%p 올렸습니다. 2023년 이후 첫 인상입니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">12명 전원 찬성, 새 의장 케빈 워시 취임 첫 회의에서 나온 결정입니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">3.75~4%</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">테슬라 오스틴 로보택시 기지에 하루 840대분 전력이 들어옵니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">9월 2일 접수된 허가 서류로 사이버캡 확장을 준비하는 것으로 보입니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">430~840대</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스타십 발사 예고에 스페이스X 시총이 500억 달러 넘게 뛰었습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">9월 22일 14차 시험비행 발표 이후 주가가 하루 5% 넘게 올랐습니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">+518억불</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">테슬라가 노르웨이에서 등록 차량 20만대를 돌파했습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">모델Y 한 종류가 노르웨이 테슬라의 절반을 넘습니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">20만대</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">모건스탠리가 엔비디아 HBM 수요 점유율을 37.3%로 추산했습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">구글 36%, AMD 12.1%로 세 회사가 수요의 85%를 가져갑니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">37.3%</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#f59e0b"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b">SK하이닉스가 인텔 공장 빌려 미국 메모리 생산을 검토합니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">실현되면 SK하이닉스의 첫 미국 내 메모리 칩 생산이 됩니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">美생산 검토</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">미국 최대 모기지 대출사 UWM이 8개월 연속 하락했습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">역대 최장 하락 기록이며 지난달엔 사상 최대 하루 낙폭을 냈습니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">8개월</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 연준 0.25%p 인상 · 오스틴 로보택시 전력망 · 스타십 시총 급등 · 노르웨이 20만대 · 엔비디아 HBM 37% · SK하이닉스</text>
  <text x="540" y="1032" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">미국생산 · UWM 8개월 하락</text>
