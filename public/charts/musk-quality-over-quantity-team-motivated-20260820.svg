  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">일론 머스크가 자신의 팀 구성 원칙을 다시 밝혔다. 극도로 동기 있는 소수의 뛰어난 사람들이 평범하고</text>
