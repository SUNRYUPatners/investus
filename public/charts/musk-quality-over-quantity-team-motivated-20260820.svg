  <text x="540" y="700" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"작지만 예외적인 사람들로 구성된 팀이 대규모 평범한 팀보다 훨씬 낫다. 극도로 동기 있는 사람들이</text>
