  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.29 한장 요약</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="136" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="136" rx="4" fill="#c084fc"/>
  <text x="116" y="157" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#c084fc">스타십 14번째 비행이 첫 궤도에 들어간 뒤 하와이 북쪽 태평양에</text>
  <text x="116" y="184" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#c084fc">떨어졌습니다</text>
  <text x="116" y="214" font-family="Arial" font-size="17" fill="#9ca3af">함선 41호기입니다. 스타링크 3세대 26기를 전개했고 연락이 전부 붙었습니다.</text>
  <text x="985" y="190" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">첫 궤도</text>
  <rect x="60" y="268" width="960" height="136" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="268" width="8" height="136" rx="4" fill="#a78bfa"/>
  <text x="116" y="303" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">이번 발사가 스타링크 내려받기 용량 약 26테라비트를 한 번에</text>
  <text x="116" y="330" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">올렸다는 화면이 있습니다</text>
  <text x="116" y="360" font-family="Arial" font-size="17" fill="#9ca3af">3세대 한 대는 약 1테라비트입니다. 팰컨9 2세대 미니의 약 열 배로 적혔습니다.</text>
  <text x="985" y="336" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">26 Tbps</text>
  <rect x="60" y="414" width="960" height="136" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="414" width="8" height="136" rx="4" fill="#4ade80"/>
  <text x="116" y="449" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#4ade80">아랍에미리트가 테슬라 감독 완전자율주행 검증을 규제 실험실에</text>
  <text x="116" y="476" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#4ade80">올렸습니다</text>
  <text x="116" y="506" font-family="Arial" font-size="17" fill="#9ca3af">두바이 모빌리티 랩은 248개 시나리오입니다. 통과 숫자가 아닙니다.</text>
  <text x="985" y="482" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">FSD</text>
  <rect x="60" y="560" width="960" height="136" rx="14" fill="#0a1a0a" stroke="#22c55e" stroke-width="2"/>
  <rect x="60" y="560" width="8" height="136" rx="4" fill="#22c55e"/>
  <text x="116" y="595" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#22c55e">미국 테슬라 할부 이율이 트림마다 0.50%포인트 올랐다는 표가</text>
  <text x="116" y="622" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#22c55e">떴습니다</text>
  <text x="116" y="652" font-family="Arial" font-size="17" fill="#9ca3af">모델3 프리미엄은 2.49%, 모델Y 베이스·프리미엄은 1.99%입니다.</text>
  <text x="985" y="628" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22c55e" text-anchor="end">+0.50%p</text>
  <rect x="60" y="706" width="960" height="136" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="706" width="8" height="136" rx="4" fill="#fb7185"/>
  <text x="116" y="754" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb7185">로드스터 행사가 심한 날씨 때문에 10월 15일로 미뤄졌습니다</text>
  <text x="116" y="801" font-family="Arial" font-size="17" fill="#9ca3af">야외 행사이고 원래는 10월 1일이었습니다.</text>
  <text x="985" y="774" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">10/15</text>
  <rect x="60" y="852" width="960" height="136" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="852" width="8" height="136" rx="4" fill="#ef4444"/>
  <text x="116" y="900" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#ef4444">미국 9월 소비심리 최종치가 48.1로 찍혔습니다</text>
  <text x="116" y="947" font-family="Arial" font-size="17" fill="#9ca3af">8월 51.7, 지난해 같은 달 55.1입니다. 현재 50.9, 기대 46.3입니다.</text>
  <text x="985" y="920" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">48.1</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 첫 궤도 · 26기 · 아랍에미리트 검증 · 할부 +0.50%p · 로드스터 10/15 · 심리 48.1</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
