<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.08.29 Korea property snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="112" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="112" rx="4" fill="#38bdf8"/>
  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#38bdf8">Seoul apartment prices rose 0.29% on the week</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">That is up from 0.22% and the fastest pace in six weeks.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8" text-anchor="end">0.29%</text>
  <rect x="60" y="246" width="960" height="112" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="246" width="8" height="112" rx="4" fill="#ef4444"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#ef4444">Gangnam fell 0.11%, a third straight weekly drop</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">Seocho slipped 0.05% and the pace of decline widened.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444" text-anchor="end">GANGNAM</text>
  <rect x="60" y="370" width="960" height="112" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="370" width="8" height="112" rx="4" fill="#4ade80"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80">Jungnang led all Seoul districts with 0.56%</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">Seongbuk and Gangbuk rose 0.55%, Dobong and Nowon 0.54%.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80" text-anchor="end">0.56%</text>
  <rect x="60" y="494" width="960" height="112" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#a78bfa"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa">The southeast district group slowed to 0.03%</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">It has cooled every week from 0.18% on July 20.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa" text-anchor="end">0.03%</text>
  <rect x="60" y="618" width="960" height="112" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="618" width="8" height="112" rx="4" fill="#fb923c"/>
  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#fb923c">Seoul jeonse prices rose 0.22% on the week</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">That is up from 0.19%, and Gyeonggi accelerated to 0.19%.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c" text-anchor="end">JEONSE</text>
  <rect x="60" y="742" width="960" height="112" rx="14" fill="#0f1419" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="742" width="8" height="112" rx="4" fill="#94a3b8"/>
  <text x="116" y="784" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#94a3b8">The jeonse trust scheme posts terms in September</text>
  <text x="116" y="822" font-family="Arial" font-size="18" fill="#9ca3af">Applications open in October and move-ins begin in December.</text>
  <text x="985" y="808" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8" text-anchor="end">TRUST</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch next: Seoul +0.29% · Gangnam -0.11% for a third week · Jungnang +0.56% · southeast +0.03% · jeonse +0.22% ·</text>
  <text x="540" y="1032" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">trust terms in late September</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>