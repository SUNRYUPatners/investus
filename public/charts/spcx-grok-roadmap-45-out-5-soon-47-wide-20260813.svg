  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Grok roadmap: 4.5 is out - 5 soon - 4.7 will be wide, really pretty good ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Grok will be trained on the entire sum of SpaceX knowledge · Employees will be the "parents" of the AI ·</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Elon Musk All-Hands · Kay · 2026.08.12</text>
