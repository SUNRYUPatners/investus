  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Musk 전 직원 회의에서 Grok 시리즈 로드맵이 공개됐습니다. Grok 4.5는 이미 출시 완료·Grok 5는 곧 등장·</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Grok 4.7은 광범위 배포 예정이며 "정말 좋을 것"이라고 강조했습니다. xAI가 Grok를 통해 SpaceX 지식</text>
