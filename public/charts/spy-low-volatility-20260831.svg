  <text x="540" y="686" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">변동성이 낮다는 것은 가격이 조용히 움직였다는 뜻이지, 위험이 사라졌다는 뜻은 아닙니다. 잭슨홀 매파 발언</text>
