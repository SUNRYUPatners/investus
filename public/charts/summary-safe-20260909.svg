  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#94a3b8">달러·금리 경로가 공통 분모로 다시 올라왔습니다</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">8월 소비자물가(9월 11일)·연방공개시장위원회(15~16일)가 같은 주 캘린더입니다.</text>
