  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f97316">브렌트 약 98달러 급등이 위험·안전자산 경계를 흔들었습니다</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">중동 타격 서사와 겹칩니다. 금·비트코인과 칸을 나누시기 바랍니다.</text>
