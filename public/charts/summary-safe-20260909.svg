  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#facc15">금이 온스 약 4,400달러 부근을 지키며 연준 9월 16일 회의…</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">폴리마켓 인상 약 51.5%·동결 약 47.5%, 씨엠이 선물은 종종 58~66%로 더 높습니다.</text>
