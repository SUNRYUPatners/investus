  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#cbd5e1">은은 헤지와 산업 수요가 겹쳐 금·유가와 다른 줄로…</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">금은비율과 달러를 같이 보시면 착시가 줄어듭니다.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#cbd5e1" text-anchor="end">은</text>
