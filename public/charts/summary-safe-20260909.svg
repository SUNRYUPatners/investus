  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f7931a">비트코인이 약 7만 8,300~7만 8,500달러로 8만 달러를 내…</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">안전자산처럼 보이지만 레버리지 청산 속도는 암호화폐입니다.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f7931a" text-anchor="end">BTC</text>
