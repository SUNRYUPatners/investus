  <text x="540" y="726" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">스페이스X가 오늘 다시 역사를 쓰려 합니다. 하루에 로켓 세 발입니다. 크루 13은 팰컨 9, 트랜스포터 18은 팰컨 9,</text>
  <text x="540" y="750" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">NROL-97은 팰컨 헤비입니다. 180개 넘는 나라는 자국 궤도 로켓을 세 발도 못 올린 전체 역사입니다. 스페이스X는 오늘 세</text>
