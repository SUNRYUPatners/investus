  <text x="540" y="798" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">보냈다고 올렸습니다.</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">유인, 라이드셰어, 국가정찰국 기밀이 하루에 겹칩니다. 구글 선캐처 TPU 4개도 트랜스포터 18에 실렸습니다. 다음 확인할 것은 세</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">발 모두 궤도에 올랐는지입니다. 한 발이 성공해도 하루 세 발의 기록은 세 칸이 닫혀야 완성입니다. 크루 13 도킹 시각이 그다음</text>
