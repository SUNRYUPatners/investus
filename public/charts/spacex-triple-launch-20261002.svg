  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">크루 13은 미국·캐나다·러시아 4명을 정거장으로 보냈습니다</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">세 칸이 닫혀야 하루 세 발의 기록이 완성됩니다</text>
