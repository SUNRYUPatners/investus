<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#052015"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#10b981"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="165" height="38" rx="19" fill="#34d39930" stroke="#34d399" stroke-width="1.5"/>
  <text x="122.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle">KB FINANCIAL</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.18</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">KB Financial rose 1.41% to 178,700 won as banks firmed the</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">day after the Fed hike</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">🏦</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">+1.41%</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">KB Financial is the holding company for Kookmin Bank. It closed 1.41% higher at 178,700 won on</text>
  <text x="540" y="369" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 17, outpacing a flat KOSPI.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="396" width="300" height="196" rx="16" fill="#08251c" stroke="#34d399" stroke-width="2"/>
  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">📈</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">₩178,700</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Close</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A top-cap financial</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#08251c" stroke="#34d399" stroke-width="2"/>
  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">🌐</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">Fed hike</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">25bp the prior day</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Net-interest-margin hopes</text>
  <text x="540" y="579" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">attached</text>
  <rect x="720" y="396" width="300" height="196" rx="16" fill="#08251c" stroke="#34d399" stroke-width="2"/>
  <text x="870" y="448" font-family="Arial" font-size="40" text-anchor="middle">💱</text>
  <text x="870" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle">FX</text>
  <text x="870" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">₩1,382</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Banks still firmed with a weak won</text>
  <rect x="60" y="610" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="656" font-family="Arial" font-size="19" fill="#34d399" text-anchor="middle">Higher policy rates can widen the gap between loan and deposit rates — net interest margin. That</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#34d399" text-anchor="middle">is why KB gained more than 1% on a flat KOSPI day.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#08251c" stroke="#34d399" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#34d399" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Rate hikes lift equity discount rates but can help bank margins. For 1.41% to become a trend, domestic rates and loan</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">demand have to follow. Next: relative strength in Korean banks this week.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">KB Financial · Stock · 2026.09.18</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>