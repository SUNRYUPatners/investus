  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">슬로베니아에 완전자율주행 두 달 무상 제공이 거론됐습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">97.2%·177.7마일 스트릭과 다른 화면의 숫자입니다.</text>
