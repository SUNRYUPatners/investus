  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스타링크 라우터 4가 와이파이 7·기기 510대를 찍었습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">무게는 약 0.9파운드입니다. 가입자 속도와 다른 화면의 숫자입니다.</text>
