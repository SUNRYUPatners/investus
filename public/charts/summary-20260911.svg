  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">미국 10년물이 4.92%로 올라 2023년 10월 이후 최고권입니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">하루 +0.08%포인트입니다. 생산자물가 5.4%와 다른 화면의 숫자입니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">10년</text>
