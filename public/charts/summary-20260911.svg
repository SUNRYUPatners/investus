  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">보링컴퍼니가 30억 달러 조달에 기업가치 230억 달러를 표기했습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">아랍에미리트 터널 150km 이상이 붙었습니다. 테슬라 시총과 따로 보시면 됩니다.</text>
