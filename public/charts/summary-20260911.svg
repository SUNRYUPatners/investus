  <rect x="60" y="622" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">보링컴퍼니가 30억 달러를 모아 기업가치 230억 달러를 찍었습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">아랍에미리트가 주도했고 터널 150km 이상이 붙었습니다. 라스베이거스·내슈빌·두바이 루프입니다.</text>
