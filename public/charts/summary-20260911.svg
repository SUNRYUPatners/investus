  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">슬로베니아에서 완전자율주행을 두 달 무상으로 쓸 수 있습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">요금 없이 차로·감속을 체험하는 기간입니다. 유럽 소국 하나의 안내입니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">FSD</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">다음 스타십 비행이 매출을 내는 비행이 될 수 있다는 확신이 나왔습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">시험이 아니라 고객 화물을 실어 돈을 받는 단계로 넘어간다는 표현입니다. 연간 반복매출 1,000억 달러 확신이…</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">스타십</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 라우터4 · Cd0.2 · 온톨로지 · 10년 4.92% · 보링 230억 · 슬로베니아 · 스타십 매출</text>
