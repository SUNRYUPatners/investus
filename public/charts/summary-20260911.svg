  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">팔란티어가 엔터프라이즈 스택의 핵심이라는 발언이 나왔습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">주권 인공지능 스택과 다른 화면의 숫자입니다. 내부자 매도와도 분리합니다.</text>
