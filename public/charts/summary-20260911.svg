  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스타링크 라우터 4가 와이파이 7·기기 510대·3,500평방피트를…</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">무게 약 0.9파운드, 이더넷 단자 두 개입니다. 집 안 공유기 스펙이 나온 날입니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">라우터</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">사이버캡이 공기저항 0.2 미만, 전비 165와트시/마일로 소개됐습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">눈물방울 차체와 테슬라 첫 전륜구동입니다. 양산 전기차 가운데 전기를 가장 적게 쓴다고 했습니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">캡</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#06121f" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">팔란티어가 세계에서 가장 중요한 기업용 스택이라는 발언이 나왔습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">온톨로지·파운드리·AIP와 엔비디아 칩을 한 세트로 쓰는 그림입니다. 핵심 공급망에 주권 인공지능을 붙입니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">NVDA</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#ef4444"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">미국 10년물이 4.92%로 올라 2023년 10월 이후 최고권입니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">하루 +0.08%포인트입니다. 2023년 말 3.86%에서 다시 이 높이입니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">10년</text>
