  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">사이버캡 공기저항이 0.2 미만, 전비 165와트시/마일로 찍혔습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">테슬라 첫 전륜구동으로 설명됐습니다. 마일당 원가 의견과 다른 화면의 숫자입니다.</text>
