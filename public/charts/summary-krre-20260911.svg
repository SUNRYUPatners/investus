  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">9월 1주 서울 아파트 매매가 0.20%, 전세가 0.19% 올랐습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">오름폭은 한 주 전보다 줄었습니다. 강남과 강북 온도가 갈렸습니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">서울</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">강남·서초·송파 매매가 모두 내렸습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">강남 −0.35%·서초 −0.30%·송파 −0.02%입니다. 서울 평균과 칸을 나눕니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">강남3</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#38bdf8"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8">강북 14개구 매매는 0.33% 올랐습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">강북구 0.46%·도봉 0.43%입니다. 강남 약세와 키를 맞추시기 바랍니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">강북</text>
