  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c">노원 전세가 0.38% 오르고 서초 전세는 0.21% 내렸습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">강남 전세 −0.03%입니다. 도시 평균만 보고 계약하지 마시기 바랍니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">전세</text>
