  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee">브라운스톤 목동은 전체 85세대, 일반분양은 29세대입니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">계약은 9월 11~12일입니다. 서울 공급 가뭄과 한 단지를 따로 보시면 됩니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">공급</text>
