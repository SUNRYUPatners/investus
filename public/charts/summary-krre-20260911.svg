  <rect x="60" y="747" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">서초 전세 약세는 잠원·반포 입주 영향으로 설명됐습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">4주 연속 하락입니다. 매매 약세와 다른 화면의 숫자입니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">입주</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#0c1017" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">구별 실거래와 전세대출 한도가 계약 관문입니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">노룩 계약은 거절하시기 바랍니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">계약</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 서울 매매 +0.20% · 강남 −0.35% · 노원 전세 +0.38% · 목동 85세대 · 일반 29</text>
