  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">나머지 업체 합산</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">엔비디아·구글·AMD 세 회사가 전체 HBM 수요의 약 85%를 차지한다는 계산이 나옵니다.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">HBM을 만드는 SK하이닉스·마이크론·삼성전자 입장에서는 이 세 회사가 가장 중요한 고객이 되는 셈입니다.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">모건스탠리 애널리스트 베스 킨디그는 "엔비디아 37.3%, 구글 36%, AMD 12.1%로 15%만 다른 업체들에 남는다"고</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">분석했습니다.</text>
