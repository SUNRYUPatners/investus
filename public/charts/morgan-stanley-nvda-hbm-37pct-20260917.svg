  <text x="540" y="880" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">HBM은 생산 능력이 제한적인 고부가 메모리라, 큰 고객사의 수요 비중이 곧 메모리 회사들의 매출 방향을 좌우합니다. 엔비디아의</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">점유율이 유지되는지, 구글·AMD의 자체 칩 수요가 얼마나 커지는지가 다음 관전 포인트입니다.</text>
