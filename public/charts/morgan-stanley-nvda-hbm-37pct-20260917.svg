  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#60a5fa" text-anchor="middle">37.3%</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">HBM(고대역폭메모리)은 AI 반도체에 붙는 고성능 메모리입니다. 엔비디아 한 회사가 전체 수요의 3분의 1 이상을</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">가져간다는 분석입니다.</text>
