  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">운전석 없는 공간</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">⚡</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">6.1</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">마일/kWh</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">47.6kWh·3,113lbs와 같이</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">전비 6.1은 에너지 칸이고, 골드만 30센트는 의견 칸입니다. 무도장·페인트샵 −70%와 스펙을 한 결론으로</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">합치지 마시기 바랍니다. 다음 확인할 것은 실주행 전비입니다.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">스펙 시트는 설계 목표에 가깝습니다. 양산 공차·보험이 비기 전입니다. 어제 6.1마일 현장과 각도가 겹치면 폭·화면·무게를 추가한</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">표로 갱신하시기 바랍니다. 장기적으로 낮은 전비는 로보택시 요금의 바닥을 내립니다.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">테슬라 · 사이버캡 스펙 · 2026.09.10</text>
