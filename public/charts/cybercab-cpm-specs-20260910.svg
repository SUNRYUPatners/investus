  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">사이버캡이 완전 적재 마일당 원가에서 가장 낮고 폭 69인치·화면</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">22인치·전비 6.1마일로 적혔습니다</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#4ade8018" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">📐 스펙 · 전비</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">📐</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">6.1</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">완전 적재 원가는 차값·에너지·보험·정비를 한 마일에 나눈 값입니다. 폭 69인치, 화면 22인치, 배터리</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">47.6kWh, 전비 6.1마일/kWh, 무게 3,113파운드, 레그룸 43.4인치가 같은 표에 있습니다.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">📏</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">69″</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">차체 폭</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">도시 차로에 맞춘 크기</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">🖥</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">22″</text>
