  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">+7.79%</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Jeonse is a large-deposit rental. Through the second week of September the year-to-date</text>
