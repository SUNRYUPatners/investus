  <text x="540" y="686" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Seoul completions this year are slated at 26,951, 27.4% below last year’s 37,103. Jeonse can</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">rise even with high rates when supply, not the cost of money, sets the price.</text>
