  <text x="540" y="776" font-family="Arial" font-size="18" fill="#facc15" text-anchor="middle">Surging oil is lifting inflation expectations, adding pressure for central banks to tighten.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#1c1805" stroke="#facc15" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#facc15" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The 10-year Treasury yield near 4.97-4.99% raises the cost of holding non-yielding gold. Still, the World Gold Council</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">says central-bank buying rose 62% YoY in Q2, keeping long-term demand solid. Next: watch the Sept 16 FOMC</text>
  <text x="540" y="984" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">decision.</text>
