  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.21</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul apartment jeonse renewals reached 51.1% of this</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">year’s deals</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="86" font-weight="900" fill="#fb923c" text-anchor="middle" opacity=".15">🏠</text>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#fb923c" text-anchor="middle">🏠</text>
  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">51.1%</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">From January through Sept 20, 41,145 of 80,480 Seoul apartment jeonse deals were</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">renewals, up 10 points from 41.1% a year earlier.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="402" width="300" height="220" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">📍</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#fb923c" text-anchor="middle">61.5%</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Jungnang</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The highest share in Seoul</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">📍</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#fb923c" text-anchor="middle">57.8%</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Gangseo</text>
  <text x="540" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Seongbuk was next at 57.3%</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📅</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#fb923c" text-anchor="middle">+10pp</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">One-year rise</text>
  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Renewals overtook new leases</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Listings shrank after the Oct 15 rules, so more tenants stayed put. August’s 51.3% monthly</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">share points the same way.</text>
  <rect x="60" y="844" width="960" height="148" rx="14" fill="#20130a" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="874" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A renewal share above half means new listings are scarce. The test is whether new deals revive after the October</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">deferral. Agreed renewals can move outside the 5% cap.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Jeonse · Renewals · 2026.09.21</text>
