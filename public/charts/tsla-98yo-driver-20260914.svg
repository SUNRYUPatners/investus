  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"80년 동안 운전을 해 왔고 신기함이 사라졌다. 차가 스스로 운전하고 실수하지 않아서 이 차를 샀다"고</text>
