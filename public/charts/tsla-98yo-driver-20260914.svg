  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">98세</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">80년 넘게 운전해 온 이 남성은 최근 테슬라를 사서 완전자율주행이 대신 운전하게 하고 있습니다. 차가</text>
