  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">완전자율주행은 운전자가 지켜보며 소프트웨어가 조향·가속·차선 변경을 대신하는 감독 모드입니다. 고령 운전자는 반응 속도가</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">느려질 수 있어 사고 위험이 상대적으로 높다고 알려져 있습니다. 이런 개인 경험이 쌓이면 소프트웨어에 대한 신뢰가 넓어질 수</text>
  <text x="540" y="944" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">있습니다.</text>
