<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#06121f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="146" height="38" rx="19" fill="#60a5fa30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="113" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">NVDA · HBM</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Morgan Stanley estimates Nvidia will consume 37.3% of total</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">high-bandwidth memory demand</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="342" y="160" width="396" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">Morgan Stanley HBM demand call</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#60a5fa" text-anchor="middle">37.3%</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">HBM (high-bandwidth memory) is the premium memory chip that powers AI accelerators. One company</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">alone takes more than a third of total demand.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">🟦</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">37.3%</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Nvidia</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Top HBM demand share</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">🔴</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">36%</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Google</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Demand for its own AI</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">chips</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">🟠</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">12.1%</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">AMD</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">For rival AI accelerators</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">⚪</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">15%</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Everyone else</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Combined remaining</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">players</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Nvidia, Google, and AMD together account for roughly 85% of total HBM demand.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">For makers like SK Hynix, Micron, and Samsung, these three are the key customers.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">Analyst Beth Kindig relayed: "Morgan Stanley estimates Nvidia will consume 37.3% of total HBM demand,</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">Google at 36%, and AMD at 12.1%, leaving only around 15% for other players."</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="880" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why it matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">HBM is a supply-constrained, high-value memory type, so big-customer demand shapes memory makers’ revenue</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">directly. Watch whether Nvidia holds its share and how fast Google/AMD grow their own chip demand.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Nvidia · HBM Demand · 2026.09.17</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>