  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">FSD</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Sawyer Merritt / Dan Neil WSJ 2026.08.22: Full Self-Driving Is the Best Thing about the New</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Tesla Model Y. FSD Supervised를 출퇴근 혼잡·추종·차선 중앙 유지에서 높게 평가.</text>
