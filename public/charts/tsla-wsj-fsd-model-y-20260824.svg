  <text x="540" y="688" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"WSJ의 Dan Neil은 2026년 8월 22일 칼럼에서 신형 Model Y에서 가장 좋은 점이 Full Self-Driving이라고</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">썼다. FSD Supervised는 사람이 감독하는 자율주행이다. 출퇴근 혼잡, 앞차 따라가기, 차선 중앙 유지를 칭찬했다.</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">Sawyer Merritt가 스크린을 공유했다."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.24</text>
  <rect x="60" y="838" width="960" height="140" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">주류 자동차 칼럼이 FSD를 옵션이 아니라 차의 핵심 상품으로 적었다. JPM V15 step-change와 같은 주 소프트웨어 축이다. 다만</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Supervised는 무인 상용과 다르니 규제·사고율은 따로 본다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · WSJ FSD Model Y · 2026.08.24</text>
