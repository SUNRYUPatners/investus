  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#22d3ee" text-anchor="middle">8.3T</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Totals vary by window and source, but foreign selling dominance is clear.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1c22" stroke="#22d3ee" stroke-width="1.5"/>
