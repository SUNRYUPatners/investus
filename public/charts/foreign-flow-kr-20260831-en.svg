  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Post-Jackson Hole US rate and dollar expectations triggered foreign repositioning</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Watch whether FX, flows, and rates move together next week</text>
