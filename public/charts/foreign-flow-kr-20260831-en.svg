  <text x="540" y="740" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">The 8.3T figure is a weekly accumulation, not necessarily one-day panic. When selling clusters in large</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">chips, the index falls harder while rate beneficiaries like banks can hold up.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#0a1c22" stroke="#22d3ee" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">Why it matters</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Flows matter for who sold, not just direction. ETF, hedge, and rebalance flows mix in—do not treat one weekly total</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">as a trend. Track foreign net buying turns alongside the exchange rate.</text>
