  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">9/24</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">A white Semi sat in a white tunnel of light. The dedicated building for an electric long-haul truck is</text>
