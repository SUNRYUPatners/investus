  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Foreigners sold ₩3.29T and institutions ₩1.17T, while retail buyers absorbed ₩2.97T without fully offsetting the</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">drop. Next: watch the Sept 16 FOMC result and the Saudi pipeline repair progress.</text>
