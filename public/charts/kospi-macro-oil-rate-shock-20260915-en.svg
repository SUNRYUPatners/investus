  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">Three pressures rattling KOSPI</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">A drone strike from Iraq halted Saudi's East-West pipeline on Sept 11.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">Hotter US August CPI and PPI data raised rate-hike expectations.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">AI CEOs' 'pacing' comments stoked fears of slower chip demand.</text>
