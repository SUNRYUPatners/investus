  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">체코에서 감독 주행이 승인됐고 곧 배포가 시작됩니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">테슬라 유럽 계정이 알렸고, 유럽연합 전체 표결이 앞에 있습니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">체코</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">그록 4.7이 같은 가격으로 나왔고 점수는 한 단계 올랐습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">입력 100만 토큰 2달러, 출력 6달러로 4.6과 같습니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">4.7</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">메타가 미국과 프랑스를 잇는 해저 케이블 페탈을 발표했습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">초당 1페타비트, 약 7,000킬로미터, 2029년 개통이 목표입니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">1Pbps</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">사이버캡 운행비 25센트, 테슬라는 마일당 1.20달러를 가져간다는…</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">회사 공시가 아니라 투자 대담에서 나온 숫자입니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">25센트</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">S&amp;P500 종목의 절반이 200일선을 밑돌았습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">4월 초 이후 가장 얇은 시장 폭입니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">49.5%</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">머스크는 스타십 완전 재사용이 내년에 가깝다고 했습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">설계는 가능하고, 일정은 아직 목표입니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">2027</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 스타십 궤도 · 체코 감독주행 · 그록 4.7 · 페탈 해저망 · 사이버캡 원가 · 시장 폭 49.5% · 재사용 2027</text>
