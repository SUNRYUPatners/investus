  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">머스크는 첫 궤도 스타십이 스타링크 3세대를 실어 나른다고 했습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">부스터 21호기가 발사대에 올라갔고, 일정은 허가에 달려 있습니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">7일</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
