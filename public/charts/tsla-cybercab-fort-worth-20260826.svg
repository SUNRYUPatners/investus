  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">달러스 서쪽</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">DFW 축</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🚕</text>
