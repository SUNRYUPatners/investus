  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">유료와는 별개</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="680" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"텍사스 포트워스에 사이버캡 함대가 준비됐다는 설명이 나왔습니다. 달러스 운행 구역에서 서쪽으로 약 32마일</text>
  <text x="540" y="706" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">떨어진 지점입니다. 준비는 차량·충전·원격 지원이 대기 가능하다는 뜻에 가깝고, 유료 승객 개시·</text>
  <text x="540" y="732" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">허가와는 단계가 다릅니다. 달러스–포트워스 축에서 지리가 넓어지는 전주곡으로 읽을 수 있습니다."</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">지리 확장은 로보택시 실물 진전 신호입니다. 다만 준비와 유료는 다릅니다. 다음엔 허가·요금 앱·공식 운행 구역 지도를 확인하세요.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 사이버캡 포트워스 · 2026.08.26</text>
