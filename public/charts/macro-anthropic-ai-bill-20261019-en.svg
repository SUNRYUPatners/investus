<text x="231" y="54" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="900">AI</text><text x="54" y="104" font-family="Arial,sans-serif" font-size="24" fill="#8B949E">2026.10.19 · Macro · AI Regulation</text><text x="54" y="210" font-family="Arial Black,Arial,sans-serif" font-size="100" fill="url(#hG)" font-weight="900">AI Safety Bill</text><text x="54" y="262" font-family="Arial,sans-serif" font-size="26" fill="#FDE68A">Anthropic pitches draft AI safety bill to Congress</text><rect x="54" y="290" width="972" height="3" fill="url(#divG)" rx="2"/><rect x="54" y="326" width="972" height="100" rx="16" fill="#161B22" stroke="#F59E0B" stroke-width="2"/><text x="84" y="364" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">Government gains authority to block AI</text><text x="84" y="398" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">models capable of $1B+ damage</text><rect x="54" y="446" width="972" height="100" rx="16" fill="#161B22" stroke="#F59E0B" stroke-width="2"/><text x="84" y="484" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">AI developers failing safety standards</text><text x="84" y="518" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">face direct government blocks</text><rect x="54" y="566" width="972" height="100" rx="16" fill="#161B22" stroke="#F59E0B" stroke-width="2"/><text x="84" y="604" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">Anthropic's position: proactive safety</text><text x="84" y="638" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">regulation builds long-term trust</text><rect x="54" y="686" width="972" height="100" rx="16" fill="#161B22" stroke="#F59E0B" stroke-width="2"/><text x="84" y="724" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">Industry split: OpenAI/Google prefer</text><text x="84" y="758" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">self-regulation vs Anthropic backing</text><text x="84" y="792" font-family="Arial,sans-serif" font-size="22" fill="#FDE68A">legislation</text><rect x="54" y="820" width="972" height="88" rx="16" fill="#1A1000" stroke="#F59E0B" stroke-width="1.5"/><text x="84" y="854" font-family="Arial,sans-serif" font-size="21" fill="#FDE68A">AI safety legislation favors Anthropic — saf</text><text x="84" y="888" font-family="Arial,sans-serif" font-size="21" fill="#FDE68A">ety-first developers become the regulated-standard setters</text><rect x="0" y="1278" width="1080" height="72" fill="#161B22"/>
