  <text x="540" y="827" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">충전하는 모델3 전기료는 연 875달러로, 절반 아래입니다. 6년 할부 동안 캠리 휘발유는 1만 944달러입니다. 연료와</text>
