  <text x="540" y="873" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">끝나면 처음 가격 차이는 2,140달러까지 내려갑니다. 전기차는 부러지는 부품이 적고, 타이어와 워셔액 말고는 유지가…</text>
