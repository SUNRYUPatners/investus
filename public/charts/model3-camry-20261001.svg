  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">가격이 그 계단을 올라온 자리입니다. 후륜구동은 321마일, 최고속도 시속 125마일, 정지에서 시속 60마일까지 5.8초입니다.</text>
  <text x="540" y="968" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">프리미엄은 4만 2,490달러부터, 퍼포먼스는 5만 4,990달러입니다. 감독 자율주행은 그 페이지의 선택 항목입니다.</text>
