  <text x="540" y="758" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">가장 싼 테슬라는 토요타 캠리보다 비쌉니다. 캠리는 2만 9,600달러에서 시작하고, 테슬라 모델3는 3만 6,990달러에서</text>
