  <text x="540" y="680" font-family="Arial" font-size="19" fill="#f472b6" text-anchor="middle">"A wider CDS spread means the market is charging a higher premium for credit risk. Equities can</text>
  <text x="540" y="706" font-family="Arial" font-size="19" fill="#f472b6" text-anchor="middle">stay strong while CDS flashes caution. AI optimism and credit hedges can coexist, so read earnings</text>
  <text x="540" y="732" font-family="Arial" font-size="19" fill="#f472b6" text-anchor="middle">and corporate bonds together. A one-day spike is not the same as a multi-month trend."</text>
