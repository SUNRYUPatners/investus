  <text x="540" y="878" font-family="Arial" font-size="18" fill="#f472b6" text-anchor="middle">Why this matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Stocks and CDS do not always move together. Track whether earnings stabilize credit, or whether this is temporary</text>
