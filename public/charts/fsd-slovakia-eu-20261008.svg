  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#f9fafb" text-anchor="middle">슬로바키아 FSD 승인</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#34d399" text-anchor="middle">EU 전역 확장 며칠 안에 완료</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#02260f" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">유럽 FSD 진출 첫 공식 거점</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="80" font-weight="900" fill="#34d399" text-anchor="middle">FSD EU</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">슬로바키아 → EU 전역 — 독일 교통장관도 전역 승인 지지</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#02260f" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#021209" stroke="#34d399" stroke-width="2"/>
