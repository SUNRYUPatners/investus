  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">Background</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">The Medal of Technology and Innovation is the highest U.S. STEM honor.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">Same day: Terafab ZERO doubt, V2 FCC approval, and $400B financing.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">SpaceX holds deep NASA, DoD, and Commerce Dept contract backlog.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">Stronger political ties ease regulatory hurdles and boost procurement odds.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* Do not call the medal a stock trigger — business news is the trigger</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#061520" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#60a5fa">Key Points</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">Higher government credibility lifts SpaceX government contract leverage.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">Tesla's FSD and energy regulatory landscape also benefits from political support.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">Energy · space · AI under one portfolio is the synergy thesis in action.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">Political events and earnings are different calendars — contracts matter more.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#2563eb">Award date aligning with contract wins is when political-business synergy materializes.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · MACRO · SPCX · TSLA</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">Procurement contracts converting to actual revenue matter more than the medal</text>
