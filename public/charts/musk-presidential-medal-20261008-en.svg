  <text x="540" y="162" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#60a5fa" text-anchor="middle">Medal of Technology &amp; Innovation</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#0a1e30" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Highest U.S. presidential honor for science and technology</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#60a5fa" text-anchor="middle">National Medal</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Space · AI · Energy · Robotics · Transportation — all covered</text>
