  <rect x="54" y="1118" width="972" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="540" y="1153" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="26" font-weight="900" fill="#F9FAFB">The convergence is accelerating.</text>
  <text x="540" y="1190" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">Self-driving fleet · AI compute revenue · $100B ARR trajectory</text>

