  <text x="78" y="1068" font-family="Arial,sans-serif" font-size="18" fill="#7C3AED">$120.5B total through 2029</text>
  <text x="78" y="1090" font-family="Arial,sans-serif" font-size="16" fill="#9CA3AF">SpaceX AI computing is already monetizing</text>

