  <rect x="558" y="952" width="468" height="148" rx="16" fill="rgba(251,191,36,0.06)" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="582" y="994" font-family="Arial Black,Arial,sans-serif" font-size="21" font-weight="900" fill="#FBBF24">Anthropic S-1</text>
  <text x="582" y="1018" font-family="Arial Black,Arial,sans-serif" font-size="44" font-weight="900" fill="#FBBF24" filter="url(#glow)">$16.3B</text>
  <text x="582" y="1044" font-family="Arial,sans-serif" font-size="20" fill="#9CA3AF">H1 2026 revenue  +1,300% YoY</text>
  <text x="582" y="1068" font-family="Arial,sans-serif" font-size="18" fill="#FBBF24">$265.6B future commitments</text>
  <text x="582" y="1090" font-family="Arial,sans-serif" font-size="16" fill="#9CA3AF">Confirms AI infra demand is very real</text>

