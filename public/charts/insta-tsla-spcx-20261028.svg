  <rect x="540" y="792" width="460" height="52" rx="10" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1"/>
  <text x="770" y="823" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="23" font-weight="900" fill="#FBBF24">$100B ARR pace ✓</text>

