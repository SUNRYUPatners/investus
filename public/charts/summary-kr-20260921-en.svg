  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">Samsung Electronics rose 3.37% and reclaimed 260,000 won</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners sold ₩462B; institutions bought ₩708B.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">₩261,000</text>
