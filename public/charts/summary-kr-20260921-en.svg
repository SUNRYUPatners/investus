  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners bought ₩1.33T, the cash-market top buy.</text>
  <text x="985" y="557" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">₩1,857,000</text>
