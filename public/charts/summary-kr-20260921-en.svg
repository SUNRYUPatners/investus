  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#38bdf8">KOSPI jumped 2.66% to close at 6,894.23 on Sept 18</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">Foreigners bought ₩424.5B and institutions ₩1.50T; retail sold ₩3.59T.</text>
