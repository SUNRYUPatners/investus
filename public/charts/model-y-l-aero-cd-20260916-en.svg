  <text x="540" y="686" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">Despite being longer and taller, the Model Y L achieved a lower drag coefficient thanks to a</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">redesigned rear spoiler, wheel design, and optimized body lines.</text>
