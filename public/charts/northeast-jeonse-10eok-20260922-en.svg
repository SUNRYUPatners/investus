  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Cheaper jeonse rises first</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Reports mix asking prices and signed contracts. Not every dong is ₩1 billion. A new ₩1B contract</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">widens the gap versus a renewal deposit.</text>
