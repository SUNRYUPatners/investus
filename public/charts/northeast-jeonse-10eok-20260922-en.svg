  <text x="540" y="878" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">If outer-ring jeonse hits ₩1B, the housing ladder steepens for years. Next: whether northeast deals repeat that</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">print. Public and purchased rentals have to hold the ladder.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Northeast · Jeonse · 2026.09.22</text>
