  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.22</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Northeast Seoul now sees 84-square-meter jeonse near ₩1</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">billion</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="348" y="166" width="384" height="46" rx="23" fill="#fb923c18" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#fb923c" text-anchor="middle">Asks and signed deals are mixed</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🏘️</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#fb923c" text-anchor="middle">₩1B</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Eighty-four square meters is the common family size. Seongbuk, Dongdaemun, Gangbuk and Nowon</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">now print that size near ₩1 billion.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">📍</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb923c" text-anchor="middle">Northeast</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Once a mid-to-low belt</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Priced below the Han-river ring</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">📐</text>
