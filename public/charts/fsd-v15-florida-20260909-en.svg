  <rect x="60" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">🧩</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">v15</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Software version</text>
  <text x="210" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Feature/safety stack update</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">🚗</text>
  <text x="540" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Fleet</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Opened to larger pools</text>
  <text x="540" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Links robotaxi supply</text>
  <rect x="720" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="438" font-family="Arial" font-size="40" text-anchor="middle">🌴</text>
  <text x="870" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">FL</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Tampa·Orlando·Miami</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Still small counts</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">A version bump signals more capability; a handful of city cars signals pilot scale. Do not stretch either</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">into a national launch. Intervention rates, safety, and fares are the revenue switches.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Software moats sit in data and release speed. Next: Florida unit growth and other-state unlocks. Over time, version</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">history becomes insurance and regulator evidence.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · FSD v15 · 2026.09.09</text>
