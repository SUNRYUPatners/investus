  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">✅</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">v15</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">FSD v15 is a software version. It is framed as unlocking larger fleets, while Florida major cities still</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">show only a handful of units.</text>
