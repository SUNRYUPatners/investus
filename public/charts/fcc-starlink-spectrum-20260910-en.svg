<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#140b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#c084fc"/><stop offset="100%" style="stop-color:#a78bfa"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="131" height="38" rx="19" fill="#c084fc30" stroke="#c084fc" stroke-width="1.5"/>
  <text x="105.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#c084fc" text-anchor="middle">BREAKING</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">The FCC opened 1,000+ MHz for Starlink in the 12 GHz and 42</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">GHz bands</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="370.5" y="160" width="339" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">FCC · STARLINK SPECTRUM</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#c084fc" text-anchor="middle">1000+</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Spectrum is the radio slice that carries data. More than 1,000 MHz for satellite broadband was cited</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">across 12 GHz and 42 GHz.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">📡</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">12GHz</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Lower band</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Different coverage</text>
  <text x="176" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">traits</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">📶</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">42GHz</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Higher band</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">More capacity, shorter</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">reach</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">➕</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">1000+</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">MHz width</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Combined size cited</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">🛰</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#c084fc" text-anchor="middle">Sat</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Broadband use</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Not a terrestrial path</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Wider spectrum can lift per-user speed caps if terminals and beams keep up.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">A permit is not live capacity. Interference and country coordination remain.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">1,000+ MHz means more highway lanes for Starlink. It is not the same as plan speed or latency. Next:</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">commercial channel deployment.</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="880" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Spectrum is an infrastructure permit, not quarterly revenue. Split from the Hawker 1 Gbps story. Next: terminals</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">and national approvals. Spectrum, orbits, and terminal cost can thicken the broadband moat over years.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · Starlink spectrum · 2026.09.10</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>