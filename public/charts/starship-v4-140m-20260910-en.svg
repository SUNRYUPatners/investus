  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">140m</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">V4 is the next Starship design: 9 Raptors on the upper stage, about 140 m tall (+16 m). Orbital compute</text>
