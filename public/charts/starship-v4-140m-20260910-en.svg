  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">Split design from calendar</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">📍 Ship 42 ground tests are the current article</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">🛰 2027 sats are a plan cell</text>
