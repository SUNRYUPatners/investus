  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A drawing height is not a flight. Split from Ship 42 at Massey’s. Next: V4 prototype and flight license. Orbital</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">compute stacks on Starlink spectrum and power moats over years.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · Starship V4 · 2026.09.10</text>
