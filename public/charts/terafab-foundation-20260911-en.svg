  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Terafab is a large chip and packaging plant. Faster footings can pull tool-install dates forward. Over 3–5 years a</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">running plant can ease packaging bottlenecks and steady accelerator supply.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · Terafab · 2026.09.11</text>
