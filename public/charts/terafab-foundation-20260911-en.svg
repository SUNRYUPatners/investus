  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🏗</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">40–50%</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Drone photos show a wide graded pad and a long rectangular footing pit. Phase 1 foundations look</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">40–50% further than a month ago, with more work on the west staging area and the access road.</text>
