  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the photos show</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">📍 A Starlink ground station sits on the same site</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">📸 More clearing and back-side work than the first visit a month ago</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">💵 Next: framing and tool move-in</text>
