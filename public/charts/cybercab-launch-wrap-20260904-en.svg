  <text x="540" y="908" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Screens replaced slogans. Fleet is still small at 45 units, and you cannot force a Cybercab over a Model Y. Next</text>
