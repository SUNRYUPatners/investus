  <text x="540" y="776" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">No livestream, but the site and app now say Cybercab rides are available in limited Austin areas. A</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">commercial fleet interest form opened the same day.</text>
