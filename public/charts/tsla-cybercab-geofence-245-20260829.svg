  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">구역이 넓어야 호출 대기 시간이 짧아지고 차량 회전율이 올라갑니다. 반대로 구역이 넓어지면 만나는 도로 상황도 다양해져 운행</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">난이도가 올라갑니다. 다음에는 확대된 구역이 유지되는지, 안전요원 없는 운행 비중이 늘어나는지 확인하시면 됩니다.</text>
