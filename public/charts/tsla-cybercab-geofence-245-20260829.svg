  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">지오펜스는 자율주행 차량이 달릴 수 있도록 미리 지정해 둔 지리적 경계를 뜻합니다</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">같은 기간 다른 도시에서는 2인승 시험 차량의 주행도 함께 목격됐습니다</text>
