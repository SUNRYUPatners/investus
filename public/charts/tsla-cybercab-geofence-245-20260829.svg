  <text x="540" y="740" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">구역이 넓어지면 한 대가 하루에 태울 수 있는 승객 수가 늘어나고 빈 차로 이동하는 거리가 줄어듭니다. 로보택시</text>
