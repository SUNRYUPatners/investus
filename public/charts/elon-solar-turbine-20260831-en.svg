  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">One hundred gigawatts is far larger than many national solar fleets. Casting turbines internally</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">is about cutting supplier delay and price swings. As AI data centers and EV plants expand, power,</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">transformers, and cooling bind together.</text>
