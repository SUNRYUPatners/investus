  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Power bottlenecks shift from buying electrons to securing generation and grid gear. If solar and turbine production</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">becomes real, energy cost structures can change. Watch site announcements, production timing, and order backlogs</text>
