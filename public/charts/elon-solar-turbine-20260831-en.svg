  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">☀️ 100 GW/yr solar · in-house turbine casting</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">⚡</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">100 GW/yr</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">AI, EVs, and rockets all hit the same power bottleneck. Making generation gear in-house extends</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">vertical integration.</text>
