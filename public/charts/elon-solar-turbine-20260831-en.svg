  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Launch sites and factories need</text>
  <text x="870" y="617" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">power</text>
