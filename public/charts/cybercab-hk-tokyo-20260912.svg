  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">전시는 실물을 익히게 하는 일입니다. 유료 호출은 허가와 보험, 앱이 필요합니다. 다음에 보면 좋은 것은 도쿄</text>
