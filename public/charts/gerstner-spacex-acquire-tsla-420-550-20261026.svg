  <text x="108" y="796" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">현재 TSLA 주가(~$379) 대비 최대 45% 프리미엄에 해당합니다.</text><text x="108" y="830" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">독립위원회의 대등합병(merger of equals) 탐색과 다른 구도입니다.</text><text x="108" y="864" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">SpaceX가 인수 주체, Tesla가 피인수 대상인 시나리오입니다.</text>
  <rect x="54" y="888" width="972" height="136" rx="22" fill="#0F0A00" stroke="#78350F" stroke-width="2.5"/>
