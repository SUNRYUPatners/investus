  <text x="108" y="960" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Tesla 주주: 현금 인수 프리미엄이 단기 상승 이벤트.</text><text x="108" y="994" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">SpaceX 주주: 대규모 자금 조달과 EV 사업 리스크를 검토해야 합니다.</text><text x="108" y="1028" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">현재 공식 절차는 독립위원회 탐색 단계 — 확정 조건 없음.</text>
