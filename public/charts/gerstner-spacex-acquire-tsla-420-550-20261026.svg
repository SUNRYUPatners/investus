  <text x="80" y="648" font-family="Arial,sans-serif" font-size="24" fill="#10B981">▸ Gerstner 시나리오: SpaceX가 Tesla를 매수(현금 프리미엄)</text>
  <text x="80" y="684" font-family="Arial,sans-serif" font-size="24" fill="#6B7280">두 시나리오는 현재 동시에 거론 중 — 어느 쪽도 확정 아님</text>
