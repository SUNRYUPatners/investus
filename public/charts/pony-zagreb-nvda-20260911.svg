  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">포니에이아이는 중국 로보택시 회사이고 베르네는 유럽 파트너입니다. 엔비디아는 칩과…</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">시연은 「이 도시 도로에서 무인이 가능하다」는 현장입니다. 유료 호출 요금표가 나온 단계는 아닙니다.</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">22km는 한 경로를 끝까지 비운 기록입니다. 유럽에서 운전자 없는 로보택시 시험이 열렸다는 점이 뉴스입니다. 다음에</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">보면 좋은 것은 같은 구간을 반복하고 요금을 받는 날입니다.</text>
