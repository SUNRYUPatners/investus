  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#60a5fa" text-anchor="middle">22km</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">엔비디아 공식 화면은 「자그레브를 가로지르는 새로운 종류의 탑승」이라고 했고, 포니에이아이와 베르네가 일반도로</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">22km를 운전자 없이 달렸습니다. 차 안에는 안전 요원이 없고 승객만 있으며, 엔비디아 드라이브가 붙었습니다.</text>
