  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">엔비디아 드라이브가 유럽 도로 허가를 통과하면, 다른 도시 차에도 같은 컴퓨터가 올라갈 수 있습니다. 앞으로 3~5년 허가 도시가</text>
