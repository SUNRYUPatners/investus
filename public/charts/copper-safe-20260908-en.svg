  <text x="870" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Shared</text>
  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Factor</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">If copper falls while gold rises, it can read growth soft plus hedge. If both rise, risk appetite reached</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">metals. Log relative performance.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#0a1c22" stroke="#22d3ee" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Do not lever a medium-term grid story into a one-day trade. The Fed touches copper via the dollar. Bundling hedges</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">and growth metals one-way leaves portfolios exposed to meeting shocks. Next: inventories and DXY.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Copper · growth thermometer · 2026.09.08</text>
