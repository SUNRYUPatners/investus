  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.08</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Copper is the growth/grid thermometer beside haven hedges</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">🔌</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#22d3ee" text-anchor="middle">Growth</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Even on Au/BTC hedge days it asks whether growth is alive. Dollar, inventories, and China demand</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">lead near-term.</text>
