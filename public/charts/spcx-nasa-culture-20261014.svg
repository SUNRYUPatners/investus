<rect x="82" y="782" width="916" height="96" rx="12" fill="#050E1A" stroke="#3B82F6" stroke-width="1"/>
<text x="540" y="820" font-family="Arial,sans-serif" font-size="22" fill="#E6EDF3" text-anchor="middle">"SpaceX에 가서 내가 더 똑똑해진 게 아닙니다.</text>
<text x="540" y="862" font-family="Arial,sans-serif" font-size="22" fill="#E6EDF3" text-anchor="middle">차이는 병목이었고, SpaceX는 그 병목을 제거했습니다."</text>
