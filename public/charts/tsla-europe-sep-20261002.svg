  <text x="540" y="758" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">테슬라, 9월에서 뚜껑을 열었습니다. 새로운 등록이 여러 시장에서 2025년 9월을 강하게 폴로했습니다. 프랑스 +61.9%,</text>
