  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Move-in can be faster than new</text>
  <text x="540" y="705" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">towns</text>
