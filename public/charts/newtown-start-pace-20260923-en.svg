  <text x="540" y="908" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">If starts print, some jeonse pressure can ease over years. An inaugural line is not a target. Do not merge the 1.19</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">million total with third-phase starts.</text>
