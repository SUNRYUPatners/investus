  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A cliff that this year’s target</text>
  <text x="870" y="705" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">cannot fill</text>
  <rect x="60" y="730" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="776" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">A second wave of public-agency relocation was also promised faster. If moves and homes travel</text>
