  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">A 2030 target total</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#a78bfa" text-anchor="middle">&#8594;</text>
