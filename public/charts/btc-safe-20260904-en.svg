  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#f7931a30" stroke="#f7931a" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f7931a" text-anchor="middle">Bitcoin</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.04</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Bitcoin closed 81,254 dollars, up 5.11%, reclaiming 80,000</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="86" font-weight="900" fill="#f7931a" text-anchor="middle" opacity=".15">₿</text>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#f7931a" text-anchor="middle">₿</text>
  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">81,254</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Low about 76,930, high about 82,280. Gold rallied the same day—risk and haven bounced</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">together.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f7931a" text-anchor="middle">+5.11%</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Move</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Close</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">📉</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f7931a" text-anchor="middle">76,930</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Low</text>
  <text x="540" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">USD</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📊</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#f7931a" text-anchor="middle">82,280</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">High</text>
  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">USD</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#f7931a" text-anchor="middle">Plus 5.11% is a large bounce after the prior dip. 80,000 is a round-number line. ETF flows and</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#f7931a" text-anchor="middle">liquidations belong on a separate row from the print.</text>
  <rect x="60" y="844" width="960" height="148" rx="14" fill="#201408" stroke="#f7931a" stroke-width="1"/>
  <text x="540" y="874" font-family="Arial" font-size="18" fill="#f7931a" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A hot jobs print can lift yields and fade bitcoin. Some Korea copy still cites 77,000—use the exchange close. Next:</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">flows, open interest, and the dollar index.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Bitcoin · Sept 3 · 2026.09.04</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
