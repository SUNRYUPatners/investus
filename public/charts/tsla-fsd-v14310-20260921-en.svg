  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.21</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Supervised FSD v14.3.10 started rolling out to cars</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">🚘</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">FSD v14.3.10</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">FSD is Tesla software that drives under a person’s watch. Cars began showing software 2026.27.10.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">🧠</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Training</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Reinforcement learning was</text>
  <text x="210" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">upgraded</text>
  <text x="210" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">More driving scenes are practiced</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">🅿️</text>
  <text x="540" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Parking</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Spot choice and exit got faster</text>
  <text x="540" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">It can park without a P on the map</text>
  <rect x="720" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="438" font-family="Arial" font-size="40" text-anchor="middle">🚦</text>
  <text x="870" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Rare scenes</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Emergency and school-bus</text>
  <text x="870" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">response improved</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Fog and night vision were tuned too</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">The car screen listed software 2026.27.10 and Supervised FSD 14.3.10. Reinforcement learning is</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">training by trial and error.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Quality claims become numbers only after the build lands in cars. Parking and rare scenes are the door to robotaxi</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">safety. Next, watch rollout countries and incident stats together.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · Supervised FSD 14.3.10 · 2026.09.21</text>
