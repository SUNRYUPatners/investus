  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#22d3ee" text-anchor="middle">Battery fade</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The top-cap cell maker dropped 12,000 won while KOSPI rose 1.65%. It came down from 363,500</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">won.</text>
