  <text x="540" y="776" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">When EV demand and metal costs weigh, large cell names rest easily. Over the medium term, North</text>
  <text x="540" y="801" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">American plants and bookings set the floor.</text>
  <rect x="60" y="878" width="960" height="140" rx="14" fill="#0a1c22" stroke="#22d3ee" stroke-width="1"/>
  <text x="540" y="908" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A battery fade on a 7,000 recapture day means rotation is still late. Next: 352,000 won support and order filings. A</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">one-day 3.3% drop does not erase that floor.</text>
  <text x="540" y="1042" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">LG Energy Solution · Stock · 2026.09.22</text>
