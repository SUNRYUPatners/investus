  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">🌍</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb7185" text-anchor="middle">−₩51.3B</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Foreign selling</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A cash-market top sale</text>
