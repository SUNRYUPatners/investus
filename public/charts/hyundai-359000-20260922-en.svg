  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">📊</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb7185" text-anchor="middle">−1.64%</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">One-day drop</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">The opposite of the index</text>
