  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">🚗</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">₩359,000</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The top-cap auto name dropped 6,000 won while KOSPI rose 1.65%. Foreigners sold ₩51.3B.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
