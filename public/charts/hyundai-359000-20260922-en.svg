  <text x="540" y="656" font-family="Arial" font-size="19" fill="#fb7185" text-anchor="middle">Foreigners sold about 140,000 shares. Money crowded into chips and left a large auto name. A</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#fb7185" text-anchor="middle">₩1,381 won print did not stop the sale.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#201018" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#fb7185" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When autos fade against a strong index, rotation is still late. Next: 359,000 won support and whether the foreign</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">sale lasts. Hybrids and US plants remain a multi-year share fight.</text>
