  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80">핵심 포인트</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">목격 빈도는 테스트 강도와 출시 가시성의 선행 지표다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">800건은 단일 도시 기준 로보택시 목격 역대 최다 기록이다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">웨드부시 600달러 목표의 핵심 전제는 로보택시 상용화 속도다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">모건스탠리 강세 840달러 칸의 조건은 로보택시 매출 실현이다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#16a34a">공식 상업 운행 발표와 요금 공시가 나올 때 논거가 확정된다.</text>
