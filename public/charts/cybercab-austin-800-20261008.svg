  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">사이버캡은 현재 공개 도로 테스트 단계에 있다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">오스틴은 텍사스 규제 완화 덕분에 허가 취득이 용이하다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">9월 평균 200건에서 10월 첫째 주에 800건으로 4배 급증했다.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">애널리스트는 연말 5,000대 플릿 시 연 2.4억 달러 수익 모형을 제시.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 목격 횟수와 인가 대수(169대)는 다른 기준 — 상업 운행 공지를 따로 확인</text>
