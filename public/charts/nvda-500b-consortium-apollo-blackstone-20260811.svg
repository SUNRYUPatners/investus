  <text x="540" y="714" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">"엔비디아와 6개 세계 최대 금융 그룹이 AI 인프라 구축을 위한 5,000억 달러 자금 조성 파트너십을</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">맺었습니다."</text>
