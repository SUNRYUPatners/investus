  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">엔비디아 GPU를 사고 싶어도 데이터센터 짓고 전력 확보하는 자금이 없는 하이퍼스케일러 고객들을 위한 자금 지원입니다.</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">오라클 같은 고객의 신용 리스크(며칠 전 CDS 사상 최고) 우려를 완화하는 조치입니다.</text>
