  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">development · Apollo·Blackstone·BlackRock GIP·Brookfield·Goldman Sachs·KKR</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Evan D · Financial Times · CNBC · 2026.08.10</text>
