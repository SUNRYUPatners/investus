  <text x="540" y="878" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Large numbers invite large valuation debates. Per-GW revenue needs powered, commissioned GW with customer</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">orders. On the next earnings calls, watch Vera Rubin timing, GW-scale bookings, and power-delay mentions. Attached</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">memory and networking change margin mix too.</text>
