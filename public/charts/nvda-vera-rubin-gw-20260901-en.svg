  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#60a5fa" text-anchor="middle">&gt;$40B/GW</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The next AI system generation after Blackwell is discussed for late 2026–2027; GW measures</text>
