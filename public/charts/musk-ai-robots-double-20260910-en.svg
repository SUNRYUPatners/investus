  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">AI</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">AI and robots could double the global economy in under 10</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">years</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#a78bfa18" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="middle">🤖 AI · robots</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🤖</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#a78bfa" text-anchor="middle">2×</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Earlier remarks pointed to 20–30% upside. This print uses a stronger “double in under 10 years”</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">framing.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">⏱</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">&lt;10y</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Clock for a doubling</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Not a 20–30 year horizon</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">📈</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">20–30%</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Prior remark range</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Same theme, one step larger</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">🦾</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">Robots</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Paired with AI</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Not software-only growth</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">Doubling the economy means a much larger productivity assumption. Factory yield, permits, and</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">power are still blank. Do not mash the quote with shipment prints.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">This is a productivity scenario, not a target. Keep the 5,000 Optimus parts order on another cell. Next: robot</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">shipments and factory utilization. Labor substitution speed becomes a GDP-assumption input over years.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">AI · economy 2× · 2026.09.10</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
