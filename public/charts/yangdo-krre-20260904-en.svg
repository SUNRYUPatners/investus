  <rect x="40" y="20" width="110" height="38" rx="19" fill="#fb923c30" stroke="#fb923c" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#fb923c" text-anchor="middle">CGT</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.04</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Long-hold capital-gains relief still ends the holding-period</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">credit in 2029</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#fb923c18" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#fb923c" text-anchor="middle">📅 2029 · holding credit ends</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">📜</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#fb923c" text-anchor="middle">2029</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Occupancy credit stays 8% a year. The 150% tax-increase cap and +3.44 trillion won five-year</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">revenue sit in the same brief.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">📅</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb923c" text-anchor="middle">2029</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Hold credit</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Ends</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">🏠</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb923c" text-anchor="middle">8%/yr</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Occupy</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Stays</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">📊</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fb923c" text-anchor="middle">150%</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Cap</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Tax rise</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Long-hold relief cuts tax when you sell a house you kept. Ending the holding-period credit lowers</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">after-tax returns on investor sales. The 8% occupancy credit only rewards years lived in the</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">home.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#20130a" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">2029 is distant but it can delay listings. A 150% cap stops the holding tax from jumping more than 1.5 times in a year.</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Do not treat Assembly-pending figures as law.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">RE · CGT long-hold · 2026.09.04</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
