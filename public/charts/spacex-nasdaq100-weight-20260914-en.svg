  <text x="540" y="768" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">Bloomberg reported that overlapping lockup expirations and index-weight increases could trigger billions in</text>
  <text x="540" y="791" font-family="Arial" font-size="17" fill="#c084fc" text-anchor="middle">buying.</text>
  <rect x="60" y="874" width="960" height="168" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="904" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A lockup is a promise not to sell shares for a set period; once it ends, more shares can hit the market. Index funds</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">must mechanically buy more as a weighting rises. Next: watch trading volume once the reweighting is confirmed</text>
