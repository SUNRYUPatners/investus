  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">📊</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#c084fc" text-anchor="middle">2.82%</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">That's SpaceX's preliminary Nasdaq-100 weighting due later this month. A lockup expiration</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">overlapping it could trigger billions in passive buying.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="400" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Now</text>
  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">1.28%</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Preliminary Nasdaq-100 weight</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#c084fc" text-anchor="middle">&#8594;</text>
