  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Index-tracking funds</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Mechanical rebalancing</text>
