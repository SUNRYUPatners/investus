  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">24시간 거래가 열리면 브로커 시스템의 점검 시간이 바뀝니다. 오늘은 그 변경의 시행일이 아닙니다. 한 앱의 화면 문구와 국가 규칙</text>
