<text x="270" y="54" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="900">AI Infra</text><text x="54" y="104" font-family="Arial,sans-serif" font-size="24" fill="#8B949E">2026.10.19 · Macro · AI Infrastructure</text><text x="54" y="210" font-family="Arial Black,Arial,sans-serif" font-size="88" fill="url(#hG)" font-weight="900">BlackRock</text><text x="54" y="262" font-family="Arial,sans-serif" font-size="26" fill="#BAE6FD">Opens Texas AI data center — AI infra investment accelerates</text><rect x="54" y="290" width="972" height="3" fill="url(#divG)" rx="2"/><rect x="54" y="326" width="972" height="100" rx="16" fill="#161B22" stroke="#3B82F6" stroke-width="2"/><text x="84" y="364" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">World's largest asset manager ($10T+ AUM)</text><text x="84" y="398" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">opens Texas data center</text><rect x="54" y="446" width="972" height="100" rx="16" fill="#161B22" stroke="#6366F1" stroke-width="2"/><text x="84" y="484" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">Direct AI compute infrastructure build —</text><text x="84" y="518" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">signal of financial firms internalizing AI</text><rect x="54" y="566" width="972" height="100" rx="16" fill="#161B22" stroke="#3B82F6" stroke-width="2"/><text x="84" y="604" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">Wall Street majors (JPMorgan, BlackRock) in</text><text x="84" y="638" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">AI infrastructure spending race</text><rect x="54" y="686" width="972" height="100" rx="16" fill="#161B22" stroke="#6366F1" stroke-width="2"/><text x="84" y="724" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">Expands demand base for NVDA, AMD, EQIX data</text><text x="84" y="758" font-family="Arial,sans-serif" font-size="22" fill="#BAE6FD">center infrastructure</text><rect x="54" y="822" width="972" height="88" rx="16" fill="#0D1220" stroke="#3B82F6" stroke-width="1.5"/><text x="84" y="856" font-family="Arial,sans-serif" font-size="20" fill="#BAE6FD">AI infrastructure is no longer just Big Tech</text><text x="84" y="890" font-family="Arial,sans-serif" font-size="20" fill="#BAE6FD"> — finance, insurance, and logistics are all internalizing AI compute directly</text><rect x="0" y="1278" width="1080" height="72" fill="#161B22"/>
