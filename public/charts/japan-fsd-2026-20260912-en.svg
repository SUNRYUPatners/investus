  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">This-year goal</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Permit and price list still ahead</text>
