  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">🇯🇵</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">2026</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Cybercab sits on FSD like today’s Model Y, so a Japan rollout is not a distant future. The top priority is</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">turning the software on in 2026.</text>
