  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">FSD is driver-supervised software. A robotaxi still needs the software door open first. Next: a Japan</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">permit notice.</text>
