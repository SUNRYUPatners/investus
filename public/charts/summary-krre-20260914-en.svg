<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.14 Korea Real Estate Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="165" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="165" rx="4" fill="#fb923c"/>
  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">Seoul jeonse listings fell 12.2% YoY to 20,357</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">Outer districts like Nowon and Jungnang saw the sharpest drops.</text>
  <text x="985" y="207" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">-12.2%</text>
  <rect x="60" y="297" width="960" height="165" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="297" width="8" height="165" rx="4" fill="#a78bfa"/>
  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">Seoul apartment sales plunged 60% MoM to 2,322 units</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">Gangnam 3's transaction share hit a record-low 9.1%.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">-60%</text>
  <rect x="60" y="472" width="960" height="165" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="472" width="8" height="165" rx="4" fill="#a78bfa"/>
  <text x="116" y="531" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">Land-permit applications fell 34.8% to 3,012 in August</text>
  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">The lowest monthly total since the district-wide designation.</text>
  <text x="985" y="557" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">-34.8%</text>
  <rect x="60" y="647" width="960" height="165" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="647" width="8" height="165" rx="4" fill="#fb923c"/>
  <text x="116" y="706" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">Faster jeonse-to-rent shift pushed Seoul rent to ₩1.6M</text>
  <text x="116" y="742" font-family="Arial" font-size="17" fill="#9ca3af">Landlords are converting units after the new tax overhaul.</text>
  <text x="985" y="732" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">₩1.6M</text>
  <rect x="60" y="822" width="960" height="165" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="822" width="8" height="165" rx="4" fill="#60a5fa"/>
  <text x="116" y="881" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">August's Seoul jeonse price hit a record ₩711.78M</text>
  <text x="116" y="917" font-family="Arial" font-size="17" fill="#9ca3af">It first topped ₩700M in July and keeps climbing.</text>
  <text x="985" y="907" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">₩712M</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: jeonse -12.2% · sales -60% · permits -34.8% · rent ₩1.6M · jeonse price ₩712M</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
