  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">언박스트는 차체를 큰 모듈로 조립해 라인 택트(한 대당 시간)를 줄이는 방식입니다. 4케이 영상 기준으로 약</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">10초마다 한 대가 나오고, 장기 목표는 5초라는 설명이 반복됐습니다.</text>
