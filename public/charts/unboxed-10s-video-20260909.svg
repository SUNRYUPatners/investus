  <text x="540" y="768" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">10초마다 한 대는 이론상 시간당 수백 대 산술로 이어집니다. 영상 사이클과 주간 완성 대수는 다른 지표입니다. 스타링크</text>
