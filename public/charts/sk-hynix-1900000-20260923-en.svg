  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">Foreigners sold ₩812B of this name on the 21st</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">After that flip, price looked up again today</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">The chip bundle realigns if Samsung holds 280,000 won</text>
