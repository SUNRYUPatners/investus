  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">1.90 million is a session high. Next: whether the close holds above 1.84 million. Accelerator memory demand still</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">stretches over years.</text>
