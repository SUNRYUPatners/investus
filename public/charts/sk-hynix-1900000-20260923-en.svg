  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Prior close near 1.84 million (−1.5%). Session 1,873,000 (+1.79%), high 1.90 million (+3.26%).</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
