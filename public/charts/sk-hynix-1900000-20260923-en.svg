  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f59e0b" text-anchor="middle">₩1.84M</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">About −1.5%</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Down from 1,868,000 on the 21st</text>
