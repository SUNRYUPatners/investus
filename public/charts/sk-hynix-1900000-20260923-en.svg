  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f59e0b" text-anchor="middle">+1.79%</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">₩1,873,000</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A morning reversal</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f59e0b" stroke-width="2"/>
