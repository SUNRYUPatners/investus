  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">아폴로 글로벌은 세계 최대 사모펀드 운용사 중 하나다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">스페이스X는 IPO 없이 민간 자금조달로 성장을 이어 가고 있다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">같은 날 젠슨 황 테라팹 방문, FCC V2 승인도 겹쳤다.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">자금 조달 · 하드웨어 납품 · 위성 승인이 하루에 집중됐다.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 추진 중인 파이낸싱과 완료 자금을 같은 확정으로 읽지 않는다</text>
