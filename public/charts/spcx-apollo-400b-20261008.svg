  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">비상장 구조에서 $4,000억 조달은 기업가치 희석 없이 성장을 산다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">은행 대출과 아폴로 사모신용은 담보·조건이 달라 별도로 봐야 한다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">설비투자 레버리지 구조는 연산 수익 확신에서 나오는 신호다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">SPCX 간접 투자자는 이 파이낸싱이 기업가치 고정에 미치는 영향을 본다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#6d28d9">첫 칩 발주 규모 공시가 나오면 추정이 실제 칸으로 내려온다.</text>
