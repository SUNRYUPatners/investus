  <text x="540" y="740" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">Heavy 발사가 8월 30일로 예정되어 있으며, 원래 일정보다 9개월 앞당겨졌습니다. Roman은 다크 에너지·</text>
