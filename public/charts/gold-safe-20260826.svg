  <text x="540" y="688" font-family="Arial" font-size="17" fill="#eab308" text-anchor="middle">"금 선물은 인플레이션 헤지, 지정학 헤지, 달러 약세 헤지로 자주</text>
  <text x="540" y="716" font-family="Arial" font-size="17" fill="#eab308" text-anchor="middle">이야기됩니다. 금리가 다시 올라가면 조정이 나오고, 불안이 커지면</text>
