  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Tesla to expand Japanese delivery network by nearly 60% this year · Yokohama/Kobe/Kanto/Nagoya ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">12K+ deliveries YTD</text>
