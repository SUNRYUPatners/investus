  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">테슬라가 유럽(France +86%)·중국(7월 93K대)에 이어 일본 시장에서도 급성장하고 있습니다. 일본은 도요타·</text>
