  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">나고야에도 추가 지점을 개설합니다. 연 배송이 12,000대를 넘었고 6월 한 달 배송이 4,000대에 이릅니다.</text>
