<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0f00"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f7931a"/><stop offset="100%" style="stop-color:#e07c0a"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#f7931a30" stroke="#f7931a" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f7931a" text-anchor="middle">BTC</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Bitcoin fell to $75,355 right after the Fed hike, then</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">recovered near $75,813</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">₿</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#f7931a" text-anchor="middle">$75,813</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Markets had already priced a 90%+ chance of the hike, so Chair Warsh's inflation comments</text>
  <text x="540" y="383" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">mattered more than the move itself.</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Low</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f7931a" text-anchor="middle">$75,355</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">First hour after the call</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Back to flat within 24 hours</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Week</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f7931a" text-anchor="middle">About -4%</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Seven-day change</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Overlapped with the Clarity Act</text>
  <text x="540" y="579" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">miss</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">ETFs</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f7931a" text-anchor="middle">-$450M</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 15 spot outflows</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Led by BlackRock and Fidelity</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">Why it held after the hike</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">Futures had already priced more than a 90% chance of this 25bp move.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">Finding a low within an hour was read as relief that the event was over.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">Sixteen of 18 officials still see another hike this year, so risk premia…</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#201408" stroke="#f7931a" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#f7931a" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Rate hikes make a non-yielding asset like bitcoin less attractive in the short run. This time the move was already</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">priced, so the shock was brief. Next: watch whether $75,000 holds and whether spot ETF outflows stop after one</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">day.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Bitcoin · Price · 2026.09.17</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>