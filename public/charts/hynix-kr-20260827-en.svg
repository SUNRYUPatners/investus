<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#140b22"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="190" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="135" y="44" font-family="Arial Black,Arial" font-size="15" font-weight="900" fill="#a78bfa" text-anchor="middle">SK HYNIX</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS KR DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.27</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">SK Hynix climbed 2.49% to 1,730,000 won as AI server</text>
  <text x="540" y="142" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">memory expectations carried straight over</text>
  <line x1="80" y1="158" x2="1000" y2="158" stroke="#1f2937" stroke-width="1"/>

  <rect x="70" y="178" width="940" height="140" rx="18" fill="#140b22" stroke="#a78bfa" stroke-width="2"/>
  <text x="160" y="266" font-family="Arial" font-size="54" text-anchor="middle">💾</text>
  <text x="450" y="252" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#a78bfa" text-anchor="middle">1,730,000 KRW</text>
  <text x="450" y="292" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Closing price, up 2.49% from the prior session</text>
  <rect x="700" y="212" width="260" height="72" rx="16" fill="#0f0a1a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="830" y="248" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#c4b5fd" text-anchor="middle">+2.49%</text>
  <text x="830" y="272" font-family="Arial" font-size="15" fill="#9ca3af" text-anchor="middle">Ahead of the KOSPI's gain</text>

  <rect x="60" y="338" width="225" height="188" rx="16" fill="#140b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="172" y="386" font-family="Arial" font-size="34" text-anchor="middle">🧩</text>
  <text x="172" y="428" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">HBM</text>
  <text x="172" y="458" font-family="Arial" font-size="15" fill="#9ca3af" text-anchor="middle">High-bandwidth memory</text>
  <text x="172" y="488" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Stacked next to AI</text>
  <text x="172" y="508" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">accelerator chips</text>

  <rect x="305" y="338" width="225" height="188" rx="16" fill="#140b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="417" y="386" font-family="Arial" font-size="34" text-anchor="middle">📊</text>
  <text x="417" y="428" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">Proof point</text>
  <text x="417" y="458" font-family="Arial" font-size="15" fill="#9ca3af" text-anchor="middle">Shipments and pricing</text>
  <text x="417" y="488" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Where expectation</text>
  <text x="417" y="508" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">turns into revenue</text>

  <rect x="550" y="338" width="225" height="188" rx="16" fill="#140b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="662" y="386" font-family="Arial" font-size="34" text-anchor="middle">🏗️</text>
  <text x="662" y="428" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">Capex</text>
  <text x="662" y="458" font-family="Arial" font-size="15" fill="#9ca3af" text-anchor="middle">Expansion cost</text>
  <text x="662" y="488" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">New fab spending hits</text>
  <text x="662" y="508" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">margins before revenue</text>

  <rect x="795" y="338" width="225" height="188" rx="16" fill="#140b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="907" y="386" font-family="Arial" font-size="34" text-anchor="middle">🌍</text>
  <text x="907" y="428" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">Foreigners</text>
  <text x="907" y="458" font-family="Arial" font-size="15" fill="#9ca3af" text-anchor="middle">Flow direction</text>
  <text x="907" y="488" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The two chip names</text>
  <text x="907" y="508" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">get bought first</text>

  <rect x="60" y="548" width="960" height="196" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="598" font-family="Arial" font-size="19" fill="#c4b5fd" text-anchor="middle">"SK Hynix rose 2.49% to 1,730,000 won. High-bandwidth memory, or HBM, sits next to AI</text>
  <text x="540" y="626" font-family="Arial" font-size="19" fill="#c4b5fd" text-anchor="middle">accelerators and moves data between them at speed. It is the core of this company's</text>
  <text x="540" y="654" font-family="Arial" font-size="19" fill="#c4b5fd" text-anchor="middle">earnings story. After a US AI chipmaker beat quarterly estimates, Korean suppliers were</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#c4b5fd" text-anchor="middle">repriced on the same expectation. Expectation and signed supply are different stages, so</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#c4b5fd" text-anchor="middle">watch for disclosed delivery schedules."</text>

  <rect x="60" y="764" width="960" height="146" rx="14" fill="#140b22" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="794" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why this matters</text>
  <text x="540" y="824" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">SK Hynix and Samsung Electronics together make up most of the KOSPI's semiconductor weight, so a rally here</text>
  <text x="540" y="848" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">lifts the whole index. What differs from earlier rallies is that today's move came from imported AI demand</text>
  <text x="540" y="872" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">expectations rather than the company's own results. Expectation-led gains retrace quickly, so track customer</text>
  <text x="540" y="896" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">inventory, memory contract prices and the company's stated supply timeline as the next checkpoints.</text>
  <text x="540" y="984" font-family="Arial" font-size="15" fill="#374151" text-anchor="middle">SK Hynix · 1,730,000 KRW +2.49% · 2026.08.27</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr · SRP CHIEF INVESTMENT OFFICER · NOT FINANCIAL ADVICE</text>
</svg>
