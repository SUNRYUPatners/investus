<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#050c19"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#1877f2"/><stop offset="100%" style="stop-color:#1266d6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#1877f230" stroke="#1877f2" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#1877f2" text-anchor="middle">META</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.12</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">META —</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Muse Glimmer 300억 파라미터 3D AI 모델 오픈웨이트 공개·</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#1877f2" text-anchor="middle" opacity=".15">🌐</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#1877f2" text-anchor="middle">🌐</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">300억</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">저커버그가 Muse Glimmer라는 300억 파라미터 규모의 3D 생성 AI 모델을 오픈웨이트로 공개했다고</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">발표했습니다. 이례적으로 재무부 장관이 "미국 AI 리더십을 유지하는 사례"라고 공식 지지 성명을 냈으며, 곧</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Muse Spark 1.2 최신 기반 모델도 공개할 예정입니다.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#1877f2" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">🌐</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#1877f2" text-anchor="middle">300억</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Muse Glimmer 파라미터</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">로컬 실행 가능</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#1877f2" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🏛️</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#1877f2" text-anchor="middle">재무부 지지</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">미국 AI 리더십 사례</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Scott 장관 공식 성명</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#1877f2" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📦</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#1877f2" text-anchor="middle">Muse Spark 1.2</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">차기 기반 모델</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">곧 오픈웨이트 공개</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">MARK ZUCKERBERG · TREASURY SECRETARY</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#1877f2" text-anchor="middle">"Muse Glimmer 300억 파라미터 dense 모델·로컬 실행 가능·오픈소스 지지·Meta의 개방형·</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#1877f2" text-anchor="middle">폐쇄형 모델 동시 진화가 미국 AI 리더십을 유지시킨다"</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Zuckerberg opens weights for Muse Glimmer, great 30B parameter dense model that can run locally ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Treasury Secretary Scott: Meta open-source is win for American innovation ·</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Mark Zuckerberg · Treasury Secretary Scott · 2026.08.11</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1420" stroke="#1877f2" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#1877f2" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">중국 오픈웨이트 모델(DeepSeek·Qwen)이 세계 AI 기반이 되어가는 상황에서, 미국 정부가 처음으로 오픈웨이트를 공식</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">지지했습니다. 오늘 별개 리포트의 NVIDIA Nemotron 3.5 Lightning 오픈 모델과 결합해서 미국 AI 진영이 오픈웨이트로</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">META · Muse Glimmer 오픈 · 2026.08.12</text>
