  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">AI reasoning</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A proof helper, not a calculator</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">The Clay Mathematics Institute named seven problems. An AI draft is not a proof until people</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">check it. Today’s news is that a model is near that door, not that the prize is already won.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">This is past chatbot chat — models are being tried on century-class math. A verified write-up would make it real.</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Until then, treat it as an approach, not a trophy.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">OpenAI · Millennium math · 2026.09.18</text>
