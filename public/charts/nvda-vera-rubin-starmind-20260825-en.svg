  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">This week</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Timing comments</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="688" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">"Vera Rubin NVL72 is described for Grok on the ground and first-generation Starmind satellites.</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">NVL72 packs many accelerators like a rack. Orbital datacenters are claimed to be simpler, cheaper,</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">denser, and lighter than a traditional rack. Dates wait on the earnings call."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.25</text>
  <rect x="60" y="838" width="960" height="140" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why this matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Chip demand is being narrated beyond terrestrial power grids. This is design intent, not booked revenue. Next:</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">production timing and space qualification.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">NVDA · Vera Rubin · Starmind · 2026.08.25</text>
