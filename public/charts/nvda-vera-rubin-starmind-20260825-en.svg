  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Ground cluster</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Vera Rubin</text>
