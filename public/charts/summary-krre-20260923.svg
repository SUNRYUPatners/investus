  <text x="116" y="197" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">신임 국토부 장관이 주거 안정과 3기 신도시 착공을 앞에 뒀습니다</text>
  <text x="116" y="243" font-family="Arial" font-size="17" fill="#9ca3af">수급 불균형과 임대차 불안, 가계부채가 맞물려 있다고 진단했습니다.</text>
