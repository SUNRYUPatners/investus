  <text x="116" y="416" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">전월세 안심신탁이 전세 3억 원을 맡기면 월 약 109만 원을 줍니다</text>
  <text x="116" y="462" font-family="Arial" font-size="17" fill="#9ca3af">연 4.35% 가정입니다. 22일 HUG 센터가 문을 열었습니다.</text>
  <text x="985" y="449" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">109만 원</text>
