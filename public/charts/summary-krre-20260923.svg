  <text x="116" y="854" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#94a3b8">서울 전세 +7.79%와 공적주택 119만 호는 어제 칸으로 남깁니다</text>
  <text x="116" y="900" font-family="Arial" font-size="17" fill="#9ca3af">오늘은 누가 집행하고 어떤 제도가 전세금을 옮기는지입니다.</text>
