  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#fb7185" text-anchor="middle">-1.36%</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 16 close, down 5,000 won to 362,000. KOSPI rose 1.37% the same day.</text>
