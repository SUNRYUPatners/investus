  <text x="540" y="908" font-family="Arial" font-size="18" fill="#fb7185" text-anchor="middle">Why it matters</text>
  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When decliners outnumber advancers, sector temperatures split even if the index rises. Hyundai still has US plants</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">that help on tariffs. Next: watch whether auto shares rejoin the index once oil and rates calm.</text>
