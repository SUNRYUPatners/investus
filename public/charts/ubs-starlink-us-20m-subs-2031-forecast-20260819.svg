  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">UBS forecasts U.S. subscribers to grow from roughly 3 million today to 20 million by 2031 ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">$6M subscribers by end of 2028 · $6B in revenue by end of 2028 ·</text>
