<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#06121f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#3b82f6"/><stop offset="100%" style="stop-color:#2563eb"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#3b82f630" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#3b82f6" text-anchor="middle">ORCL</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.14</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Oracle founder Larry Ellison canceled his $7.5B stock-sale</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">plan a day after it was disclosed</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="86" font-weight="900" fill="#3b82f6" text-anchor="middle" opacity=".15">💰</text>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#3b82f6" text-anchor="middle">💰</text>
  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">$7.5B</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">The trading plan covered up to 50 million shares. Oracle disclosed it in a filing, and Ellison</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">scrapped it the very next day.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">📄</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#3b82f6" text-anchor="middle">Filed</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Disclosed first</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Regulatory filing on the plan</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🔁</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#3b82f6" text-anchor="middle">Canceled</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Reversed next day</text>
  <text x="540" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">No shares were actually sold</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#3b82f6" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">🏛</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#3b82f6" text-anchor="middle">Founder</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Stake intact</text>
  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Held since Oracle’s founding</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#3b82f6" text-anchor="middle">A 10b5-1 trading plan lets insiders sell on a pre-set schedule. This time, the plan was pulled</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#3b82f6" text-anchor="middle">before any sale happened.</text>
  <rect x="60" y="838" width="960" height="172" rx="14" fill="#0a1420" stroke="#3b82f6" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#3b82f6" text-anchor="middle">Why it matters</text>
  <text x="540" y="896" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Large insider sale plans are often read as a confidence signal. Canceling one instead suggests the founder still wants</text>
  <text x="540" y="918" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">to hold. Watch for whether a new plan gets filed next.</text>
  <text x="540" y="1028" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Oracle · Founder stake · 2026.09.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>