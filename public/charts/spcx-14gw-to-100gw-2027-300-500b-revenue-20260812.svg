  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Sawyer Merritt이 전한 Musk 발언에 따르면 스페이스X가 현재 1.4 GW 통신 용량을 2027년 말까지 100</text>
