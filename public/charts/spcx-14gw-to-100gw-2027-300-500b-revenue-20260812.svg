  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">SpaceX has 1.4 GW nameplate draw today · aiming to hit 100 GW by end of next year (2027) ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">if we bring 100 GW of AI online by end of next year revenue $300-500B a year · big numbers</text>
