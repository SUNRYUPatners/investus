  <text x="540" y="714" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">"스페이스X는 현재 1.4 GW의 통신 용량을 가지고 있고 2027년 말까지 100 GW를 목표로 하고 있습니다. 이</text>
