  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.02</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Twenty-four Cybercabs at Giga Texas are testing signals,</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">highways, and night unsupervised runs</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">🏭</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">24 · D-2</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Two days to the Sept 1 Cybercab event: factory-campus tests cover traffic lights, highway, and</text>
  <text x="540" y="369" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">night unmanned operation.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="396" width="300" height="196" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">🚗</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">24</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Giga Texas</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Dedicated Cybercab test fleet</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">🚦</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">Signals</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Urban intersections</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Stop, go, and yield logic</text>
  <rect x="720" y="396" width="300" height="196" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="448" font-family="Arial" font-size="40" text-anchor="middle">🌙</text>
  <text x="870" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">Night</text>
  <text x="870" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Unsupervised</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Lighting and sensor checks</text>
  <rect x="60" y="610" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="656" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">Cybercab is a purpose-built robotaxi without a wheel or pedals. Twenty-four units are cycling</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">traffic lights, highway, and night routes at Giga Texas ahead of the Sept 3 Austin event—final</text>
  <text x="540" y="708" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">tests before public visibility. The key is whether factory trials translate to public-road fleet</text>
  <text x="540" y="734" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">growth.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Test counts lead commercial fleet metrics. Night unmanned runs stress cameras, radar, and permit scope together.</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">After the event, verify unmanned footage, geofence maps, and production timing. Separate tests from commercial</text>
  <text x="540" y="920" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">rollout when tracking near-term stock moves.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Cybercab Giga testing · 2026.09.02</text>
