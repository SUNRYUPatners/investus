<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.14</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">TSLA — Nevada 자율주행 차량 네트워크 회사 허가 획득·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">최대 40대 로보택시 상업 서비스 시작</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#4ade80" text-anchor="middle" opacity=".15">✅</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#4ade80" text-anchor="middle">✅</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">Nevada 허가</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Sawyer Merritt 전달에 따르면 Nevada 교통청이 Tesla에 자율주행 차량 네트워크 회사 허가를</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">승인했습니다. 이제 Tesla가 Nevada 도로에서 최대 40대까지 완전 자율주행 로보택시로 상업 서비스를</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">시작할 수 있게 됐고, 예약·픽업 시스템도 승인됐습니다.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">✅</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">40대</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Nevada 최대 로보택시</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">허가 승인</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🚕</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">상업 서비스</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">예약·픽업 시작 가능</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">실 매출 시점</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">👤</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">초기 안전 담당자</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">후속 원격 조작</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">단계적 전환</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">SAWYER MERRITT · NEVADA 교통청</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"Tesla가 Nevada에서 자율주행 차량 네트워크 회사 허가를 받았습니다. 최대 40대의 자율 차량으로</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">Robotaxi 상업 서비스를 시작할 수 있게 됐습니다."</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Tesla has received its Autonomous Vehicle Network Company permit in Nevada ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Nevada Transportation Authority · Tesla granted permit · max 40 vehicles · Robotaxi passenger operator ·</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Sawyer Merritt · Nevada Transportation Authority · 2026.08.13</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">어제 별개 리포트의 Cybercab 43/44 스티어링 없음 대량 관측·오늘 별개 리포트의 Austin 무감독 배치 임박에 이어 Nevada</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">상업 허가 획득으로 실제 매출 시작이 임박합니다. MS의 로보택시 증명 요구에 대한 결정적 대응입니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Nevada 40대 허가 · 2026.08.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">INVESTUS · SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>