  <text x="540" y="714" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">"엘론 머스크가 SPCX 주식 6,418,547,315주를 소유하고 있으며, 이는 SPCX 총 발행 주식의 48.4%에</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">해당한다고 SEC가 공식 확인했습니다."</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">SEC confirming Elon Musk owns 6,418,547,315 shares of SpaceX SPCX stock representing 48.4% of the</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">company</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: SEC · Elon Musk · 2026.08.13</text>
