  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">SPCX — SEC 공식 확인 "Musk가 스페이스X 지분 48.4%·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">64억 1,854만 주 소유·개인 지분 사상 최대급 공개"</text>
