  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">48.4%</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">SEC 공식 서류에 따르면 엘론 머스크가 SPCX 주식 64억 1,854만 7,315주를 소유하고 있으며 이는 SPCX</text>
