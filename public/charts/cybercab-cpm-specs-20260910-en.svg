  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">With 47.6 kWh and 3,113 lbs</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">6.1 mi/kWh is an energy cell; Goldman’s 30 cents is an opinion cell. Do not mash no-paint and</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">paint-shop −70% into one conclusion. Next: real-world efficiency.</text>
  <rect x="60" y="842" width="960" height="172" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A spec sheet is closer to design intent. Production tolerances and insurance have not printed. If this overlaps</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">yesterday’s 6.1 mi/kWh field note, refresh with width, screen, and weight. Lower efficiency sets a lower floor</text>
  <text x="540" y="944" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">under robotaxi fares over years.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Cybercab specs · 2026.09.10</text>
