  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.10</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Cybercab was listed as lowest fully loaded cost per mile, 69″</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">wide, 22″ screen, 6.1 mi/kWh</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="360" y="166" width="360" height="46" rx="23" fill="#4ade8018" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">📐 specs · efficiency</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">📐</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#4ade80" text-anchor="middle">6.1</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Fully loaded cost spreads vehicle, energy, insurance, and service over a mile. The same card shows</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">69″ width, 22″ screen, 47.6 kWh, 6.1 mi/kWh, 3,113 lbs, and 43.4″ legroom.</text>
