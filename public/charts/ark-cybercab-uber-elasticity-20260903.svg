  <text x="540" y="776" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">TAM(전체 시장) 30~60배는 「로bo가 택시보다 훨씬 큰 시장」 가정입니다. 탄력성(elasticity)은 가격이 내려가면</text>
