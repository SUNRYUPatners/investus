  <text x="540" y="940" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">모델 숫자는 오늘 행사 결과로 부분 검증됩니다. 무인 마일·요금·지오펜스가 TAM 가정과 맞는지 분기마다 기록하시기 바랍니다.</text>
  <text x="540" y="962" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">우버는 「경쟁 비용」 프레임, 테슬라는 「fleet owner」 프레임으로 같은 날 두 갈래 서사가 갈립니다.</text>
