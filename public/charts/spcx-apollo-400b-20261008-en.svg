  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#f9fafb" text-anchor="middle">SpaceX Pursues $400B</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#8b5cf6" text-anchor="middle">Apollo-Led Financing</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#1e1040" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Purpose: fund Nvidia chip purchases</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#8b5cf6" text-anchor="middle">$400B</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">$100B bank loans + $300B Apollo private credit — target close 2026</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1e1040" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#0a0518" stroke="#8b5cf6" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Bank loans</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#8b5cf6" text-anchor="middle">$100B</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Senior secured</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Multi-bank consortium</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#0a0518" stroke="#6d28d9" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Private credit</text>
