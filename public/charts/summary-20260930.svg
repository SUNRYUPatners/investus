<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.30 한장 요약</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="100" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="100" rx="4" fill="#4ade80"/>
  <text x="116" y="148" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">크로아티아가 테슬라 감독 완전자율주행을 승인하며 유럽은 여덟 나라가</text>
  <text x="116" y="173" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">됐습니다</text>
  <text x="116" y="190" font-family="Arial" font-size="16" fill="#9ca3af">인구를 더하면 유럽연합 65% 가운데 12.66%입니다. 세계 합산은 열여섯 나라라는 글이 따로 있습니다.</text>
  <text x="985" y="172" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">8개국</text>
  <rect x="60" y="232" width="960" height="100" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="232" width="8" height="100" rx="4" fill="#c084fc"/>
  <text x="116" y="258" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">앤트로픽이 2029년까지 스페이스X 연산에 최대 845억 달러를 쓰겠다고</text>
  <text x="116" y="283" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">밝혔습니다</text>
  <text x="116" y="300" font-family="Arial" font-size="16" fill="#9ca3af">엔비디아 기반 용량입니다. 그림의 2031년 막대는 66.6기가와트입니다.</text>
  <text x="985" y="282" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">845억$</text>
  <rect x="60" y="342" width="960" height="100" rx="14" fill="#0a1a0a" stroke="#22c55e" stroke-width="2"/>
  <rect x="60" y="342" width="8" height="100" rx="4" fill="#22c55e"/>
  <text x="116" y="368" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">테슬라와 스페이스X가 태양광 모듈을 한 해 200기가와트 만드는 쪽을</text>
  <text x="116" y="393" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">보고 있습니다</text>
  <text x="116" y="410" font-family="Arial" font-size="16" fill="#9ca3af">오늘 미국 모듈 능력의 약 세 배라는 비교가 붙었습니다.</text>
  <text x="985" y="392" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22c55e" text-anchor="end">200GW</text>
  <rect x="60" y="452" width="960" height="100" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="452" width="8" height="100" rx="4" fill="#4ade80"/>
  <text x="116" y="478" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">감독 완전자율주행 누적 거리가 안전보고서 기준 150억 마일을</text>
  <text x="116" y="503" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">넘었습니다</text>
  <text x="116" y="520" font-family="Arial" font-size="16" fill="#9ca3af">도시 구간은 58억 마일대입니다. 140억 이후 29일 만에 10억 마일이 더해졌습니다.</text>
  <text x="985" y="502" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">150억mi</text>
  <rect x="60" y="562" width="960" height="100" rx="14" fill="#061209" stroke="#86efac" stroke-width="2"/>
  <rect x="60" y="562" width="8" height="100" rx="4" fill="#86efac"/>
  <text x="116" y="588" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#86efac">오스틴 월요일 저녁 사이버캡 8.33달러가 우버엑스 10.90달러보다</text>
  <text x="116" y="613" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#86efac">쌌습니다</text>
  <text x="116" y="630" font-family="Arial" font-size="16" fill="#9ca3af">시간은 우버가 9분, 사이버캡이 11분입니다. 지난주 같은 시간대는 16.89달러였습니다.</text>
  <text x="985" y="612" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#86efac" text-anchor="end">$8.33</text>
  <rect x="60" y="672" width="960" height="100" rx="14" fill="#06121f" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="672" width="8" height="100" rx="4" fill="#60a5fa"/>
  <text x="116" y="698" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">AMD가 페이페이 리의 월드랩스를 약 82억 달러 전액 주식으로</text>
  <text x="116" y="723" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">인수합니다</text>
  <text x="116" y="740" font-family="Arial" font-size="16" fill="#9ca3af">발표는 9월 28일이고, 규제 승인을 거쳐 올해 안 마무리를 기대합니다.</text>
  <text x="985" y="722" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">82억$</text>
  <rect x="60" y="782" width="960" height="100" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="782" width="8" height="100" rx="4" fill="#facc15"/>
  <text x="116" y="818" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">테슬라 신용 한도는 3년 200억 달러와 리볼버 100억 달러입니다</text>
  <text x="116" y="852" font-family="Arial" font-size="16" fill="#9ca3af">피치는 최대 300억 달러 설비를 기회 되면 확보하는 계획이라고 설명했습니다.</text>
  <text x="985" y="832" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">300억$</text>
  <rect x="60" y="892" width="960" height="100" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="892" width="8" height="100" rx="4" fill="#c084fc"/>
  <text x="116" y="918" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">올해 12월 스페이스X 연환산 매출이 1,000억 달러를 넘을 것이라는 말이</text>
  <text x="116" y="943" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">있습니다</text>
  <text x="116" y="960" font-family="Arial" font-size="16" fill="#9ca3af">물음표가 아니고, 더 보태지 않아도 그 속도라는 문장입니다.</text>
  <text x="985" y="942" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">ARR</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 유럽 8개국 · 845억 달러 · 태양광 200GW · 150억 마일 · 오스틴 8.33달러 · 월드랩스 · 신용 300억 · 12월 연환산</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>