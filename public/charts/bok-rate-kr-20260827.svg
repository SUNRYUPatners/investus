  <text x="540" y="704" font-family="Arial" font-size="19" fill="#fcd34d" text-anchor="middle">"기준금리는 한국은행이 정하는 돈의 값입니다. 이 값이 오르면 대출 이자가 올라 소비와</text>
  <text x="540" y="732" font-family="Arial" font-size="19" fill="#fcd34d" text-anchor="middle">투자가 위축되기 때문에 보통 주식에는 부담으로 작용합니다. 그런데 이번에는 인상이 이미</text>
  <text x="540" y="760" font-family="Arial" font-size="19" fill="#fcd34d" text-anchor="middle">예상돼 있었고, 같은 시각 미국 인공지능 반도체 실적이 예상을 넘겼다는 소식이 들어오면서</text>
  <text x="540" y="788" font-family="Arial" font-size="19" fill="#fcd34d" text-anchor="middle">수출주로 매수가 몰렸습니다. 시장은 금리보다 실적 쪽을 먼저 본 셈입니다."</text>

  <rect x="60" y="830" width="960" height="146" rx="14" fill="#1a1000" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="860" font-family="Arial" font-size="18" fill="#f59e0b" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">금리를 올리는 날에 지수가 오르는 것은 흔한 일이 아닙니다. 시장이 인상 자체보다 그다음 신호, 즉 인상이 여기서</text>
  <text x="540" y="914" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">멈출지에 더 관심을 뒀다는 해석이 가능합니다. 다만 금리가 높아진 상태가 길어지면 대출 부담은 시차를 두고</text>
  <text x="540" y="938" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">기업 이익과 소비에 나타납니다. 다음에는 총재의 발언 수위, 원/달러 환율, 국고채 3년물 금리, 외국인 순매수를</text>
