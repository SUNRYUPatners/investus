  <text x="540" y="104" font-family="Arial Black,Arial" font-size="29" font-weight="900" fill="#f9fafb" text-anchor="middle">한국은행이 금리를 두 번 연속 올렸는데도 코스피는 1.53% 올랐습니다</text>
  <line x1="80" y1="122" x2="1000" y2="122" stroke="#1f2937" stroke-width="1"/>

