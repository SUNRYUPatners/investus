  <text x="540" y="252" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#f59e0b" text-anchor="middle">금리 인상이 곧 하락은 아니었습니다</text>
  <text x="540" y="286" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">교과서와 반대로 움직인 날이었습니다. 왜 그랬는지 아래에서 나눠 보시기 바랍니다.</text>
