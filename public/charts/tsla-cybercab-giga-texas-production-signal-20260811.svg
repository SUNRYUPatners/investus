<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.11</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">TSLA — Cybercab 로고 부착 차량 Giga Texas에 대량 목격·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">상업 생산 임박 신호</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#4ade80" text-anchor="middle" opacity=".15">🚕</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#4ade80" text-anchor="middle">🚕</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">생산 임박</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Joe Tegtmeyer가 관측한 바에 따르면, 지난 주 낮았던 Cybercab 생산이 오늘 Giga Texas 서쪽 라인에</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">크게 늘어난 모습입니다. 이번엔 문·</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">해치에 "Cybercab" 로고가 실제 부착된 상태로, 상업 생산 준비의 명확한 시그널입니다.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">🚕</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">로고 부착</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Cybercab 정식 배지</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">문·해치에 새겨짐</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">생산 증가</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">지난 주 저조 → 오늘 급증</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">서쪽 라인</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">🏭</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">Giga Texas</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">생산 지점</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">미국 최대 Tesla 공장</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">JOE TEGTMEYER</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"Cybercab 생산이 지난 주 낮았지만 오늘 Giga Texas 서쪽 라인에 로고 부착 차량 대량 목격·</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">상업 생산 준비 신호"</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Cybercab production low last week, but today many with "Cybercab" logos on doors/hatches lining up on W side</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">at Giga Texas · commercial production readiness signal</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Joe Tegtmeyer · 2026.08.10</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">며칠 전 삼성전기·LG이노텍의 Cybercab 카메라 5억 달러 계약, Robotaxi Ops 6개 도시 채용에 이어 실제 생산 차량이 라인에</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">등장했습니다. 상업 로보택시 서비스 개시가 코앞이라는 강력한 시그널입니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA Cybercab · 생산 임박 · 2026.08.11</text>
