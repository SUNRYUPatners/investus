  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.01</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">"Let Data Reign" rhetoric overlaps with a count of 5,375 US</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">data centers leading the world</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <rect x="341" y="166" width="398" height="46" rx="23" fill="#94a3b818" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#94a3b8" text-anchor="middle">🏛️ Let Data Reign · US 5,375 DCs</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🏢</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#94a3b8" text-anchor="middle">5,375</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">AI and cloud competition is shifting from chips to sites, power, and permits—the US leads in</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">facility count but grid bottlenecks remain.</text>
  <line x1="80" y1="436" x2="1000" y2="436" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="496" font-family="Arial" font-size="34" text-anchor="middle">🇺🇸</text>
  <text x="210" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">5,375</text>
  <text x="210" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">US facilities</text>
  <text x="210" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Most data centers globally</text>
  <rect x="390" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="496" font-family="Arial" font-size="34" text-anchor="middle">⚡</text>
  <text x="540" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">Power</text>
  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Bottleneck</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Demand rising in GW blocks</text>
  <rect x="720" y="450" width="300" height="178" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="870" y="496" font-family="Arial" font-size="34" text-anchor="middle">📋</text>
  <text x="870" y="542" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#94a3b8" text-anchor="middle">Permits</text>
  <text x="870" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Local rules</text>
  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Land, water, environment</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">Data centers house AI and cloud servers. The United States at 5,375 sites leads the world in</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">facility count; "Let Data Reign" reads as political emphasis on data and AI infrastructure as</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">national competitiveness. Many sites still face separate power, transformer, and</text>
  <text x="540" y="768" font-family="Arial" font-size="19" fill="#94a3b8" text-anchor="middle">grid-connection bottlenecks.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Investors should track powered gigawatts, not facility counts alone. Policy rhetoric can affect permit speed, tax</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">treatment, and power priority. Follow regional approvals, power queues, and cloud capex together. The gap between</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">chip orders and powered data centers is a 2026–27 key variable.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Macro · data centers · 2026.09.01</text>
