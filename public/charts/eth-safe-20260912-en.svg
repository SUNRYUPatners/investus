  <text x="540" y="656" font-family="Arial" font-size="19" fill="#818cf8" text-anchor="middle">The daily bounce was larger than bitcoin’s. Alts often swing more on a CPI-relief day.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#15162a" stroke="#818cf8" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#818cf8" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Ether is closer to a computer on top of digital gold. Today reclaimed $2,600. Over 3–5 years network usage can</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">become the price floor.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">ETH · $2,610 zone · 2026.09.12</text>
