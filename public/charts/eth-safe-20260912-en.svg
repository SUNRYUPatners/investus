  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">⟠</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">2,610</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">One morning print was $2,500.52. The session ran about $2,433 to $2,648. The token of a</text>
  <text x="540" y="369" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">smart-contract network.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="396" width="300" height="196" rx="16" fill="#15162a" stroke="#818cf8" stroke-width="2"/>
  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">🌅</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#818cf8" text-anchor="middle">2,500</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Morning print</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">$2,500.52</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#15162a" stroke="#818cf8" stroke-width="2"/>
  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">🌇</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#818cf8" text-anchor="middle">2,613</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Afternoon reclaim</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Back through $2,600</text>
