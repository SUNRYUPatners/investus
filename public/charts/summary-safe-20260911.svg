  <rect x="60" y="497" width="8" height="115" rx="4" fill="#f97316"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f97316">브렌트가 101.21달러로 7월 이후 첫 종가 100달러입니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">중동 긴장 프리미엄이 붙은 종가입니다. 금·비트코인과 달리 인플레 입력입니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">유가</text>
