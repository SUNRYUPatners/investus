  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">금리가 오르면 금·비트코인 같은 무이자 자산의 기회비용이 커집니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">자산마다 움직이는 속도가 다릅니다. 금리 하루가 금·코인·유가에 각각 닿습니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">할인</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: BTC 7.7만권 · 금 4365 · ETH 2460 · 브렌트 101.21 · 10년 4.92% · PPI 5.4%</text>
