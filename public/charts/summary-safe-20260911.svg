  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f7931a">비트코인이 7만 7천~7만 8천 달러권에서 약세를 이어 갔습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">8만 달러 회복은 실패했습니다. 10년물 4.92%와 생산자물가 5.4%가 할인율을 올렸습니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f7931a" text-anchor="end">BTC</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#facc15"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">금은 온스 약 4,365달러권에서 실질금리에 눌렸습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">4,400달러 아래입니다. 금리는 금을 누르고, 비트코인은 더 빨리 움직입니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">금</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#0f1024" stroke="#818cf8" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#818cf8"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#818cf8">이더리움은 약 2,460달러권으로 비트코인 베타를 따랐습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">비트코인보다 조금 더 약할 수 있는 하루입니다.</text>
