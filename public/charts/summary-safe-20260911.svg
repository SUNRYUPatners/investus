  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f97316">8월 생산자물가가 전년 대비 5.4%로 예상 5.3%를 웃돌았습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">소비자물가와 9월 16일 회의가 다음 게이트입니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">PPI</text>
