  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">색으로 식별</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">호출 차량 확인</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">👀</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">금색 차량</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">시험 주행 목격</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">녹색·주황 띠 확인</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="680" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"사이버캡 전면 조명이 색을 바꿉니다. 호출 앱이 차량마다 색을 배정해 승객이 붐비는 곳에서도 자기 차량을 찾을</text>
  <text x="540" y="706" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">수 있게 하는 방식입니다. 시험 주행에서는 금색 차체에 녹색과 주황색 띠가 켜진 모습이 확인됐습니다."</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">무인 차량은 승객을 안내해 줄 사람이 없으므로 식별 장치가 운영 효율과 직접 연결됩니다. 탑승 대기 시간이 줄면 차량 한 대의 하루 운행</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">횟수가 늘어납니다. 다만 밝은 낮이나 먼 거리에서는 색 식별 효과가 떨어질 수 있습니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 사이버캡 조명 · 2026.08.28</text>
