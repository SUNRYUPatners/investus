  <rect x="54" y="390" width="972" height="168" rx="16" fill="#0F1623" stroke="#A855F7" stroke-width="2.5"/><text x="108" y="440" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#A855F7">①</text><text x="170" y="440" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">SPCX Acquires TSLA</text><text x="108" y="482" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">Tesla shareholders receive SpaceX shares as</text><text x="108" y="514" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">consideration</text><rect x="54" y="580" width="972" height="168" rx="16" fill="#0F1623" stroke="#EC4899" stroke-width="2.5"/><text x="108" y="630" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#EC4899">②</text><text x="170" y="630" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">New Holding Company</text><text x="108" y="672" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">Both become subsidiaries of a newly established parent</text><text x="108" y="704" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">company</text><rect x="54" y="770" width="972" height="168" rx="16" fill="#0F1623" stroke="#3B82F6" stroke-width="2.5"/><text x="108" y="820" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#3B82F6">③</text><text x="170" y="820" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">All-Stock Transaction</text><text x="108" y="862" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">No cash payment — companies exchange shares to complete</text><text x="108" y="894" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">the deal</text>

