    <text x="108" y="1150" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Reuters named three specific deal structures — this is not vague reporting.</text><text x="108" y="1184" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Apollo &amp; Goldman hiring signals the deal has entered formal legal phase.</text><text x="108" y="1218" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">Under scenario ①: TSLA holders directly receive SpaceX shares.</text>

