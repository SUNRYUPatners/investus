  <rect x="60" y="418" width="300" height="176" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Now</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#ef4444" text-anchor="middle">&lt;5%</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Share</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">yield &gt; 10yr</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#1c0d0d" stroke="#ef4444" stroke-width="2"/>
