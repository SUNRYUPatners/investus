  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">Why the share shrank</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">📉 Higher yields make dividends less competitive</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">📊 A growth-heavy index has fewer coupon stocks</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">⚠️ May 2007 sat just before the financial crisis</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#1c0d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#ef4444" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">When few stocks yield more than Treasuries, equities are a growth and buyback story. 4.41% is an August 31</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">snapshot. A hot payrolls print can lift yields and shrink the share further.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Macro · dividend vs 10yr · 2026.09.04</text>
