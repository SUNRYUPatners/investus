  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">📉</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#ef4444" text-anchor="middle">&lt;5%</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The thinnest share since May 2007. The 10-year was 4.41% as of August 31; the long-run mean is</text>
  <text x="540" y="383" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">about 18%.</text>
