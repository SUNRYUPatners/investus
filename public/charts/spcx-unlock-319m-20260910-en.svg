  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">First window</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Calendar-based</text>
