  <text x="540" y="686" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">Unlock means they can sell—not that they will sell all of it. −3.86% is a one-day tape. Split from</text>
  <text x="540" y="710" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">Musk’s combined $3.48T.</text>
