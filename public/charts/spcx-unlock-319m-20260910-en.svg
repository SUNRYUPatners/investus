  <text x="540" y="868" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="896" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">More float can raise supply volatility. Watch actual sale filings beside the calendar. Next: the 180-day block and</text>
  <text x="540" y="918" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">insider reports. After lockups fade, price discovery sits closer to the open market.</text>
  <text x="540" y="1028" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · 319M unlock · 2026.09.10</text>
