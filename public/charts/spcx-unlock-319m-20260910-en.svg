  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">319M</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">A lockup blocks insiders from selling for a set time. About 319M shares (~7%) entered the</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">day-90 calendar window; the next block is 180 days. The same board showed $147.55 (−3.86%…</text>
