  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">이벤트 데이는 발표와 상용 fleet 숫자가 엇갈리면 변동성이 커질 수 있습니다</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">행사 후 무인 영상·허가 범위·유료 승차 일정을 분리해 기록하시기 바랍니다</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">사이버캡(Cybercab)은 처음부터 무인 운행용으로 만든 전용 차량입니다. V15는 최신 FSD 소프트웨어 세대로, 무인</text>
