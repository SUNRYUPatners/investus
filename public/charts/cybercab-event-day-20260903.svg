  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">플릿 대량 투입·FSD V15 무인 시승·역사적 날이라는 기대가 겹칩니다. 사이버캡은 운전석 없는 전용…</text>
