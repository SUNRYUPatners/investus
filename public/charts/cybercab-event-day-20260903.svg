  <rect x="60" y="842" width="960" height="148" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">오늘은 「말」이 아니라 「영상·숫자·일정」이 나오는 날입니다. 골든 시범 차량과 상용 fleet을 구분하고, 지오펜스 면적·등록</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">대수·무인 마일 비중을 행사 직후 확인하시기 바랍니다. 단기 레버리지는 결과 확인 전 신중하시면 됩니다.</text>
