  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">금리가 오를 것으로 보면 무이자 자산의 기회비용이 커집니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">자산마다 속도가 다릅니다. 16일 회의가 다음 게이트입니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">할인</text>
