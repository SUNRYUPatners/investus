  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">은이 온스 63.60달러로 하루 5.48% 내렸습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">금보다 출렁임이 큽니다. 태양광·전자 원료이기도 합니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">은</text>
