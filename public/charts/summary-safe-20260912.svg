  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#818cf8">이더리움이 아침 2,500달러권에서 오후 2,610달러권으로 회복했습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">장중 2,433~2,648달러입니다. 비트코인보다 하루 반등이 컸습니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#818cf8" text-anchor="end">ETH</text>
