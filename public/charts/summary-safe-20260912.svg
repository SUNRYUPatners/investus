  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f97316">서부텍사스산 101달러권, 브렌트 106달러권으로 주간 100달러 위입니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">경유가 갤런 6달러를 처음 넘었습니다. 물가 입력입니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">유가</text>
