  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">금 온스가 약 4,318~4,377달러에서 흔들렸습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">한 화면은 4,318달러(−1.83%)입니다. 은보다 낙폭이 작았습니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">금</text>
