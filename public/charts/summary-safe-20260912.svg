  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">8월 소비자물가가 전년 3.4%, 근원 월 0.3%였습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">16일 인상 확률은 85~90%권입니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">CPI</text>
