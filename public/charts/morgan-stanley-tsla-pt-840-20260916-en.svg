  <text x="540" y="868" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="896" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">$840 assumes several businesses go right at once. Watch whether actual robotaxi city expansion and Semi delivery</text>
