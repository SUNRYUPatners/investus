  <text x="540" y="874" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A paid-ride screen is not a citywide permit. Check whether $4.20 is a flat quote or a surge, and which geofence it</text>
