  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.22 Housing Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="209" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="209" rx="4" fill="#fb923c"/>
  <text x="116" y="197" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">Seoul apartment jeonse is up 7.79% this year, the steepest…</text>
  <text x="116" y="243" font-family="Arial" font-size="17" fill="#9ca3af">About 4.7 times last year’s pace through the same week.</text>
  <text x="985" y="230" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">+7.79%</text>
  <rect x="60" y="341" width="960" height="209" rx="14" fill="#1a0d02" stroke="#f97316" stroke-width="2"/>
  <rect x="60" y="341" width="8" height="209" rx="4" fill="#f97316"/>
  <text x="116" y="416" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f97316">Northeast Seoul now sees 84-square-meter jeonse near ₩1…</text>
  <text x="116" y="462" font-family="Arial" font-size="17" fill="#9ca3af">Seongbuk, Dongdaemun, Gangbuk and Nowon are printing those asks.</text>
  <text x="985" y="449" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">₩1B</text>
  <rect x="60" y="560" width="960" height="209" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="560" width="8" height="209" rx="4" fill="#a78bfa"/>
  <text x="116" y="635" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">The government pledged 1.19 million public homes by 2030</text>
  <text x="116" y="681" font-family="Arial" font-size="17" fill="#9ca3af">About 240,000 a year, 920,000 in the capital region.</text>
  <text x="985" y="668" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">1.19M</text>
  <rect x="60" y="779" width="960" height="209" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="779" width="8" height="209" rx="4" fill="#38bdf8"/>
  <text x="116" y="854" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#38bdf8">Seoul completions fall further to 17,012 homes in 2027</text>
  <text x="116" y="900" font-family="Arial" font-size="17" fill="#9ca3af">This year’s 26,951 planned units are already 27.4% below last year.</text>
  <text x="985" y="887" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">17,012</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: +7.79% YTD · northeast ₩1B · 1.19M public homes · 2027 completions 17,012</text>
