  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8">코스피가 7,051.64로 33거래일 만에 7,000선을 종가로 회복했습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">장중 고점 7,112.48·시가 6,972.87입니다. 코스닥은 830.37(+2.28%)입니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">+1.40%</text>
