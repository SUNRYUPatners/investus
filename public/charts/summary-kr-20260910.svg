  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">장중 1,883,000원까지 갔습니다. 퀄컴·인텔 서사는 중기 칸입니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">하이닉스</text>
