  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">삼성전자는 269,500원 보합입니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">장중 275,000원까지 올랐다 반납했습니다. 외국인 삼성 매도는 개별 칸입니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">삼성</text>
