  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">엘지에너지솔루션이 371,000원(+6.46%)으로 시총 상위를 이끌었습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">중국산 배터리 규제 반사이익 기대가 붙었습니다. 수주와 종가를 나누시기 바랍니다.</text>
