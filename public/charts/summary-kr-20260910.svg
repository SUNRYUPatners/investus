  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">삼성전기가 1,404,000원(+2.48%)이었습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">반도체 소재·부품 강세와 같은 줄기입니다. 하이닉스와 칸을 나누시기 바랍니다.</text>
