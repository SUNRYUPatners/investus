  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">현대차는 388,000원(+0.78%)으로 온도가 달랐습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">유가·할부 수요 축입니다. 반도체 베타와 한 문장에 넣지 마시기 바랍니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">현대</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 7051.64 · 기관 9005억 · 삼성 보합 · 하이닉스 +3.51% · 엔솔 +6.46% · 전기 +2.48%</text>
