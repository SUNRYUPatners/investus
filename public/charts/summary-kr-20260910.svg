  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee">기관이 9,005억 원 샀고 개인은 2.4971조 원 팔았습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">외국인은 1,702억 원 팔았습니다. 기관은 5거래일 연속 매수입니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">수급</text>
