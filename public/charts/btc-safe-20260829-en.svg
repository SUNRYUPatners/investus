<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0f00"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f7931a"/><stop offset="100%" style="stop-color:#e07c0a"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#f7931a30" stroke="#f7931a" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f7931a" text-anchor="middle">BTC</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.29</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Bitcoin gave up $78,000 after the hawkish Jackson Hole</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">message</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="271.5" y="160" width="537" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">$369M liquidated in 24 hours · 87,082 traders</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#201408" stroke="#f7931a" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#f7931a" text-anchor="middle">Below $78,000</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">It was $79,623.35 at midnight KST, down 0.86%, and broke the line around 1:25 a.m.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">🪙</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f7931a" text-anchor="middle">79,623</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Midnight price ($)</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Down 0.86% on the day</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">💥</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f7931a" text-anchor="middle">$369M</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">24-hour liquidations</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">87,082 traders were</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">closed out</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">🔗</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f7931a" text-anchor="middle">2,516</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Ethereum ($)</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">It gave up $2,500</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#201408" stroke="#f7931a" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">📉</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f7931a" text-anchor="middle">$2.18M</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Largest single liq.</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">On one derivatives pair</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">A liquidation is a leveraged position force-closed once losses pass its collateral</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">That selling is not a decision, so it turns a decline into more decline</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#f7931a" text-anchor="middle">Derivatives volume shrank at the same time and bitcoin dominance eased. That points to old positions</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#f7931a" text-anchor="middle">being cleared rather than new money arriving.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#201408" stroke="#f7931a" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#f7931a" text-anchor="middle">Why it matters</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Bitcoin pays no yield, so when the market prices in higher policy rates, deposits and bonds gain relative appeal. The</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">cause of this drop sits in rate expectations rather than inside crypto. Track the US 2-year yield and spot ETF flows</text>
  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">next.</text>
  <text x="540" y="1026" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Bitcoin · after Jackson Hole · 2026.08.29</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>