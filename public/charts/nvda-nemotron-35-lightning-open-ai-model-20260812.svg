  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">1/3 비용</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Bull Theory 정리에 따르면 엔비디아가 자체 오픈 AI 모델 Nemotron 3.5 Lightning을 출시했습니다.</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Meta의 강력한 모델 지식을 작게 압축한 형태로 일반 작업 비용이 저렴합니다. 단순 작업은 작은 모델로, 복잡</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">작업은 강력한 모델로 자동 배분하는 Switchyard 라우터도 함께 공개했고, Opus 4.8 대비 1/3 비용으로</text>
