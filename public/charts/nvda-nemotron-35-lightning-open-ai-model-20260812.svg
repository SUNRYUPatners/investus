  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">BULL THEORY · NVIDIA</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">"엔비디아가 오픈 AI 모델 Nemotron 3.5 Lightning 출시·</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">Switchyard 라우터로 Opus 4.8 대비 1/3 비용에 유사한 정확도"</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">NVIDIA launches Nemotron 3.5 Lightning open AI model · packaged smaller in size cheaper for routine tasks ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Switchyard router · similar accuracy at 1/3 cost of Opus 4.8</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Bull Theory · 2026.08.11</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">엔비디아는 GPU 하드웨어 회사인데 오픈 소프트웨어 모델까지 출시하는 이유는 하드웨어 판매 유지·중국 오픈 모델 대응·자체</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">하드웨어 최적화 소프트웨어 확대입니다. 오늘 별개 리포트의 META Muse Glimmer 오픈과 함께 미국 AI 진영의 오픈 대응</text>
