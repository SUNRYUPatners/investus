  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Q2 revenue</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">14x year over year</text>
