  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">Nasdaq chosen as the listing venue; an October IPO is being planned.</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">Valuation talk centers on ~$2T, well above SpaceX's $86.2B listing.</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">The S-1 hasn't been filed publicly yet — only shared with a few investors.</text>
