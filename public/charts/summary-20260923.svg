<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.23 한장 요약</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">화물 동맹이 전기 대형 트럭 2,500대를 주문하고 테슬라를 주 공급사로…</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">미국 전기 8등급 트럭을 거의 두 배로 늘리는 한 건의 주문입니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">2,500대</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">나스닥이 27,226.40까지 올라가 사상 최고를 다시 찍었습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">차트 종가는 27,226.40, 고가는 27,227.74입니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">27,226</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">그록 4.7이 지능 지수 46점으로 상위 네 실험실에 들어갔습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">코딩 에이전트 지수도 올랐고, 테슬라 차 안 그록이 일을 하기 시작했습니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">46점</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">미국 모델3·모델Y 2026년 새 주문이 거의 소진됐다고 알려졌습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">모델Y L 론치 시리즈는 이미 끝났고, 후륜·사륜도 거의 끝났습니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">소진</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">오스틴 사이버캡 한 건이 12.16달러, 대기 10분으로 찍혔습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">같은 화면에서 모델Y는 4대 대기였습니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">$12.16</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">연방법원이 스페이스X 야생보호 토지 715에이커 교환을 막지 않았습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">스페이스X는 683에이커를 넘기고 보호구역 땅을 받습니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">715에이커</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">미국 가계 순자산의 39.9%가 주식에 들어가 사상 최고입니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">주식 비중이 이렇게 높은 적은 집계상 처음입니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">39.9%</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 세미 2,500대 · 나스닥 27,226 · 그록 46점 · 미국 재고 소진 · 사이버캡 12.16달러 · 715에이커 · 가계 주식 39.9%</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
