  <text x="108" y="372" font-family="Arial,sans-serif" font-size="21" fill="#6B7280">"v15 스택 기반으로 수백만 대 확장 경로 명확"</text>

  <text x="108" y="404" font-family="Arial,sans-serif" font-size="21" fill="#93C5FD">&quot;수백만 대 규모로 확장하는 경로가 명확하게 보인다.&quot;</text><text x="108" y="468" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">&quot;수개월 안에 수백만 대로 확장이 진행 중이다.&quot;</text><text x="108" y="532" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">&quot;지난 수년간의 기술 투자가 이제 결실을 맺고 있다.&quot;</text><text x="108" y="596" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">&quot;v15 스택이 핵심 — 기초가 빙산처럼 수면 아래에 있다.&quot;</text><text x="108" y="660" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">&quot;이 기술은 우리가 운영 가능한 모든 곳의 수백만 대로</text><text x="108" y="688" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">확장될 것이다.&quot;</text>

