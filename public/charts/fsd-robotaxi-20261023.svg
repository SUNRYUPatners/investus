    <text x="108" y="1024" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">FSD VP가 어닝콜에서 직접 &quot;수개월 안에 수백만 대&quot; 발언.</text><text x="108" y="1058" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">이는 Musk의 비전이 아닌 엔지니어링 리더의 기술적 확인이다.</text><text x="108" y="1092" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">v15 스택 → 안전 데이터 업계 최고 → 규제 확장의 선순환.</text><text x="108" y="1126" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">무인주행 누적 200만 마일은 데이터 기반 자율주행의 실증이다.</text>

