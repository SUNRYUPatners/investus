  <text x="116" y="488" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">Texas authorized Cybercabs rose from 45 to 169</text>
  <text x="116" y="522" font-family="Arial" font-size="16" fill="#9ca3af">589 robotaxis are authorized in Texas.</text>
