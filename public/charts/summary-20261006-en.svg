  <text x="116" y="818" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Kalshi prices a 70% chance of a Tesla-SpaceX merger</text>
  <text x="116" y="852" font-family="Arial" font-size="16" fill="#9ca3af">Before 2028. Odds are not a deal.</text>
