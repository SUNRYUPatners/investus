  <text x="116" y="412" font-family="Arial" font-size="16" fill="#9ca3af">The whole market, not just EVs. Share 8.7%.</text>
  <text x="985" y="392" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">1-2</text>
