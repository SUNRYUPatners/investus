  <text x="116" y="632" font-family="Arial" font-size="16" fill="#9ca3af">S1 is the first orbital compute satellite.</text>
  <text x="985" y="612" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">SI</text>
