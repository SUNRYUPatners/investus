  <text x="116" y="302" font-family="Arial" font-size="16" fill="#9ca3af">The Nasdaq also closed at a record.</text>
  <text x="985" y="282" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">$6T</text>
