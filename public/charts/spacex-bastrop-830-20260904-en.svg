  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">+830</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The site was cited for a nickel-superalloy turbine blade and vane foundry.</text>
