  <text x="870" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Crossing</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Doc Bryson</text>
  <rect x="60" y="610" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="656" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">Blades and vanes are hot-section engine parts. Nickel superalloys survive those temperatures.</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">Land next to Starmind ties launch, manufacturing, and materials into one corridor.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Acreage is not a poured foundation or a power tap. Confirm start of construction and hiring in county filings. This is</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">a different supply-chain axis from the Austin Cybercab campus.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SPCX · Bastrop · 2026.09.04</text>
