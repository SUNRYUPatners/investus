  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">ACE</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">ACE는 충돌이 임박했을 때 차가 스스로 피하는 기능입니다. 소프트웨어 2026.27.6에 들어갔고, 운전자가 감독하는</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">FSD는 v14.3.9입니다. 화면에는 두 가지 회피 시나리오가 그려져 있습니다.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
