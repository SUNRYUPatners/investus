  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">충돌 회피</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">FSD 주행과 다른 안전 계층</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">회피 기능과 로보택시 유료 운행은 다릅니다. 텍사스 437대·오스틴 1,000대와 한 문장에 넣지 마시기 바랍니다.</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">다음 확인할 것은 개입률과 배포 대수입니다.</text>
