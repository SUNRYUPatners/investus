  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">감독 버전은 아직 운전자가 법적으로 책임인 단계입니다. 두 시나리오 그림은 광고·설명용일 수 있습니다. 장기적으로 개입률이</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">떨어지면 보험·규제 가정이 가벼워질 수 있습니다.</text>
