  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">자동 충돌 회피(ACE)가 소프트웨어 2026.27.6에 들어왔고 FSD 감독</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">버전은 v14.3.9입니다</text>
