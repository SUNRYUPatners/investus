  <text x="540" y="700" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">"교토대는 약 1,200기 스타링크 위성을 이용해 thermospheric density tomography를 수행했습니다.</text>
  <text x="540" y="728" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">tomography는 여러 측정으로 3D 구조를 복원하는 기법입니다. 위성 인터넷망이 우주 날씨·</text>
