<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#120b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#a78bfa30" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#a78bfa" text-anchor="middle">AI</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.31</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Agent memory demand may rise about 24x by 2030, with HBM</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">sold out through 2026-27</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="86" font-weight="900" fill="#a78bfa" text-anchor="middle" opacity=".15">🧠</text>
  <text x="540" y="238" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#a78bfa" text-anchor="middle">🧠</text>
  <text x="540" y="298" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">~24x</text>
  <text x="540" y="338" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">When AI agents run many steps on their own, each task needs far more data in memory.</text>
  <text x="540" y="364" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Supply plans need to reflect that gap.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="402" width="300" height="220" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">24x</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Demand by 2030</text>
  <text x="210" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A long-range view assuming agent</text>
  <text x="210" y="605" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">adoption</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🧊</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">2026-27</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">HBM sold out</text>
  <text x="540" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">High-bandwidth memory is hard to</text>
  <text x="540" y="605" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">scale quickly</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">🔁</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">5-30x</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Tokens per agent</text>
  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Far more compute than a single Q&amp;A</text>
  <text x="870" y="605" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">turn</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">An agent is closer to a program that searches, calculates, and codes in sequence than to a</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">one-shot chatbot. That is why one user can require 5-30 times more memory traffic. HBM sits</text>
  <text x="540" y="738" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">beside AI accelerators and shuttles data at very high bandwidth.</text>
  <rect x="60" y="844" width="960" height="148" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="874" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The key read is that AI demand must be tracked in gigabytes of memory, not just GPU units. If HBM stays tight</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">through 2026-27, memory makers can drive results through price and mix. Watch quarterly HBM shipments alongside</text>
  <text x="540" y="950" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">commercial agent launch dates.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">AI · agent memory demand · 2026.08.31</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>