<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#150a2e"/></linearGradient>
    <linearGradient id="gp" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#6d28d9"/></linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.14"/><stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="none" stroke="#2e1065" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="6" fill="url(#gp)"/>
  <ellipse cx="540" cy="480" rx="420" ry="360" fill="url(#glow)"/>
  <!-- Stars -->
  <circle cx="120" cy="180" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="280" cy="120" r="1.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="800" cy="160" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="950" cy="240" r="1.5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="180" cy="400" r="1.5" fill="#a78bfa" opacity="0.3"/>
  <circle cx="900" cy="380" r="2" fill="#a78bfa" opacity="0.5"/>
  <!-- Header -->
  <rect x="40" y="24" width="100" height="44" rx="22" fill="#a78bfa22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="90" y="51" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="middle">SPCX</text>
  <text x="540" y="51" font-family="Arial" font-size="17" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS · 2026.10.08</text>
  <!-- Eyebrow -->
  <text x="540" y="148" font-family="Arial" font-size="24" fill="#9ca3af" text-anchor="middle" letter-spacing="1">스타링크 V2 미니 FCC 승인</text>
  <!-- Hero -->
  <text x="540" y="360" font-family="Arial Black,Arial" font-size="240" font-weight="900" fill="url(#gp)" text-anchor="middle">×100</text>
  <text x="540" y="448" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">V1 대비 대역폭 확대</text>
  <!-- Divider -->
  <line x1="120" y1="500" x2="960" y2="500" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <!-- Comparison -->
  <text x="540" y="558" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">V1 vs V2 비교</text>
  <!-- V1 bar -->
  <text x="80" y="610" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="start">V1</text>
  <rect x="140" y="590" width="90" height="36" rx="6" fill="#2e1065"/>
  <text x="185" y="614" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">1x</text>
  <!-- V2 bar -->
  <text x="80" y="660" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="start">V2</text>
  <rect x="140" y="640" width="800" height="36" rx="6" fill="url(#gp)"/>
  <text x="720" y="664" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#0d1117" text-anchor="middle">×100 대역폭</text>
  <!-- 3 stat cards -->
  <rect x="50" y="730" width="300" height="160" rx="16" fill="#150a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="200" y="774" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">FCC 승인 기수</text>
  <text x="200" y="826" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">15,000기</text>
  <text x="200" y="862" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">V2 미니 추가 인가</text>
  <rect x="390" y="730" width="300" height="160" rx="16" fill="#150a2e" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="540" y="774" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">목표 속도</text>
  <text x="540" y="826" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#6d28d9" text-anchor="middle">150 Mbps</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">이용자당 최대</text>
  <rect x="730" y="730" width="300" height="160" rx="16" fill="#150a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="880" y="774" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">현재 궤도</text>
  <text x="880" y="826" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">650기</text>
  <text x="880" y="862" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">모바일 전용 기운용</text>
  <!-- Message box -->
  <rect x="50" y="940" width="980" height="298" rx="18" fill="#0d0520" stroke="#a78bfa33" stroke-width="1.5"/>
  <text x="540" y="990" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#a78bfa" text-anchor="middle">왜 중요한가</text>
  <text x="80" y="1036" font-family="Arial" font-size="23" fill="#e2e8f0">데드존 해소에서 5G급 전국망으로 목표 상향</text>
  <text x="80" y="1076" font-family="Arial" font-size="23" fill="#e2e8f0">T-모바일 제휴 → 기존 통신사 고객 흡수 가능</text>
  <text x="80" y="1116" font-family="Arial" font-size="23" fill="#e2e8f0">승인 15,000기 vs 현재 650기 — 배치 속도가 핵심</text>
  <text x="80" y="1200" font-family="Arial" font-size="19" fill="#9ca3af">다음 달력: V2 첫 배치 발사 일정 공개</text>
  <!-- Bottom -->
  <rect x="0" y="1284" width="1080" height="20" fill="url(#gp)" opacity="0.35"/>
  <text x="540" y="1326" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 · NOT FINANCIAL ADVICE</text>
</svg>
