  <text x="108" y="566" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">작업자: 24파운드 슈트 착용, 40개 카메라+3D 센서 그리드</text><text x="108" y="600" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">로봇이 수행할 동작을 직접 재현 → 초고밀도 데이터 수집</text><text x="108" y="634" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">3교대 24시간 — 멈추지 않는 데이터 파이프라인</text><text x="108" y="668" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">다양한 팀: 각 과제 독립 수행, 서로 연결 모름</text><text x="108" y="702" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">가정 팀: 샌드위치 만들기 등 일상 동작</text><text x="108" y="736" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">공장 팀: HVAC 설치 등 산업 동작</text>
  <rect x="54" y="812" width="972" height="236" rx="22" fill="#0F0A00" stroke="#4C1D95" stroke-width="2.5"/>
