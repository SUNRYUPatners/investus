  <text x="108" y="845" font-family="Arial Black,Arial,sans-serif" font-size="24" font-weight="900" fill="#C084FC">📡 데이터 플라이휠 — Tesla 자동차 대비</text>
  <text x="108" y="884" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Tesla 차량 카메라: 9개  →  Optimus 슈트: 40개 (4.4배)</text><text x="108" y="918" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">24/7 수집으로 플리트 배포 없이도 데이터 폭증</text><text x="108" y="952" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">FSD 플라이휠과 동일한 구조 — 데이터가 모델 개선을 부르는 사이클</text><text x="108" y="986" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">→ Elon: &quot;장난치는 게 아니다&quot; (Robert Scoble 인용)</text>
