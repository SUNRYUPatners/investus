  <text x="108" y="1134" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">학습 데이터 규모 → Optimus 상용화 타임라인 결정</text><text x="108" y="1168" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Robotaxi처럼 &quot;데이터가 먼저 → 제품이 따라온다&quot; 공식</text><text x="108" y="1202" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">→ 아크인베스트: Optimus 데이터 플라이휠 경쟁사 대비 압도적</text>
