<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#06121f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="131" height="38" rx="19" fill="#60a5fa30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="105.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">BREAKING</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.11</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Palantir was called the single most important enterprise</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">stack in the world</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="380" y="160" width="320" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">NVIDIA · PALANTIR</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#60a5fa" text-anchor="middle">Ontology</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">NVIDIA’s CEO called Palantir the single most important enterprise stack. Ontology maps a company’s</text>
  <text x="540" y="346" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">tables and documents; paired with NVIDIA chips it was said to process at the speed of light.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">🗺</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">Ontology</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Company data map</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Lets AI read part</text>
  <text x="176" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">numbers and due dates</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">🏢</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">Foundry</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">With AIP</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The layer that runs</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">workplace AI</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">🏛</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">Sovereign</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Data stays home</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Critical supply chains</text>
  <text x="640" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">onshore</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">🔗</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#60a5fa" text-anchor="middle">Supply</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Millions of parts</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Live view across</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">thousands of suppliers</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">The two firms said they built an operations-AI stack from NVIDIA open models plus…</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The first picture is NVIDIA’s own factory supply chain. Chip plus data map can be adopted…</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="736" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">An enterprise stack is the workplace brain on top of chips. A fluent model still cannot decide if it does not</text>
  <text x="540" y="760" font-family="Arial" font-size="17" fill="#60a5fa" text-anchor="middle">know your due dates. Ontology is that translator.</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="880" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why it matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Countries that want factory data at home will buy a vetted chip and a cleared software layer as a set. Over 3–5</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">years, as AI becomes a factory and government tool, NVIDIA can sell more accelerators and Palantir more</text>
  <text x="540" y="952" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">subscriptions.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">NVDA · Palantir · 2026.09.11</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>