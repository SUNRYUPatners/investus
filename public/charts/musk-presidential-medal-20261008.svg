  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">국가 최고 과학기술 훈장은 STEM 분야 업적을 표창하는 미국 최고 훈장이다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">머스크는 같은 날 테라팹 ZERO doubt, V2 FCC 승인, $4,000억 파이낸싱이 겹쳤다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">스페이스X는 NASA·국방부·상무부 등 정부 계약 잔고가 두껍다.</text>
