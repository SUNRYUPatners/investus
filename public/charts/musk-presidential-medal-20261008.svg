  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">정부 신뢰도 상승은 스페이스X 정부 조달 협상력 향상으로 이어진다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">테슬라의 자율주행·에너지 규제 환경도 정치적 지지를 등에 업는다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">에너지·우주·AI가 한 인물 포트폴리오 안에 있는 것이 시너지 논거다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">정치 이벤트와 기업 실적은 다른 칸 — 조달 계약 날짜가 더 중요하다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#2563eb">시상 날짜와 계약 수주가 겹치면 정치·사업 시너지가 현실화된다.</text>
