  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🤖</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle">15k</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Optimus is Tesla’s humanoid robot. Parts for ~15k units by year-end and a ~1k/wk → ~2.5k/wk ramp</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">were cited together.</text>
