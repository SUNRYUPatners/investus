  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">Stage splits</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">📦 Parts readiness ≠ finished deliveries</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">🔎 Run-rate needs supply-chain audits</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">📋 Weight press below filings</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Robot revenue is still early. Next: factory audits, weekly output, scrap rates. Longer term, Optimus sits at the</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">center of labor-substitution and factory automation moats.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Optimus · 2026.09.09</text>
