  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">배경 및 맥락</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">미국 30년 고정 모기지 금리는 2023년 이후 7%대에서 등락 중이다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">7.63%는 2024년 1월 7% 초반 대비 0.5%포인트 이상 오른 자리다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">10년 국채 금리와 모기지 금리는 장기 스프레드를 유지하는 관계다.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">연준 금리 인하 기대가 약해질수록 모기지 부담이 길어진다.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 7.63%와 2023년 고점을 추세 확정으로 읽지 않는다 — 의사록 다음날을 본다</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#1a0a10" stroke="#fb7185" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb7185">핵심 포인트</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">고금리 장기화는 신규 주택 구매를 억제해 건설·리츠 섹터를 압박한다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">주택 소유자의 재융자 수요는 금리 하락 첫 신호에 가장 빨리 반응한다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">모기지 금리 상승은 소비 여력 감소로 이어져 내수 경기에 부담이다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">테슬라 금융 서비스(오토론) 경쟁력도 금리 환경에 영향을 받는다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#e11d48">연준 의사록 다음날 금리가 이 수준을 유지하면 추세 신호가 강해진다.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · MACRO · Mortgage Rate</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">의사록 다음날 금리 움직임이 추세의 첫 시험이다</text>
