  <text x="195" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#fb7185" text-anchor="middle">7.63%</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">30년 고정</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">MND 기준</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#1a0a10" stroke="#e11d48" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">고점 기준</text>
