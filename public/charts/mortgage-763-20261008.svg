  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#f9fafb" text-anchor="middle">30년 고정 모기지 금리</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#fb7185" text-anchor="middle">2023년 11월 이후 최고</text>
