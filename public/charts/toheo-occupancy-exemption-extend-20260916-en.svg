  <text x="870" y="586" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Aimed at tenant stability</text>
  <rect x="60" y="640" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="686" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">A ruling-party official said sellers shouldn't be trapped once the tax reform bill's fate becomes</text>
  <text x="540" y="712" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">clear.</text>
  <rect x="60" y="844" width="960" height="148" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="874" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Buyers of tenant-occupied homes can't move in until the lease ends, so without an exemption, deals become nearly</text>
  <text x="540" y="928" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">impossible. If this proposal becomes law, it could directly affect early-2027 housing transactions. Next: watch</text>
  <text x="540" y="950" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">whether the government adopts it and how quickly the Assembly acts.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Occupancy Grace · Policy · 2026.09.16</text>
