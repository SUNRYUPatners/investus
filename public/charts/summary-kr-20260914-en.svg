  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.14 Korea Market Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="115" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="115" rx="4" fill="#38bdf8"/>
  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8">KOSPI closed at 6,909.91 (−1.76%), losing the 7,000 level</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">AI-driven gains above 7,000 reversed on oil and yield pressure.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">6,910</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#06171c" stroke="#22d3ee" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#22d3ee"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee">This week's Sep 15-16 FOMC result lands early Sep 17 KST</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">Hike-odds estimates range widely, from 57% to 87% across brokers.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">FOMC</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Samsung's HBM share jumped to 33% from 21%, narrowing the gap</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Leader SK Hynix held 50%, down from 58% the prior quarter.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">33%</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#f59e0b"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b">SK Hynix kept the No.1 HBM spot with a 50% share</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Down from 64% a year ago, but still the dominant leader.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="end">50%</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#a78bfa"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">OpenAI's 'GPT-6 Astra' launch lifted Korean chip sentiment</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">It helped KOSPI clear 7,000 on Sep 9 for the first time in weeks.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">Astra</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">LG Energy Solution wins more ESS orders on Tesla's Megapack</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">It signed a roughly ₩6T deal and is expanding North American ESS capacity.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">LGES</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">Hyundai outlined a 2029 in-house autonomous-vehicle plan</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">A 2028 NVIDIA-based launch comes first under its two-track strategy.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">2029</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: KOSPI 6,910 · FOMC Sep 17 · Samsung HBM 33% · Hynix 50% · LGES ESS · Hyundai 2029</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
