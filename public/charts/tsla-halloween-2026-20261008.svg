  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">하드웨어 교체 없이 차량 경험이 매년 달라지는 패턴의 반복이다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">사이버캡도 유령·소 패턴의 할로윈 랩으로 동시에 공개됐다.</text>
