  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">할로윈 모드는 고객 충성도와 SNS 홍보를 동시에 만드는 장치다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">차량 소프트웨어 플랫폼이 하드웨어 마진보다 중장기 밸류를 바꾼다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">FSD 화면 활용은 매월 구독 갱신 이유를 만드는 경험 설계다.</text>
