<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#06121f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#3b82f6"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#60a5fa30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">NVDA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.28</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Nvidia jumps 8.74% after earnings, up to $505B added in a</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">day</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#60a5fa" text-anchor="middle" opacity=".15">📊</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#60a5fa" text-anchor="middle">📊</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">+8.74%</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Nvidia rose 8.74% in the regular session after earnings, adding up to $505B of market cap in</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">one day, about 77% of the entire US market gain.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">💰</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">$89.02B</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Data center</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">+116.6% YoY</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">📈</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">$108B</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Q3 guide</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">~$1B revenue/day</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">🔁</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">$20B</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Buyback</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">More planned</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="680" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">"Nvidia rose 8.74% in the regular session, adding $360-505B of market cap in one day. FQ2 data</text>
  <text x="540" y="706" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">center revenue was $89.02B, up 116.6% year over year and $13.78B sequentially. Q3 guidance is</text>
  <text x="540" y="732" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">near $108B."</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#60a5fa" text-anchor="middle">Why this matters</text>
  <text x="540" y="908" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Management framed roughly 70% as the growth floor while the street expected about 40%. The constraint is supply,</text>
  <text x="540" y="930" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">not demand, and Amazon pledged two million more GPUs.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">NVDA · post-earnings surge · 2026.08.28</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">INVESTUS · SRP CHIEF INVESTMENT OFFICER · NOT FINANCIAL ADVICE</text>
</svg>