<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.22</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">FSD v14.3.10 is rolling in a third batch with Automatic</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Collision Evasion</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="72" text-anchor="middle">🚦</text>
  <text x="540" y="292" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">Evasion</text>
  <text x="540" y="332" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Automatic Collision Evasion turns Supervised FSD on when braking alone may not avoid a crash. It ships</text>
  <text x="540" y="356" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">with software 2026.27.10.</text>
  <line x1="80" y1="376" x2="1000" y2="376" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="438" font-family="Arial" font-size="40" text-anchor="middle">🚘</text>
  <text x="210" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Frontal</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">A frontal crash is imminent and</text>
  <text x="210" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">braking may not be enough</text>
  <text x="210" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The first listed scene</text>
  <rect x="390" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="438" font-family="Arial" font-size="40" text-anchor="middle">👤</text>
  <text x="540" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Attention</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">The driver looks to the back</text>
  <text x="540" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">seat or FSD may have dropped</text>
  <text x="540" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The second listed scene</text>
  <rect x="720" y="386" width="300" height="210" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="438" font-family="Arial" font-size="40" text-anchor="middle">💻</text>
  <text x="870" y="492" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">HW3</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">v14.2 Lite brings v14 to older</text>
  <text x="870" y="544" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">chips</text>
  <text x="870" y="568" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Notes say HW4 intelligence was</text>
  <text x="870" y="586" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">distilled into HW3</text>
  <rect x="60" y="612" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Release notes said the 14.3.10 and 14.2 Lite text did not change — a bug-fix drop. It unifies Hardware 3</text>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">and 4 in one bundle.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="840" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="868" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A crash-avoid feature in cars makes robotaxi safety concrete. Notes are not road stats. Next, watch install counts</text>
  <text x="540" y="890" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">and intervention rates.</text>
  <text x="540" y="1004" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · collision evasion · 2026.09.22</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>