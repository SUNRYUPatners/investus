  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0e0820"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="18" width="120" height="42" rx="21" fill="#a78bfa22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="100" y="44" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a78bfa" text-anchor="middle">SPCX</text>
  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#f9fafb" text-anchor="middle">FCC Approves 15,000 More</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">Starlink V2 Satellites</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#2d1b3d" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Full V2 constellation bandwidth vs. V1</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="80" font-weight="900" fill="#a78bfa" text-anchor="middle">×100</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">One V2 satellite = 20x the throughput of one V1</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#2d1b3d" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#0e0820" stroke="#a78bfa" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Approved</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#a78bfa" text-anchor="middle">15,000</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">New FCC approval</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">V2 Mini additional ops</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#0e0820" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Peak speed target</text>
  <text x="540" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#7c3aed" text-anchor="middle">150 Mbps</text>
  <text x="540" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Per user</text>
  <text x="540" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">On T-Mobile spectrum</text>
  <rect x="730" y="420" width="310" height="195" rx="14" fill="#0e0820" stroke="#a78bfa" stroke-width="2"/>
  <text x="885" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Already in orbit</text>
  <text x="885" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#a78bfa" text-anchor="middle">650</text>
  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">V2 Mobile deployed</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Mobile-dedicated sats</text>
  <rect x="40" y="632" width="1000" height="268" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">Background</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">Starlink V2 Mini launches on reusable Falcon 9 rockets.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">Dramatically higher capacity than V1, targeting 5G cellular coverage.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">T-Mobile partnership enables direct-to-phone satellite cellular calls.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">Goal upgrades from dead-zone coverage to full 5G network buildout.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 15,000 approved vs. 650 in orbit are separate metrics — track launch schedule</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#120b28" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#a78bfa">Key Points</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">Full V2 deployment directly impacts Starlink profitability and valuation.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">150 Mbps target makes the 100x bandwidth figure tangible for subscribers.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">T-Mobile partnership extends coverage without ground base stations.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">Both ARPU expansion and subscriber growth are structurally enabled.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#7c3aed">Watch the first V2 batch launch date — that converts thesis to timeline.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · SPCX · Starlink V2</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">100x bandwidth ratio and 150 Mbps user target are not the same metric</text>
  <rect x="0" y="1280" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1318" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>
