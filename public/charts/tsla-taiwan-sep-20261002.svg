  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">수입차 1위는 국내 브랜드를 뺀 표입니다. 전체 승용 1위와 숫자를 섞지 않습니다. 대만은 오른쪽 핸들이 아니고 왼쪽 핸들 시장이라</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">중국·미국 공장 물량이 바로 들어갑니다. 다음 확인할 것은 10월에도 이 순위가 유지되는지입니다. 시승 창이 열려 있는 것은 재고와</text>
