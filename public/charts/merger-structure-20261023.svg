    <text x="119" y="44" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="17" font-weight="900" fill="#D8B4FE">MERGE</text>
  <rect x="196" y="18" width="160" height="40" rx="20" fill="#1C1917"/>
    <rect x="196" y="18" width="160" height="40" rx="20" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="276" y="44" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="17" font-weight="900" fill="#FDE68A">Reuters</text>
  <rect x="368" y="18" width="120" height="40" rx="20" fill="#7F1D1D"/>
    <rect x="368" y="18" width="120" height="40" rx="20" fill="none" stroke="#EF4444" stroke-width="2"/>
    <text x="428" y="44" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="17" font-weight="900" fill="#FCA5A5">단독</text>
  <rect x="54" y="70" width="972" height="2" fill="url(#accentG)" opacity="0.5"/>

  <text x="540" y="158" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="90" font-weight="900" fill="url(#heroG)" filter="url(#glow)">합병 3가지</text>
  <text x="540" y="222" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="34" font-weight="900" fill="#F1F5F9">Reuters 단독 — 협상 중인 딜 구조 공개</text>
  <text x="540" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#9CA3AF">합의된 조건 아닌 검토 중인 가능성 · Apollo·Goldman Sachs 8.3% 파이낸싱</text>
  <rect x="200" y="294" width="680" height="2" fill="url(#accentG)" opacity="0.4"/>

  <text x="54" y="375" font-family="Arial,sans-serif" font-size="22" fill="#9CA3AF">검토 중인 구조 3가지 (Reuters 2026-10-22)</text>
  <rect x="54" y="390" width="972" height="168" rx="16" fill="#0F1623" stroke="#A855F7" stroke-width="2.5"/><text x="108" y="440" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#A855F7">①</text><text x="170" y="440" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">SPCX가 TSLA 인수</text><text x="108" y="482" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">테슬라 주주가 SpaceX 주식을 대가로 수령 — TSLA 보유자가</text><text x="108" y="514" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">새 SpaceX 주주가 됨</text><rect x="54" y="580" width="972" height="168" rx="16" fill="#0F1623" stroke="#EC4899" stroke-width="2.5"/><text x="108" y="630" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#EC4899">②</text><text x="170" y="630" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">신규 지주회사 설립</text><text x="108" y="672" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">양사 모두 새 지주회사의 자회사로 편입 — 별도 법인</text><text x="108" y="704" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">유지하면서 통합 가능</text><rect x="54" y="770" width="972" height="168" rx="16" fill="#0F1623" stroke="#3B82F6" stroke-width="2.5"/><text x="108" y="820" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#3B82F6">③</text><text x="170" y="820" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">전주식 교환 (All-stock swap)</text><text x="108" y="862" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">현금 없이 주식으로만 거래 완결 — 양사 주주가 합병법인</text><text x="108" y="894" font-family="Arial,sans-serif" font-size="23" fill="#D1D5DB">주식을 나눠 보유</text>

  <rect x="54" y="966" width="972" height="90" rx="14" fill="#0F1623" stroke="#EC4899" stroke-width="2"/>
  <text x="540" y="1000" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#9CA3AF">합병 시 합산 시가총액</text>
  <text x="540" y="1046" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="40" font-weight="900" fill="#EC4899">$3.63조 달러 — 글로벌 5위</text>

  <rect x="54" y="1078" width="972" height="220" rx="22" fill="#0F0A00" stroke="#4C1D95" stroke-width="2.5"/>
    <rect x="54" y="1078" width="972" height="5" rx="3" fill="url(#accentG)"/>
    <text x="108" y="1122" font-family="Arial Black,Arial,sans-serif" font-size="26" font-weight="900" fill="#FDE68A">이게 왜 중요한가</text>
    <rect x="108" y="1130" width="864" height="1" fill="#4C1D95"/>
    <text x="108" y="1150" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">Reuters가 구체적 딜 구조 3가지를 이름 붙여 보도했다.</text><text x="108" y="1184" font-family="Arial,sans-serif" font-size="24" fill="#E5E7EB">어드바이저(Apollo·Goldman) 선임은 딜이 법적 단계로 진입했다는 신호.</text><text x="108" y="1218" font-family="Arial,sans-serif" font-size="24" fill="#FDE68A">TSLA 보유자는 시나리오 ①에서 SPCX 주식을 직접 수령한다.</text>

  <rect x="0" y="1340" width="1080" height="10" fill="url(#accentG)"/>
    <text x="40" y="1333" font-family="Arial,sans-serif" font-size="18" fill="#6B7280">investus.kr · Not investment advice · INVESTUS SRP</text>
</svg>