      <stop offset="0%" stop-color="#EC4899"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="heroG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#EC4899"/><stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
