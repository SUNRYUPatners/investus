<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#140b1f"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#c084fc"/><stop offset="100%" style="stop-color:#a78bfa"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#c084fc30" stroke="#c084fc" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#c084fc" text-anchor="middle">SPCX</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.14</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">48 airlines have chosen Starlink, with more than 7,000</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">aircraft equipped or under contract</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">✈️</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#c084fc" text-anchor="middle">48 airlines</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">That's how many carriers have adopted or contracted for SpaceX's Starlink internet. Aircraft equipped</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">or committed now top 7,000.</text>
  <line x1="80" y1="388" x2="1000" y2="388" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="400" width="300" height="200" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="210" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Airlines</text>
  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#c084fc" text-anchor="middle">48</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Major global carriers</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">American, United, and more</text>
  <rect x="390" y="400" width="300" height="200" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="540" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Aircraft</text>
  <text x="540" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#c084fc" text-anchor="middle">7,000+</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Equipped or contracted</text>
  <text x="540" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">Across all carriers</text>
  <rect x="720" y="400" width="300" height="200" rx="16" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <text x="870" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Why</text>
  <text x="870" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#c084fc" text-anchor="middle">Wi-Fi</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Speed and latency</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">Reflected in satisfaction surveys</text>
  <rect x="60" y="616" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">Why airlines keep choosing Starlink</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">Starlink uses low-orbit satellites closer to Earth for higher speed.</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">Lower latency than legacy satellite internet enables video calls.</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">Passengers are starting to pick airlines based on Wi-Fi quality.</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#c084fc" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">In-flight Wi-Fi used to mean slow and expensive. Starlink can match ground-level speeds in the sky. Next: watch how</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">many more airlines sign on next quarter.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SpaceX · Starlink airlines · 2026.09.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>