  <text x="540" y="656" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">CID는 운전자가 차량 정보·내비·앱을 보는 중앙 화면입니다. 소프트웨어 경험이 프리미엄 차량의 차별점이</text>
