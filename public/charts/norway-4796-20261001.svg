  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#4ade80" text-anchor="middle">4,796대</text>
  <text x="540" y="324" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">그다음 아홉 차종 합은 3,455대입니다.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">1️⃣</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">4,796</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">모델Y</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">9월</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">2️⃣</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">518</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">GLC EQ</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">메르세데스</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">3️⃣</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">512</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">ID.버즈</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">폭스바겐</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">4️⃣</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">453</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">EX30</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">볼보</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">아토3 377 · iX3 328 · bZ4X 322</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">EV5 320 · 어반 크루저 317 · ID.4 308</text>
  <rect x="60" y="690" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="726" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">노르웨이 9월 테슬라 모델Y는 4,796대입니다. 그다음 아홉 차종을 합치면 3,455대입니다. 뒤를 이은 차종은 메르세데스</text>
  <text x="540" y="750" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">GLC EQ 518대, 폭스바겐 ID.버즈 512대, 볼보 EX30 453대입니다. 비야디 아토3는 377대, BMW iX3는 328대, 토요타</text>
  <text x="540" y="774" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">bZ4X는 322대입니다. 기아 EV5는 320대, 토요타 어반 크루저는 317대, 폭스바겐 ID.4 프로는 308대입니다. 아홉 차의</text>
  <text x="540" y="798" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">합이 모델Y 한 차종보다 적습니다.</text>
  <rect x="60" y="850" width="960" height="168" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">이 대수는 9월 한 달입니다. 올해 들어 노르웨이 신차의 전기차 비중을 적은 어제 문장과 기간이 갈립니다. 북유럽 한 달 판매는 세계</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">인도 실적이 아닙니다. 다음 달 같은 표가 나와야 순위가 이어지는지 봅니다. 겨울철 인도 대수와 이 9월 표를 이어서 보면, 한 달</text>
  <text x="540" y="944" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">1위가 분기로 이어지는지 알 수 있습니다. 충전 인프라가 이미 깔린 시장이라는 점도 순위 뒤의 배경입니다. 수입 차와 현지 생산</text>
  <text x="540" y="964" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">차의 인도 시차가 순위를 바꿀 수 있어, 한 달 표를 연간 점유로 바꾸지 않습니다. 등록 대수와 실제 인도 대수의 차이도 다음</text>
  <text x="540" y="984" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">통계에서 봅니다.</text>
  <text x="540" y="1034" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">2026.10.01</text>
