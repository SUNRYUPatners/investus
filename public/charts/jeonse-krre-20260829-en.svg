<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0d02"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#fb923c"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="113" height="38" rx="19" fill="#fb923c30" stroke="#fb923c" stroke-width="1.5"/>
  <text x="96.5" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#fb923c" text-anchor="middle">JEONSE</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.29</text>
  <text x="540" y="106" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul jeonse prices rose 0.22% as rents climbed fastest</text>
  <text x="540" y="140" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">where sale prices are strongest</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">🔑</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">Seoul jeonse +0.22%</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">That is up from 0.19% a week earlier, and Gyeonggi accelerated from 0.17% to 0.19%.</text>
  <line x1="80" y1="384" x2="1000" y2="384" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="396" width="300" height="196" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="210" y="448" font-family="Arial" font-size="40" text-anchor="middle">🏙️</text>
  <text x="210" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb923c" text-anchor="middle">0.29%</text>
  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Seoul sale prices</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Moving the same direction</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="448" font-family="Arial" font-size="40" text-anchor="middle">🗺️</text>
  <text x="540" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb923c" text-anchor="middle">0.19%</text>
  <text x="540" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Gyeonggi jeonse</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Up from 0.17% a week earlier</text>
  <rect x="720" y="396" width="300" height="196" rx="16" fill="#20130a" stroke="#fb923c" stroke-width="2"/>
  <text x="870" y="448" font-family="Arial" font-size="40" text-anchor="middle">📉</text>
  <text x="870" y="502" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb923c" text-anchor="middle">Supply</text>
  <text x="870" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Fewer jeonse listings</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Landlords now prefer monthly rent</text>
  <rect x="60" y="610" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="656" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">Jeonse prices track people who actually intend to live in a home. A market where only sale prices</text>
  <text x="540" y="682" font-family="Arial" font-size="19" fill="#fb923c" text-anchor="middle">rise differs from one where jeonse rises too, so the two series belong side by side.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#20130a" stroke="#fb923c" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#fb923c" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Part of this acceleration comes from supply, not demand. After a wave of deposit fraud, tenants avoid jeonse and</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">landlords prefer monthly rent, so listings thinned out. The test comes after December, when policy conversions</text>
  <text x="540" y="920" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">actually reach the market.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Jeonse · weekly gain widens · 2026.08.29</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>