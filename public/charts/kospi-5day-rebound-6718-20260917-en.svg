<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061520"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0ea5e9"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#38bdf830" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">KOSPI</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">KOSPI rebounded after five sessions to 6,717.97 as bargain</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">hunters returned to chip giants</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="332.5" y="160" width="415" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">First bounce in 5 sessions · +1.37%</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#0a1a26" stroke="#38bdf8" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#38bdf8" text-anchor="middle">6,717.97</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Sept 16 close, up 90.71 points (1.37%). Foreigners sold ₩1.68T but institutions bought…</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1a26" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">🏦</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">+₩1.21T</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Institutional buying</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The only net buyer on</text>
  <text x="176" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">KOSPI</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#0a1a26" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">🌍</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">-₩1.68T</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Foreign selling</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">A 6th straight day of</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">sales</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1a26" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">👤</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">-₩1.19T</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Retail selling</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Profit-taking after the</text>
  <text x="640" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">drop</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1a26" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">💱</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#38bdf8" text-anchor="middle">₩1,368.6</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">USD/KRW</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Up 9.2 won on the day</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Advancers 304 vs decliners 578 — the index rose but most stocks did not.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">KOSDAQ also rose 3.57 points to 815.98, so both boards bounced together.</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">Daishin Securities said the Sept 14 plunge eased near-term valuation pressure on chip giants, inviting</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">bargain buying.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#0a1a26" stroke="#38bdf8" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#38bdf8" text-anchor="middle">Why it matters</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">KOSPI's bounce after four down days was driven by a handful of semiconductor heavyweights. Foreign selling into a</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">sixth day and the won at 1,368.6 still cap how far the rebound can run. Next: watch whether institutions keep buying</text>
  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">and how foreigners react after the Fed hike.</text>
  <text x="540" y="1026" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">KOSPI · 5-session rebound · 2026.09.17</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>