<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a1505"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#a3e635"/><stop offset="100%" style="stop-color:#65a30d"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="18" width="120" height="42" rx="21" fill="#a3e63522" stroke="#a3e635" stroke-width="1.5"/>
  <text x="100" y="44" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#a3e635" text-anchor="middle">NVDA</text>
  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#f9fafb" text-anchor="middle">엔비디아 NVLink Fusion</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a3e635" text-anchor="middle">10년 $1,200억 파트너십 추정</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#1a2a08" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">인텔·AMD 채택 시 엔비디아 수취 추정액</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="72" font-weight="900" fill="#a3e635" text-anchor="middle">$1,200억</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">인텔 $880억 + AMD $550억 채택 기준 — 연결 수수료 모형</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1a2a08" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#a3e635" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">총 추정액</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#a3e635" text-anchor="middle">$1,200억</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">NVDA 수취분</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">2030년대까지</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#65a30d" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">인텔 채택 규모</text>
  <text x="540" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#65a30d" text-anchor="middle">$880억</text>
  <text x="540" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">인텔 추정</text>
  <text x="540" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">NVLink Fusion 채택</text>
  <rect x="730" y="420" width="310" height="195" rx="14" fill="#0a1505" stroke="#a3e635" stroke-width="2"/>
  <text x="885" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">AMD 채택 규모</text>
  <text x="885" y="516" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#a3e635" text-anchor="middle">$550억</text>
  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">AMD 추정</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">NVLink Fusion 채택</text>
  <rect x="40" y="632" width="1000" height="268" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">배경 및 맥락</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">NVLink Fusion은 타사 칩도 NVLink 토폴로지에 연결하는 개방형 규격이다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">인텔·AMD가 채택하면 엔비디아 네트워크 효과가 x86 진영까지 확장된다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">GPU 판매 이후 반복 수익을 만드는 연결 수수료 모형이 핵심이다.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">씨티증권은 NVDA 매수·목표 주가 315달러를 유지 중이다.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* 인텔 880억 + AMD 550억 = 1,430억이 아님 — 1,200억은 NVDA 수취분</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#0a1505" stroke="#a3e635" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#a3e635">핵심 포인트</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">AI 인프라 표준이 되면 NVDA는 반도체 산업 전체의 연결 수수료를 받는다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">GPU 판매 없이도 인프라 레이어에서 반복 수익이 발생하는 구조다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">인텔·AMD 채택은 경쟁사가 엔비디아 생태계에 편입되는 역설이다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">채택 일정이 발표되면 추정 1,200억이 실제 계약으로 내려온다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#65a30d">첫 계약 발표가 인프라 표준 지위를 확인하는 시험대가 된다.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · NVDA · NVLink Fusion</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">채택 일정이 나와야 추정이 실제 계약으로 내려온다</text>
  <rect x="0" y="1280" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1318" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
