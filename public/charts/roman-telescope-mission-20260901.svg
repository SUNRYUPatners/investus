  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#c084fc" text-anchor="middle">$4.3B</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">과학 임무 관점에서 로마 망원경은 허블급 시야와 적외선 감도로 우주 대규모 구조를 그려 냅니다. 발사 성공</text>
