  <text x="540" y="690" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">로마(Roman) 망원경은 43억 달러 규모 NASA 과학 임무로, 넓은 하늘을 한 번에 찍어</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">암흑물질·암흑에너지·외계행성 후보를 통계적으로 찾습니다. 팔콘 헤비는 승무원 없이 무거운 과학 위성을</text>
  <text x="540" y="742" font-family="Arial" font-size="19" fill="#c084fc" text-anchor="middle">지구 2차 궤도(L2) 근처로 보내는 수단입니다. 임무 성공은 발사 회사의 대형 화물 신뢰성에도 기여합니다.</text>
