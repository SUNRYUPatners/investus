  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#38bdf8" text-anchor="middle">EUV</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">극자외선 원판입니다</text>
