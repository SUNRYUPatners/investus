  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">EUV 포토마스크는 회로 무늬를 웨이퍼에 옮기는 원판입니다. 12인치(300mm) 규격 협력이 첨단 파운드리 병목을</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">다루는 뉴스로 읽힙니다.</text>
