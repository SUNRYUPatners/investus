  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">첨단 노드는 마스크·레지스트·장비가 한 세트입니다. 양산 적용 시점과 고객 수율이 나오면 헤드라인을 실행 표로 옮기시면 됩니다.</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">장기적으로 EUV 생태계는 파운드리 경쟁력의 뼈대입니다. 단발 협력 뉴스만으로 비중을 한 번에 키우지 마시기 바랍니다.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">반도체 · EUV 마스크 · 2026.09.09</text>
