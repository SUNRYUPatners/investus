  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">핵심만 정리</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">🪞 마스크 품질·납기가 수율(양품 비율)에 바로 닿습니다</text>
