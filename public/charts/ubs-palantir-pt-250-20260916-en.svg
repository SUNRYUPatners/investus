  <text x="540" y="222" font-family="Arial" font-size="62" text-anchor="middle">🎯</text>
  <text x="540" y="272" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#a78bfa" text-anchor="middle">PT Raised</text>
  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">UBS adjusted its price target for data analytics firm Palantir (PLTR), keeping its Buy rating</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">unchanged.</text>
  <rect x="60" y="356" width="420" height="168" rx="16" fill="#0a0a14" stroke="#374151" stroke-width="1.5"/>
