  <text x="810" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#a78bfa" text-anchor="middle">$250</text>
  <text x="810" y="496" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">About 14% higher</text>
  <rect x="60" y="548" width="300" height="164" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="1.5"/>
