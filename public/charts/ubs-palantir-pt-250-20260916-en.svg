  <text x="270" y="460" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#9ca3af" text-anchor="middle">$220</text>
  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">UBS’s earlier estimate</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#a78bfa" text-anchor="middle">&#8594;</text>
