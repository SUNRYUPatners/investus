  <rect x="60" y="372" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">Tesla AI5 trial production started at Samsung’s Taylor, Texas fab</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Advanced 2nm wafers are in mass-production checks, with chips aimed at 2027.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">2nm</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX shares sat near a one-month high after a $51B cap jump</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Talks also surfaced about buying failed-startup data for AI training.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">$154.81</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#a78bfa"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">Nebius said GPU rental prices rise about 20% from October 1</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">AI compute demand is showing up in the rental price, not just chip sales.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">+20%</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Cybercab fares of 30-40 cents a mile were cited</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">An Austin cabin had no wheel or pedals, with cabin lights moving to the music.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">30-40¢</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">Foreigners bought more US stocks than Treasuries a 3rd time</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">Overseas money preferred American company shares over the usual safe bond bid.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">Stocks&gt;bonds</text>
