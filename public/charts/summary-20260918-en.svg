  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Tesla Megapack deployments passed 77 GWh worldwide</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">Uptime is 99.3%, with Lathrop and Texas factories targeting ~90 GWh a year.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">77+ GWh</text>
