  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Starship Flight 14 slipped from Sept 22 to Monday Sept 28</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">First orbital attempt, carrying 26 Starlink V3 satellites on a revenue flight.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">Sep 28</text>
