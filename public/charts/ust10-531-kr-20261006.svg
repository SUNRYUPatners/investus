  <text x="540" y="816" font-family="Arial" font-size="18" fill="#ef4444" text-anchor="middle">고용지수는 50.1로 소폭 확장입니다. 9월 고용은 2만 9,000명으로 약했습니다. 그래도 물가 칸이 금리를 위로</text>
