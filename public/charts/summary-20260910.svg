  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스페이스X 락업 약 3.19억 주가 달력 90일 구간에 들어왔습니다</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">약 7% 물량이고 다음은 180일 블록입니다. 머스크 합산 시총 약 3.48조 달러와 칸을 나누시기 바랍니다.</text>
