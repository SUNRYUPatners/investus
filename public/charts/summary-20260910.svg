  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">인공지능·로봇이 경제를 10년 안에 두 배로 키울 수 있다는 발언이…</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">이전 20~30% 언급보다 한 단계 센 톤입니다. 일정·수율과 칸을 나누시기 바랍니다.</text>
