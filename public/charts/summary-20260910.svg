  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">NVL72 랙 매출이 2027년 7,100억 달러 이상으로 전망됐습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">전년 대비 약 +214%이고, 랙 대수는 약 +50%입니다. 의견과 실적을 나누시기 바랍니다.</text>
