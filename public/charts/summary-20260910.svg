  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">재무부가 장기 바이백을 60억 달러로 세 배 키웠습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">10년물 약 4.83%는 2023년 이후 최고권입니다. 규모와 금리 반응을 한 줄에 합치지 마시기 바랍니다.</text>
