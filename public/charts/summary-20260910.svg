  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4285f4">구글 핀란드 인공지능 인프라가 150억 달러 이상으로 거론됐습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">풍력·94MW 배터리·22년 원전 계약이 붙었습니다. 텍사스 세미 25대와 칸을 나누시기 바랍니다.</text>
