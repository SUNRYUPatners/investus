  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">텍사스 자율차 집계가 437대(오늘 +5)로 찍혔습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">모델Y 388대(88.8%)·사이버캡 49대(11.2%)입니다. 오스틴 1,000대 준비와 칸을 나누시기 바랍니다.</text>
