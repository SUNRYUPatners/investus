  <text x="985" y="907" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">₩810M</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: renewals 51.1% · listings 23,697 · deferral end-2027 · Jungnang 61.5% · gap ₩810M</text>
