  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">Seoul apartment jeonse renewals reached 51.1%</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">41,145 of 80,480 deals from January through Sept 20.</text>
  <text x="985" y="207" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">51.1%</text>
  <rect x="60" y="297" width="960" height="165" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="297" width="8" height="165" rx="4" fill="#a78bfa"/>
  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">Seoul jeonse listings fell 13.3% from a year earlier</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">The count is as of Sept 19.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">23,697</text>
  <rect x="60" y="472" width="960" height="165" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="472" width="8" height="165" rx="4" fill="#c084fc"/>
  <text x="116" y="531" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#c084fc">Occupancy-deferral filings run through end-2027</text>
  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">Starts Oct 1; one renewal can push move-in to end-2029.</text>
  <text x="985" y="557" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">End-2027</text>
  <rect x="60" y="647" width="960" height="165" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="647" width="8" height="165" rx="4" fill="#fb7185"/>
  <text x="116" y="706" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb7185">Jungnang posted the highest renewal share in Seoul</text>
  <text x="116" y="742" font-family="Arial" font-size="17" fill="#9ca3af">Gangseo 57.8%, Seongbuk 57.3%, Gangdong 55.8%.</text>
  <text x="985" y="732" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">61.5%</text>
  <rect x="60" y="822" width="960" height="165" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
