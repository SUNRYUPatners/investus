  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.17 Safe Assets Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="165" rx="14" fill="#1a0f00" stroke="#f7931a" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="165" rx="4" fill="#f7931a"/>
  <text x="116" y="181" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f7931a">Bitcoin dipped to $75,355 after the Fed hike, then…</text>
  <text x="116" y="217" font-family="Arial" font-size="17" fill="#9ca3af">It found a low within an hour and bounced near $75,813.</text>
  <text x="985" y="207" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f7931a" text-anchor="end">$75,813</text>
  <rect x="60" y="297" width="960" height="165" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="297" width="8" height="165" rx="4" fill="#facc15"/>
  <text x="116" y="356" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#facc15">Spot gold rebounded 0.7% to $4,324 an ounce</text>
  <text x="116" y="392" font-family="Arial" font-size="17" fill="#9ca3af">A softer dollar and a pullback in oil helped reverse the prior drop.</text>
  <text x="985" y="382" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">$4,324</text>
  <rect x="60" y="472" width="960" height="165" rx="14" fill="#15162a" stroke="#818cf8" stroke-width="2"/>
  <rect x="60" y="472" width="8" height="165" rx="4" fill="#818cf8"/>
  <text x="116" y="531" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#818cf8">Ether stayed weak around $2,400, down about 4%</text>
  <text x="116" y="567" font-family="Arial" font-size="17" fill="#9ca3af">The Clarity Act failure and the rate hike both weighed.</text>
  <text x="985" y="557" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#818cf8" text-anchor="end">$2,401</text>
  <rect x="60" y="647" width="960" height="165" rx="14" fill="#1a0d02" stroke="#f97316" stroke-width="2"/>
  <rect x="60" y="647" width="8" height="165" rx="4" fill="#f97316"/>
  <text x="116" y="706" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#f97316">WTI crude fell 3.2% to settle at $102.43 a barrel</text>
  <text x="116" y="742" font-family="Arial" font-size="17" fill="#9ca3af">After jumping above $100, mixed inventory data prompted a pause.</text>
  <text x="985" y="732" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#f97316" text-anchor="end">$102.43</text>
  <rect x="60" y="822" width="960" height="165" rx="14" fill="#0c1017" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="822" width="8" height="165" rx="4" fill="#94a3b8"/>
  <text x="116" y="881" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#94a3b8">Spot silver rose 1.2% intraday to $64.4 an ounce</text>
  <text x="116" y="917" font-family="Arial" font-size="17" fill="#9ca3af">It tracked gold but with a wider daily swing.</text>
  <text x="985" y="907" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">$64.4</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: BTC $75,813 · gold $4,324 · ETH $2,401 · WTI $102.43 · silver $64.4</text>
