  <rect x="40" y="20" width="110" height="38" rx="19" fill="#f9731630" stroke="#f97316" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f97316" text-anchor="middle">OIL</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.18</text>
  <text x="540" y="104" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">WTI crude eased 1-3% around $101 a barrel, extending the</text>
  <text x="540" y="138" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">pause after $100</text>
  <line x1="80" y1="146" x2="1000" y2="146" stroke="#1f2937" stroke-width="1"/>
  <rect x="380" y="160" width="320" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">Post-$100 pause</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#20130a" stroke="#f97316" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#f97316" text-anchor="middle">$101</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">WTI hovered near $101, cooling after clearing $100 as inventory reads still conflict.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">🛢️</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f97316" text-anchor="middle">~$101</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">WTI area</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Down from the prior</text>
  <text x="176" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">$102 handle</text>
  <rect x="312" y="372" width="192" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="1.5"/>
  <text x="408" y="418" font-family="Arial" font-size="34" text-anchor="middle">📉</text>
  <text x="408" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f97316" text-anchor="middle">-1 to -3%</text>
  <text x="408" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Day change</text>
  <text x="408" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">The size of the</text>
  <text x="408" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">post-spike pause</text>
  <rect x="544" y="372" width="192" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">📦</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f97316" text-anchor="middle">Stocks</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Mixed reads</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Build vs draw tallies</text>
  <text x="640" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">disagree</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">🌐</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#f97316" text-anchor="middle">Inflation</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Fed input</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Oil above $100 stays in</text>
  <text x="872" y="531" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">the rates story</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">Oil above $100 can leak into gasoline and shipping, then consumer prices.</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">One down day does not prove the spike is over.</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#f97316" text-anchor="middle">Crude sits on the same safe-asset board as rates and gold. After oil above $100 was cited in the</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#f97316" text-anchor="middle">inflation case, the tape weighs inventories one session at a time.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#20130a" stroke="#f97316" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#f97316" text-anchor="middle">Why it matters</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Several closes below $100 would ease extra-hike pressure. Fresh supply shocks could mean $101 is not the floor.</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Next: weekly inventories and Middle East supply headlines.</text>
  <text x="540" y="1026" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Oil · WTI · 2026.09.18</text>
