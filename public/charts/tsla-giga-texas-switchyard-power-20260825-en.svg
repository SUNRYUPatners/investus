  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">A switchyard splits high-voltage power into the plant. Austin production and the Cortex AI</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">clusters sit on that power spine. Robotaxis and training computers both need electricity</text>
