  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#fb923c">Jeonse bounced modestly in select school/transit…</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">Regions stay weak and move-in supply matters.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c" text-anchor="end">JEONSE</text>
