  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">Read district-level temperature, not one average.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80" text-anchor="end">SEOUL</text>
