  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">Metro price indices are flat to down ~0.1%.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8" text-anchor="end">SALES</text>
