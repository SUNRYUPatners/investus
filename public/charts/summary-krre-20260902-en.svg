  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">LTV and DSR caps hit demand immediately.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa" text-anchor="end">POLICY</text>
