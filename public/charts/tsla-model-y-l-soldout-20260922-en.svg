  <text x="540" y="308" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Model Y L is the long-wheelbase six-seater, not the Long Range range trim. Launch Series is the</text>
  <text x="540" y="333" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">first-run limited spec of that car.</text>
