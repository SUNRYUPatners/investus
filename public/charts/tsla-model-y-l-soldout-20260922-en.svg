  <text x="870" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Not the Long Range range trim</text>
  <rect x="60" y="722" width="960" height="142" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="768" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">Model Y L means long wheelbase, a six-seat stretch. Launch Series is the first-run pack on that car. It is</text>
  <text x="540" y="791" font-family="Arial" font-size="17" fill="#4ade80" text-anchor="middle">not Long Range.</text>
  <rect x="60" y="874" width="960" height="168" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="904" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">If the 2026 US Launch Series is spent, new orders wait until early 2027. One ZIP screen is not a national lock. Next,</text>
  <text x="540" y="954" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">watch other ZIP windows and weekly factory output.</text>
  <text x="540" y="1056" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · Model Y L · 2026.09.22</text>
