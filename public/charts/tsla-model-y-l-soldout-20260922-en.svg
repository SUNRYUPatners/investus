  <text x="540" y="662" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Long-wheelbase six-seat Y L</text>
  <text x="540" y="686" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">A different car from the five-seat</text>
  <text x="540" y="705" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Y</text>
