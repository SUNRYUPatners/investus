  <text x="270" y="496" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">This year’s US Launch Series allocation is…</text>
  <text x="540" y="455" font-family="Arial Black,Arial" font-size="40" fill="#4ade80" text-anchor="middle">&#8594;</text>
