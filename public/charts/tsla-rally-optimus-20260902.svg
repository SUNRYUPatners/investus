  <rect x="336.5" y="160" width="407" height="44" rx="22" fill="rgba(239,68,68,.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="540" y="188" font-family="Arial Black,Arial" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle">주가 +4.4~5.51% · 시총 +540억 달러</text>
  <rect x="80" y="220" width="920" height="132" rx="18" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="288" font-family="Arial Black,Arial" font-size="50" font-weight="900" fill="#4ade80" text-anchor="middle">+~5%</text>
  <text x="540" y="324" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">옵티머스(Optimus) 프리몬트 1년 100만 대 생산 목표와 모델S·X 라인 해체가 같은 날 거론됐습니다.</text>
  <rect x="80" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="176" y="418" font-family="Arial" font-size="34" text-anchor="middle">📈</text>
  <text x="176" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">+5%</text>
  <text x="176" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">일간 상승</text>
  <text x="176" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">로보택시·로봇 기대 반영</text>
