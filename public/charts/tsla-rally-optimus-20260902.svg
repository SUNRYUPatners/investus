  <rect x="544" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="640" y="418" font-family="Arial" font-size="34" text-anchor="middle">🏭</text>
  <text x="640" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">S/X</text>
  <text x="640" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">라인 해체</text>
  <text x="640" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">생산능력 재배치</text>
  <rect x="776" y="372" width="192" height="176" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="872" y="418" font-family="Arial" font-size="34" text-anchor="middle">💰</text>
  <text x="872" y="462" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">~$54B</text>
  <text x="872" y="492" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">시총 증가</text>
  <text x="872" y="514" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">하루 유동성·기대 반영</text>
  <rect x="80" y="566" width="920" height="112" rx="14" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="606" font-family="Arial" font-size="21" fill="#e5e7eb" text-anchor="middle">모델S·X 라인 해체는 공장 공간을 로봇·로보택시 쪽으로 옮기는 신호일 수 있습니다</text>
  <text x="540" y="644" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">주가 급등은 fleet·행사·로봇 목표가 같은 날 겹칠 때 자주 나옵니다</text>
  <rect x="60" y="694" width="960" height="134" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="740" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">옵티머스는 사람형 로봇으로, 1년 100만 대는 선언 수준의 목표이지만 공장 라인을 옮긴다는 메시지와 맞물립니다.</text>
  <text x="540" y="765" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">모델S·X 생산 라인 해체는 프리몬트 capacity를 재배치한다는 뜻으로 읽힙니다. 540억 달러 시총 증가는 실적보다</text>
  <text x="540" y="790" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">「실행 일정」에 대한 기대가 커진 날입니다.</text>
  <rect x="60" y="842" width="960" height="148" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="872" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">급등일에는 「무엇이 확인됐는가」와 「무엇이 기대만 올랐는가」를 나눠야 합니다. 옵티머스 100만 대는 로드맵이고, 로보택시</text>
  <text x="540" y="926" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">314대·9월 3일 행사는 달력에 있는 사실입니다. 행사 후 변동성 확대에 대비하려면 포지션 크기와 옵션 내재변동성을 함께 보시면</text>
  <text x="540" y="948" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">됩니다.</text>
  <text x="540" y="1026" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · 급등·옵티머스 · 2026.09.02</text>
