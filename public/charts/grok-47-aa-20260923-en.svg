  <text x="96" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#fb7185" text-anchor="middle">SPCX AI</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.23</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Grok 4.7 scored 46 on the intelligence index and entered the</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">top four labs</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">🧠</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#fb7185" text-anchor="middle">46</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The intelligence index folds many tests into one score. It is two points above Grok 4.6 and rose on the</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">coding-agent table.</text>
  <line x1="80" y1="388" x2="1000" y2="388" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="400" width="300" height="200" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="210" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Score</text>
  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">+2</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Two points above 4.6</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">The price card did not change</text>
  <rect x="390" y="400" width="300" height="200" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="540" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Coding</text>
  <text x="540" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">Lead</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">It moved up the coding-agent</text>
  <text x="540" y="545" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">table</text>
  <text x="540" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">An agent is a model that splits work</text>
  <rect x="720" y="400" width="300" height="200" rx="16" fill="#201018" stroke="#fb7185" stroke-width="2"/>
  <text x="870" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Price</text>
  <text x="870" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#fb7185" text-anchor="middle">$2/$6</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Input $2 and output $6</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">The score used more tokens</text>
  <rect x="60" y="616" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the eval says</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">A 46 on the index put it in the top four labs</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">It overtook one rival on the coding-agent table</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">More tokens raise the cost per job</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#201018" stroke="#fb7185" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#fb7185" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A higher score can lift both coding tools and the in-car assistant. It is one eval. Next, watch time and cost on real</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">jobs.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">SpaceXAI · Grok 4.7 · 2026.09.23</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
