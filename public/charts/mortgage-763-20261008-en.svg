  <rect x="40" y="18" width="140" height="42" rx="21" fill="#fb718522" stroke="#fb7185" stroke-width="1.5"/>
  <text x="110" y="44" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#fb7185" text-anchor="middle">MACRO</text>
  <text x="540" y="45" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="890" y="18" width="154" height="42" rx="21" fill="#1f2937" stroke="#374151"/>
  <text x="967" y="44" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">2026.10.08</text>
  <text x="540" y="116" font-family="Arial Black,Arial" font-size="36" font-weight="900" fill="#f9fafb" text-anchor="middle">30-Year Fixed Mortgage Rate</text>
  <text x="540" y="162" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#fb7185" text-anchor="middle">Highest Since November 2023</text>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#2a0a10" stroke-width="1"/>
  <text x="540" y="236" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Mortgage News Daily reading</text>
  <text x="540" y="316" font-family="Arial Black,Arial" font-size="80" font-weight="900" fill="#fb7185" text-anchor="middle">7.63%</text>
  <text x="540" y="376" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">10-year Treasury at 5% pointing the same direction — housing demand hit</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#2a0a10" stroke-width="1"/>
  <rect x="40" y="420" width="310" height="195" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <text x="195" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Current rate</text>
  <text x="195" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#fb7185" text-anchor="middle">7.63%</text>
  <text x="195" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">30-year fixed</text>
  <text x="195" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">MND reading</text>
  <rect x="385" y="420" width="310" height="195" rx="14" fill="#1a0a10" stroke="#e11d48" stroke-width="2"/>
  <text x="540" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Last seen this high</text>
  <text x="540" y="516" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e11d48" text-anchor="middle">Nov 2023</text>
  <text x="540" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Multi-year high</text>
  <text x="540" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Re-acceleration phase</text>
  <rect x="730" y="420" width="310" height="195" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <text x="885" y="460" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">10-yr Treasury</text>
  <text x="885" y="516" font-family="Arial Black,Arial" font-size="40" font-weight="900" fill="#fb7185" text-anchor="middle">5%+</text>
  <text x="885" y="552" font-family="Arial" font-size="22" fill="#9ca3af" text-anchor="middle">Same direction</text>
  <text x="885" y="586" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Post-Jan 2024 high</text>
  <rect x="40" y="632" width="1000" height="268" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">Background</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">US 30-year fixed mortgage has been oscillating above 7% since late 2023.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">7.63% is more than 0.5pp above the January 2024 low of around 7.1%.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">Mortgage rate tracks the 10-year Treasury with a long-run spread lag.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">Weakening rate-cut expectations extend the housing affordability drag.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* Do not read 7.63% as a confirmed trend — watch rate post-FOMC minutes</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#1a0a10" stroke="#fb7185" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#fb7185">Key Points</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">Prolonged high rates suppress new-home buying and pressure housing/REIT sector.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">Refinance demand is the first to respond to any rate decline signal.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">Higher mortgage burden reduces disposable income — broad consumption drag.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">Tesla's auto-loan financing competitiveness is also rate-environment sensitive.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#e11d48">Post-FOMC minutes rate behavior is the first test of whether 7.63% holds.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · MACRO · Mortgage Rate</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">Post-minutes rate move is the first test — not a confirmed trend yet</text>
  <rect x="0" y="1280" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1318" font-family="Arial" font-size="18" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
