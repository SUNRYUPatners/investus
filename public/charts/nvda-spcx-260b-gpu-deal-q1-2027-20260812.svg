  <rect x="40" y="20" width="150" height="38" rx="19" fill="#60a5fa30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">NVDA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.12</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">NVIDIA — 스페이스X와 약 2,600억 달러 규모 GPU 공급·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">네트워킹 10년 계약 · 2027년 1분기 첫 배치 예정</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#60a5fa" text-anchor="middle" opacity=".15">🤝</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#60a5fa" text-anchor="middle">🤝</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">2,600억 달러</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Evan D 정리에 따르면 엔비디아가 스페이스X와 GPU·SpecTrum·이더넷 네트워킹을 포함한 약 2,600억</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">달러 규모의 10년 장기 공급 계약을 맺었습니다. 첫 배치는 2027년 1분기부터 예정이며, 이 계약이 IBM과</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">엔비디아 조합의 규모를 이어받는 초대형 하이퍼스케일러 딜입니다.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">💰</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">2,600억 달러</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">10년 총 계약 규모</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">GPU + 네트워킹</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">📅</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">Q1 2027</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">첫 GPU 배치 시점</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">초기 인도 시작</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">⚡</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">400조 토큰</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">예상 처리 규모</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">AI 학습 인프라</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">EVAN D · X 정리</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">"엔비디아가 스페이스X와 GPU와 네트워킹까지 포함한 2,600억 달러 10년 계약을 맺었고, 2027년</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#60a5fa" text-anchor="middle">1분기부터 첫 배치가 시작됩니다."</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Nvidia has ~$260B multi-year GPU deal with SpaceX incl. Spectrum/Ethernet networking · 10-year ·</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">first deployment Q1 2027</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Evan D · 2026.08.11</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#60a5fa" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">스페이스X 인프라 확장 규모가 2,600억 달러 계약으로 실체가 됐습니다. 어제 언급된 5,000억 달러 컨소시엄과 별개로</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">엔비디아 개별 딜만 이 규모라면, xAI/Grok/Colossus 확장의 재무·부품 근거가 매우 견고해집니다.</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">NVDA·SPCX · 2,600억 달러 10년 · 2026.08.12</text>
