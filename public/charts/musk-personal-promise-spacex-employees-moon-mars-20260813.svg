  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Personal commitment from Elon: Anyone at SpaceX who wants to go to the Moon or Mars in the future will be</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">able to go · "You have my word"</text>
