  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">싶으면 갈 수 있다"고 약속했습니다. Musk의 원문은 "You have my word"였고, 다행성 문명 미션이 개별</text>
