  <text x="540" y="714" font-family="Arial" font-size="20" fill="#c084fc" text-anchor="middle">"SpaceX에서 미래에 달이나 화성에 가고 싶은 사람은 누구든 갈 수 있게 될 것입니다. 여러분에게 제 말을</text>
