  <rect x="60" y="372" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">80% of Nvidia’s stock book sat in Intel and SpaceX</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">As of Q2, Intel was 47.5% and listed SpaceX 33.3% of $63.1 billion.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">$63.1B</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Austin set a new record for driverless Cybercab sightings</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Registered share rose from about 30% to near 70% in two weeks.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">70%</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#facc15"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">Tesla reopened Roadster reservations</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">$5,000 today is refundable; $45,000 by wire within 10 days locks the slot.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">$5,000</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">Foreigners poured $942 billion into US stocks over 12 months</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">The private-plus-official 12-month sum printed near a record high.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">$942B</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Boring Company sketched an Austin–San Antonio high-speed tunnel</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">Above 200 mph, a 2.5-hour drive would shrink to under 30 minutes.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">&lt;30 min</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Starlink 100k · FSD 14.3.10 · Nvidia book · driverless Cybercab · Roadster · $942B inflows · Boring tunnel</text>
