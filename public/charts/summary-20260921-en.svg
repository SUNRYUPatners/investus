  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX asked to fly up to 100,000 Starlink Gen3 satellites</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">The FCC accepted the filing on Sept 18. That is review, not approval.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">100k</text>
