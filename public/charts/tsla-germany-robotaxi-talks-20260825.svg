  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">로보택시</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">상용 확정은 아님</text>
  <rect x="60" y="630" width="960" height="200" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="688" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">"독일 교통 당국은 한 주가 외딴 지역에 테슬라 로보택시를 넣는 방안을 협의 중이라고 했습니다. 로보택시는 기사가</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">없는 호출 차량입니다. 도시 중심부가 아니라 대중교통이 얇은 곳을 겨냥한 이야기입니다. 허가와 노선은 아직</text>
  <text x="540" y="740" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">확정되지 않았습니다."</text>
  <text x="540" y="818" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">2026.08.25</text>
  <rect x="60" y="838" width="960" height="140" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="868" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">유럽에서 로보택시가 뉴스이면 보통 대도시입니다. 이번에는 원격 지역이라 규제·보험·</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">통신 조건이 다릅니다. 협의는 운행 개시가 아닙니다. 다음엔 주 이름·시험 대수·유료 여부를 확인하면 됩니다.</text>
