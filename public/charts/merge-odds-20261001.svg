  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">캐시 우드는 합병이 올해 안에 발표될 수 있고 매우 강세라고 했습니다. 개인 보유는 줄고 기관 보유는 늘어 합병을 앞뒀다는 글도</text>
