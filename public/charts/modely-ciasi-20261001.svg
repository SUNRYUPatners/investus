  <text x="540" y="648" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">중국 보험자동차안전지수 2026년 평가에서 모델Y가 최고 등급 우+를 받았습니다. ️ 세부 점수는 탑승자 보호 G+,</text>
  <text x="540" y="672" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">보행자 보호 G+, 보조 안전 G, 신에너지 특별 항목 G입니다. 같은 계열 안내에서는 모델 S, 3, X, Y가 유럽 신차평가,</text>
  <text x="540" y="696" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">미국 도로교통안전국, 호주 신차평가, 미국 고속도로안전보험협회, 중국 보험 평가에서 별 다섯 급으로 묶입니다.</text>
  <rect x="60" y="810" width="960" height="176" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="838" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">왜 중요한가</text>
  <text x="540" y="864" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">우+는 그 프로그램의 맨 위 칸입니다. G+와 G는 그 아래 항목의 등급 이름입니다. 별 다섯 급으로 묶인 네 차종은 시험 기관이 서로</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">다릅니다. 한 기관의 점수를 다른 기관 점수로 바꾸어 평균 내지 않습니다. 보험 등급은 판매 가격과 별도로 읽는 안전 성적입니다.</text>
  <text x="540" y="904" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">다음 연식 평가가 나와야 올해 등급이 유지되는지 확인합니다. 유럽과 미국의 시험 항목 이름이 달라도 최고 칸에 놓였다는 사실만</text>
  <text x="540" y="924" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">오늘 가져옵니다. 연식 변경 때 같은 프로그램이 다시 열리면 등급이 유지되는지 그때 비교합니다. 보험료 할인으로 이어지는지는</text>
  <text x="540" y="944" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">보험사 공지가 따로 있어야 합니다.</text>
