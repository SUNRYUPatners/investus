  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">JUST IN: Tesla reportedly getting ready to launch the Cybercab to the public · Tesla has reportedly told staff</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">it is gearing up for a public launch of the Cybercab, its first vehicle designed without a steering wheel or</text>
