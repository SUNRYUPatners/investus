  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">TheSonOfWakley와 Kalshi Finance 정리에 따르면 Tesla가 Cybercab을 대중에게 launch할 준비를 하고</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">있다고 보도됐습니다. Kalshi Finance: Tesla가 직원들에게 스티어링 휠·브레이크 페달 없는 첫 차량인</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Cybercab의 공개 launch를 준비 중이라고 알렸다. Evan D는 The Information을 인용해 Tesla가 이번 달</text>
