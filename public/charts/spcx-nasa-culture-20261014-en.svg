<rect x="82" y="782" width="916" height="96" rx="12" fill="#050E1A" stroke="#3B82F6" stroke-width="1"/>
<text x="540" y="820" font-family="Arial,sans-serif" font-size="22" fill="#E6EDF3" text-anchor="middle">"I didn't get smarter when I went to SpaceX.</text>
<text x="540" y="862" font-family="Arial,sans-serif" font-size="22" fill="#E6EDF3" text-anchor="middle">The difference is the bottleneck — SpaceX eliminated it."</text>
