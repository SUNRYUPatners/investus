<text x="54" y="104" font-family="Arial,sans-serif" font-size="24" fill="#8B949E">2026.10.14 · Retired NASA engineer joins SpaceX at 62</text>
<text x="54" y="218" font-family="Arial Black,Arial,sans-serif" font-size="42" fill="#8B949E" font-weight="900">NASA 25 yrs vs SpaceX 9 months</text>
<text x="54" y="318" font-family="Arial Black,Arial,sans-serif" font-size="68" fill="#3B82F6" font-weight="900">BOTTLENECK</text>
