  <rect x="60" y="372" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">펜실베이니아 주차장에 사이버캡 15대가 나갈 준비를 했습니다</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">홍콩은 9월 9일 아시아 첫 전시, 다음은 도쿄입니다.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">15대</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#ef4444"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#ef4444">미국 집 매도자가 매수자보다 57.9% 많아 기록을 찍었습니다</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">8월 숫자입니다. 집값이 하루 57% 떨어진 것이 아닙니다.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">57.9%</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#c084fc"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스페이스엑스가 12월부터 한 달 11억 1천만 달러 연산 계약을 시작한다…</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">연으로는 133억 달러입니다. 12월 속도면 연 1,000억 궤도라고 했습니다.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">11.1억</text>
