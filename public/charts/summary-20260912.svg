  <rect x="60" y="747" width="8" height="115" rx="4" fill="#60a5fa"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">마이크로소프트가 2032년 데이터센터 38기가와트를 목표로 적었습니다</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">지금은 약 12기가와트입니다. 엔비디아 사장은 인공지능을 새 전기에 비유했습니다.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">38GW</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">사이버캡 운임이 마일당 0.25달러로 그려졌고 플릿 구매 폼이 열렸습니다</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">감독 없는 마일 이 38만에서 100만으로 늘었습니다. 예측이지 오늘 요금이 아닙니다.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">0.25</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">더 볼 것: 9/18 발사 · FSD 15 · 캡 15대 · 주택 57.9% · 월 11.1억 · 38GW</text>
