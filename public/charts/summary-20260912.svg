  <rect x="60" y="247" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">완전자율주행 15번이 위험 예측과 충돌 회피를 더 빨리 한다고 했습니다</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">감독 모드의 다음 큰 버전입니다. 일본은 올해 안이 최우선이라고 했습니다.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">v15</text>
