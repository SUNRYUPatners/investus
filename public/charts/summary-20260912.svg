  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">스타십 14번째 비행이 9월 18일 아침 창으로 잡혔습니다</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">7시 15분~9시 14분(중부시간)입니다. 첫 매출 비행에 스타링크 3세대를 싣습니다.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">9/18</text>
