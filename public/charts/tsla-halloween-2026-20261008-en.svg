  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">Halloween mode builds loyalty and earns earned media simultaneously.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">Software platform upside outweighs hardware margin in long-term valuation.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">FSD screen usage creates monthly reasons to renew the subscription.</text>
