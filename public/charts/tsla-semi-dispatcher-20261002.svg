  <text x="540" y="648" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">테슬라가 네바다 스파크스에서 세미 운영 배차원을 뽑습니다. 기본 배차를 넘는 자리입니다. 테슬라 세미를 공장에서</text>
