  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#1a0d02"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f97316"/><stop offset="100%" style="stop-color:#ea580c"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#f9731630" stroke="#f97316" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#f97316" text-anchor="middle">OIL</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.15</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Oil surged to $108 a barrel after a Saudi pipeline shutdown</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">and postponed Hormuz talks</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="234" font-family="Arial" font-size="80" text-anchor="middle">🛢</text>
  <text x="540" y="318" font-family="Arial Black,Arial" font-size="60" font-weight="900" fill="#f97316" text-anchor="middle">$108/bbl</text>
  <text x="540" y="358" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Brent crude price. Saudi's East-West pipeline has been down since Sept 11.</text>
  <line x1="80" y1="406" x2="1000" y2="406" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="2"/>
  <text x="210" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Brent</text>
  <text x="210" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f97316" text-anchor="middle">$108</text>
  <text x="210" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">+3.1-3.5%</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Up 77% YTD</text>
  <rect x="390" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="2"/>
  <text x="540" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">WTI</text>
  <text x="540" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f97316" text-anchor="middle">$102-103</text>
  <text x="540" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">+2.8%</text>
  <text x="540" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Feeding into local markets</text>
  <rect x="720" y="418" width="300" height="176" rx="16" fill="#20130a" stroke="#f97316" stroke-width="2"/>
  <text x="870" y="452" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle">Repair time</text>
  <text x="870" y="500" font-family="Arial Black,Arial" font-size="32" font-weight="900" fill="#f97316" text-anchor="middle">3-6 weeks</text>
  <text x="870" y="532" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Industry estimate</text>
  <text x="870" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Until full restart</text>
  <rect x="60" y="612" width="960" height="172" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="2">Why oil spiked this much</text>
  <text x="100" y="686" font-family="Arial" font-size="23" fill="#e5e7eb">A drone strike from Iraq damaged and halted Saudi's East-West pipeline.</text>
  <text x="100" y="724" font-family="Arial" font-size="23" fill="#e5e7eb">High-level Iran-Gulf talks on the Strait of Hormuz were postponed.</text>
  <text x="100" y="762" font-family="Arial" font-size="23" fill="#e5e7eb">Saudi's August output fell to 6.2M bpd, a three-decade low.</text>
  <rect x="60" y="800" width="960" height="148" rx="14" fill="#20130a" stroke="#f97316" stroke-width="1"/>
  <text x="540" y="830" font-family="Arial" font-size="18" fill="#f97316" text-anchor="middle">Why it matters</text>
  <text x="540" y="862" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Yanbu port's reserves cover only 5-7 days, raising warnings that up to 4% of global supply could be at risk. The spike</text>
  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">has already pushed up Treasury yields and Fed hike odds. Next: watch the pipeline repair progress and whether</text>
  <text x="540" y="906" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Hormuz talks resume.</text>
  <text x="540" y="1000" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Oil · Prices · 2026.09.15</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>