<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.11 Korea RE Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="115" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="115" rx="4" fill="#a78bfa"/>
  <text x="116" y="163" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa">Seoul flats rose 0.20% in sales and 0.19% in jeonse in week 1 of…</text>
  <text x="116" y="202" font-family="Arial" font-size="16" fill="#9ca3af">Gains slowed versus the prior week. Gangnam and Gangbuk split.</text>
  <text x="985" y="181" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">Seoul</text>
  <rect x="60" y="247" width="960" height="115" rx="14" fill="#1a0a10" stroke="#fb7185" stroke-width="2"/>
  <rect x="60" y="247" width="8" height="115" rx="4" fill="#fb7185"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb7185">Gangnam, Seocho, and Songpa sale prices all fell</text>
  <text x="116" y="327" font-family="Arial" font-size="16" fill="#9ca3af">Gangnam −0.35%, Seocho −0.30%, Songpa −0.02%. Split from the city average.</text>
  <text x="985" y="306" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb7185" text-anchor="end">GN3</text>
  <rect x="60" y="372" width="960" height="115" rx="14" fill="#061520" stroke="#38bdf8" stroke-width="2"/>
  <rect x="60" y="372" width="8" height="115" rx="4" fill="#38bdf8"/>
  <text x="116" y="413" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#38bdf8">The 14 northern districts rose 0.33% in sales</text>
  <text x="116" y="452" font-family="Arial" font-size="16" fill="#9ca3af">Gangbuk-gu 0.46%, Dobong 0.43%. Match keys with Gangnam softness.</text>
  <text x="985" y="431" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="end">North</text>
  <rect x="60" y="497" width="960" height="115" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="497" width="8" height="115" rx="4" fill="#fb923c"/>
  <text x="116" y="538" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#fb923c">Nowon jeonse rose 0.38% while Seocho jeonse fell 0.21%</text>
  <text x="116" y="577" font-family="Arial" font-size="16" fill="#9ca3af">Gangnam jeonse −0.03%. Do not sign on a city average alone.</text>
  <text x="985" y="556" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">Jeonse</text>
  <rect x="60" y="622" width="960" height="115" rx="14" fill="#06171c" stroke="#22d3ee" stroke-width="2"/>
  <rect x="60" y="622" width="8" height="115" rx="4" fill="#22d3ee"/>
  <text x="116" y="663" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee">Brownstone Mokdong is 85 homes, 29 of them general sale</text>
  <text x="116" y="702" font-family="Arial" font-size="16" fill="#9ca3af">Contracts Sep 11–12. Do not mash one complex with a city drought.</text>
  <text x="985" y="681" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="end">Supply</text>
  <rect x="60" y="747" width="960" height="115" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="747" width="8" height="115" rx="4" fill="#4ade80"/>
  <text x="116" y="788" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Seocho jeonse softness was tied to Jamwon/Banpo move-ins</text>
  <text x="116" y="827" font-family="Arial" font-size="16" fill="#9ca3af">A fourth down week. Split from sale softness.</text>
  <text x="985" y="806" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">Move-in</text>
  <rect x="60" y="872" width="960" height="115" rx="14" fill="#0c1017" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="872" width="8" height="115" rx="4" fill="#94a3b8"/>
  <text x="116" y="913" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8">Gu-level prints and jeonse-loan caps are the contract gate</text>
  <text x="116" y="952" font-family="Arial" font-size="16" fill="#9ca3af">Refuse no-look contracts.</text>
  <text x="985" y="931" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#94a3b8" text-anchor="end">Contract</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Seoul sales +0.20% · Gangnam −0.35% · Nowon jeonse +0.38% · Mokdong 85 · general 29</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>