<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.02 Korea Market Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="112" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="112" rx="4" fill="#4ade80"/>
  <text x="116" y="164" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#4ade80">KOSPI rose 0.9% to 6,875 in a modest bounce</text>
  <text x="116" y="202" font-family="Arial" font-size="18" fill="#9ca3af">First session after Friday's 1.79% drop; reclaimed the 6,800 line.</text>
  <text x="985" y="188" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80" text-anchor="end">+0.9%</text>
  <rect x="60" y="246" width="960" height="112" rx="14" fill="#06171c" stroke="#22d3ee" stroke-width="2"/>
  <rect x="60" y="246" width="8" height="112" rx="4" fill="#22d3ee"/>
  <text x="116" y="288" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#22d3ee">Foreign investors turned to net buyers of 89bn won</text>
  <text x="116" y="326" font-family="Arial" font-size="18" fill="#9ca3af">Down sharply from Friday's 1.756T won net sell.</text>
  <text x="985" y="312" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22d3ee" text-anchor="end">+89B</text>
  <rect x="60" y="370" width="960" height="112" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="370" width="8" height="112" rx="4" fill="#60a5fa"/>
  <text x="116" y="412" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#60a5fa">Samsung +1.8% and SK Hynix +1.6% led chips higher</text>
  <text x="116" y="450" font-family="Arial" font-size="18" fill="#9ca3af">70% HBM capacity and ~5x HBM3E spot themes hit Korean memory names.</text>
  <text x="985" y="436" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa" text-anchor="end">HBM</text>
  <rect x="60" y="494" width="960" height="112" rx="14" fill="#1a1205" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="494" width="8" height="112" rx="4" fill="#f59e0b"/>
  <text x="116" y="536" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#f59e0b">LG Energy +0.55%, Kia +0.91% lifted batteries and autos</text>
  <text x="116" y="574" font-family="Arial" font-size="18" fill="#9ca3af">Cybercab on Sept 3 is the near-term autonomy catalyst.</text>
  <text x="985" y="560" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#f59e0b" text-anchor="end">Kia</text>
  <rect x="60" y="618" width="960" height="112" rx="14" fill="#0f1419" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="618" width="8" height="112" rx="4" fill="#94a3b8"/>
  <text x="116" y="660" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#94a3b8">USDKRW closed 3.3 won weaker at 1,366.5</text>
  <text x="116" y="698" font-family="Arial" font-size="18" fill="#9ca3af">Won softened alongside modest foreign buying.</text>
  <text x="985" y="684" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#94a3b8" text-anchor="end">1,366</text>
  <rect x="60" y="742" width="960" height="112" rx="14" fill="#120b1f" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="742" width="8" height="112" rx="4" fill="#a78bfa"/>
  <text x="116" y="784" font-family="Arial Black,Arial" font-size="24" font-weight="900" fill="#a78bfa">SemiCon Taiwan, FOMC Sept 15-16, hike odds ~57%</text>
  <text x="116" y="822" font-family="Arial" font-size="18" fill="#9ca3af">Cybercab D-1 Sept 3 and Sept 4 US jobs round out the week.</text>
  <text x="985" y="808" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#a78bfa" text-anchor="end">57%</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: KOSPI 6,875 · foreign +89B won · Samsung +1.8% · Hynix +1.6% · USDKRW 1,366.5 · FOMC 9/15-16</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
