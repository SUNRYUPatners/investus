<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="110" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="95" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.09.17</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">Tesla moved a step closer to building a $10.1B solar factory</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">near Houston, Texas</text>
  <line x1="80" y1="152" x2="1000" y2="152" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="220" font-family="Arial" font-size="64" text-anchor="middle">☀️</text>
  <text x="540" y="290" font-family="Arial Black,Arial" font-size="52" font-weight="900" fill="#4ade80" text-anchor="middle">Project Crystal Sun</text>
  <text x="540" y="334" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">The Lamar school board unanimously approved Tesla’s tax incentive request for a vertically integrated</text>
  <text x="540" y="358" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">solar factory covering wafers through cells.</text>
  <line x1="80" y1="388" x2="1000" y2="388" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="400" width="300" height="200" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Investment</text>
  <text x="210" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#4ade80" text-anchor="middle">$10.1B</text>
  <text x="210" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Total capital investment</text>
  <text x="210" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">About 3,000 acres of land</text>
  <rect x="390" y="400" width="300" height="200" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Jobs</text>
  <text x="540" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#4ade80" text-anchor="middle">9,712</text>
  <text x="540" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">Permanent full-time jobs</text>
  <text x="540" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">Direct and indirect hiring</text>
  <rect x="720" y="400" width="300" height="200" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="436" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle">Tax impact</text>
  <text x="870" y="486" font-family="Arial Black,Arial" font-size="30" font-weight="900" fill="#4ade80" text-anchor="middle">$6.4B</text>
  <text x="870" y="524" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">State &amp; local tax revenue</text>
  <text x="870" y="566" font-family="Arial" font-size="15" fill="#d1d5db" text-anchor="middle">~$107B added to Texas GDP</text>
  <rect x="60" y="616" width="960" height="148" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="650" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">What the plant will include</text>
  <text x="100" y="668" font-family="Arial" font-size="21" fill="#e5e7eb">Wafer manufacturing, ingot manufacturing, coating, metallization and printing lines</text>
  <text x="100" y="704" font-family="Arial" font-size="21" fill="#e5e7eb">Cell testing/QC plus automation and material handling equipment</text>
  <text x="100" y="740" font-family="Arial" font-size="21" fill="#e5e7eb">Construction starts this year, finishing in 2028, commercial ops targeted for Q1…</text>
  <rect x="60" y="780" width="960" height="210" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="810" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">Why it matters</text>
  <text x="540" y="838" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Building wafers through finished cells under one roof cuts supply-chain risk and lowers cost. Watch for the actual</text>
  <text x="540" y="860" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">groundbreaking date and whether the hiring targets are met.</text>
  <text x="540" y="1012" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · Solar Factory · 2026.09.17</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>