  <text x="540" y="884" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">힌트입니다. 제프 루츠가 말한 기가텍사스 출고와 같은 방향입니다. 다음 확인할 것은 옥상 대수와 오스틴 도로 목격이 같이</text>
