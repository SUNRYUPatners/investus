<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#061209"/></linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4ade80"/><stop offset="100%" style="stop-color:#22c55e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#g)"/>
  <rect x="40" y="20" width="150" height="38" rx="19" fill="#4ade8030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="115" y="44" font-family="Arial Black,Arial" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">TSLA</text>
  <text x="540" y="46" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <rect x="900" y="20" width="148" height="38" rx="19" fill="#1f2937" stroke="#374151"/>
  <text x="974" y="44" font-family="Arial" font-size="14" fill="#9ca3af" text-anchor="middle">2026.08.14</text>
  <text x="540" y="108" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">TSLA — Austin에서 무감독 Cybercab 상업 배치 임박·</text>
  <text x="540" y="144" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f9fafb" text-anchor="middle">First Responder QR 스티커 부착 확인</text>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#1f2937" stroke-width="1"/>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="90" font-weight="900" fill="#4ade80" text-anchor="middle" opacity=".15">🚕</text>
  <text x="540" y="240" font-family="Arial Black,Arial" font-size="76" font-weight="900" fill="#4ade80" text-anchor="middle">🚕</text>
  <text x="540" y="300" font-family="Arial Black,Arial" font-size="42" font-weight="900" fill="#f9fafb" text-anchor="middle">Austin 임박</text>
  <text x="540" y="340" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Robotaxi Rider 관측에 따르면 Austin 소방서가 무감독(unsupervised) Cybercab이 곧 도시를 다닐</text>
  <text x="540" y="366" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">것이라고 확인했습니다. 26대에 Cybercab 로고가 부착됐고, 스티어링 휠 없는 모든 차량에 First</text>
  <text x="540" y="392" font-family="Arial" font-size="20" fill="#9ca3af" text-anchor="middle">Responder QR 스티커가 붙어 있으며, 이는 규제 승인 완료의 확실한 신호입니다.</text>
  <line x1="80" y1="390" x2="1000" y2="390" stroke="#1f2937" stroke-width="1"/>

  <rect x="60" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="450" font-family="Arial" font-size="36" text-anchor="middle">🚕</text>
  <text x="210" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">무감독</text>
  <text x="210" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Cybercab Austin 배치</text>
  <text x="210" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">상업 서비스 임박</text>
  <rect x="390" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="450" font-family="Arial" font-size="36" text-anchor="middle">🚨</text>
  <text x="540" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">QR 스티커</text>
  <text x="540" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">First Responder 승인</text>
  <text x="540" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">규제 완료 신호</text>
  <rect x="720" y="402" width="300" height="220" rx="16" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <text x="870" y="450" font-family="Arial" font-size="36" text-anchor="middle">📸</text>
  <text x="870" y="494" font-family="Arial Black,Arial" font-size="22" font-weight="900" fill="#4ade80" text-anchor="middle">26대</text>
  <text x="870" y="528" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Cybercab 로고 부착</text>
  <text x="870" y="588" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">실 상용 준비</text>
  <rect x="60" y="642" width="960" height="180" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="682" font-family="Arial" font-size="18" fill="#6b7280" text-anchor="middle" letter-spacing="2">ROBOTAXI RIDER · AUSTIN FIRE DEPT</text>
  <text x="540" y="714" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">"무감독 Cybercab이 곧 Austin에서 다닐 예정입니다. Austin 소방서 사진이 스티어링 휠 없는 모든 차량에</text>
  <text x="540" y="740" font-family="Arial" font-size="20" fill="#4ade80" text-anchor="middle">First Responder QR 스티커가 붙었다고 확인해 줍니다."</text>
  <text x="540" y="772" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">Unsupervised Cybercabs are about to start roaming Austin real soon · This photo from Austin fire department</text>
  <text x="540" y="796" font-family="Arial" font-size="17" fill="#e5e7eb" text-anchor="middle">confirms sticker on the bottom side of the windshield is the first responders QR code sticker</text>
  <text x="540" y="826" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">출처: Robotaxi Rider · Austin Fire Dept · 2026.08.13</text>
  <rect x="60" y="850" width="960" height="110" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="540" y="884" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">이 소식은 왜 중요한가</text>
  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">어제 별개 리포트의 Cybercab 44대 중 43대 스티어링 없음 대량 관측에 이어 오늘 Austin 소방서 QR 스티커 확인은 규제 승인</text>
  <text x="540" y="954" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">완료 명확 신호입니다. 오늘 별개 리포트의 Nevada 40대 허가와 결합해 Tesla Robotaxi 실 상용 서비스가 8월 안에 시작될</text>
  <text x="540" y="994" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">TSLA · Austin 무감독 임박 · 2026.08.14</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#g)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">INVESTUS · SRP 최고투자책임자 발행 · NOT FINANCIAL ADVICE</text>
</svg>