  <text x="540" y="248" font-family="Arial" font-size="76" text-anchor="middle">💵</text>
  <text x="540" y="306" font-family="Arial Black,Arial" font-size="44" font-weight="900" fill="#f9fafb" text-anchor="middle">Structural buyer</text>
  <text x="540" y="344" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">Stablecoin issuers must hold dollar reserves matching every coin issued, and much of that sits in</text>
