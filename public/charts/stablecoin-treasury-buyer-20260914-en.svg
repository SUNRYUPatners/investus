  <text x="210" y="534" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">Issuance = backing</text>
  <text x="210" y="560" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Held in cash and T-bills</text>
  <rect x="390" y="396" width="300" height="196" rx="16" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
