  <text x="540" y="656" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">As the stablecoin market grows, so does its reserve-driven demand for U.S. Treasuries.</text>
  <rect x="60" y="814" width="960" height="148" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="844" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="876" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">A stablecoin is designed to always hold $1 of value per coin. As the market grows, so do reserves, much of which sits</text>
  <text x="540" y="898" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">in safe short-term Treasuries. Next: check issuer disclosures for exactly how much of their reserves are</text>
  <text x="540" y="920" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Treasuries.</text>
  <text x="540" y="1002" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">USD · Stablecoins · 2026.09.14</text>
