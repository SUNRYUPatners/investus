  <text x="540" y="572" font-family="Arial" font-size="18" fill="#9ca3af" text-anchor="middle">All-In Summit remark</text>
  <text x="540" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Musk stopped short of confirming</text>
