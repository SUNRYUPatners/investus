  <text x="540" y="900" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">The two firms build different products, but overlap is growing in areas like space-based computing and self-driving.</text>
  <text x="540" y="922" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Watch for any actual merger filing next.</text>
  <text x="540" y="1030" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Tesla · SpaceX · Merger Talk · 2026.09.16</text>
