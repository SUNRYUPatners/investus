  <text x="540" y="690" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">Prediction market Polymarket puts 52% odds on Musk formally announcing a Tesla-SpaceX merger</text>
  <text x="540" y="714" font-family="Arial" font-size="19" fill="#4ade80" text-anchor="middle">by the end of next year. Musk didn’t confirm it directly at the summit.</text>
