  <text x="540" y="930" font-family="Arial" font-size="17" fill="#9ca3af" text-anchor="middle">8/14 별개 리포트의 Musk 48.4% SEC 공식 지분과 병행되는 대량 EU 지분 신청 실체입니다. SPCX 상장 후 유통 시장 확장·</text>
