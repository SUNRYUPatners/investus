  <text x="70" y="672" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#e2e8f0">배경 및 맥락</text>
  <text x="70" y="714" font-family="Arial" font-size="22" fill="#d1d5db">ARKQ는 아크인베스트의 로봇·자율주행·우주 테마 ETF다.</text>
  <text x="70" y="748" font-family="Arial" font-size="22" fill="#d1d5db">10위 안에 NVDA 5.96%, 팔란티어 4.63%, 로켓랩 4.42%가 있다.</text>
  <text x="70" y="782" font-family="Arial" font-size="22" fill="#d1d5db">두 종목 합산 20% 이상은 ETF 집중 리스크를 동반한다.</text>
  <text x="70" y="816" font-family="Arial" font-size="22" fill="#d1d5db">분기 리밸런싱에서 비중이 유지되는지가 다음 확인 포인트다.</text>
  <text x="70" y="862" font-family="Arial" font-size="20" fill="#9ca3af">* TSLA+SPCX 상관계수가 높을수록 포트폴리오 변동성도 함께 크다</text>
  <rect x="40" y="918" width="1000" height="268" rx="16" fill="#1a1205" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="958" font-family="Arial Black,Arial" font-size="28" font-weight="900" fill="#f59e0b">핵심 포인트</text>
  <text x="70" y="1000" font-family="Arial" font-size="22" fill="#e2e8f0">아크는 로봇·자율주행·우주 세 섹터가 같은 인프라를 공유한다고 본다.</text>
  <text x="70" y="1034" font-family="Arial" font-size="22" fill="#e2e8f0">TSLA+SPCX 동반 상승 시 ARKQ 수익률이 집중적으로 올라간다.</text>
  <text x="70" y="1068" font-family="Arial" font-size="22" fill="#e2e8f0">반대로 두 종목 동반 하락 시 변동성 확대로 이어진다.</text>
  <text x="70" y="1102" font-family="Arial" font-size="22" fill="#e2e8f0">팔란티어·알파벳은 AI 소프트웨어 레이어로서 분산 역할을 한다.</text>
  <text x="70" y="1154" font-family="Arial" font-size="22" fill="#d97706">20% 집중과 ETF 전체 수익률을 같은 공식으로 만들지 않는다.</text>
  <text x="540" y="1218" font-family="Arial" font-size="18" fill="#4b5563" text-anchor="middle">2026.10.08 · ARKQ · TSLA + SPCX</text>
  <text x="540" y="1250" font-family="Arial" font-size="22" fill="#6b7280" text-anchor="middle">합산 20%는 아크 ETF 안의 집중도이지 시장 컨센서스가 아니다</text>
