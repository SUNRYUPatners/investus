  <text x="870" y="598" font-family="Arial" font-size="15" fill="#6b7280" text-anchor="middle">Budget axis</text>
  <rect x="60" y="644" width="960" height="186" rx="16" fill="#0f172a" stroke="#374151"/>
  <text x="540" y="690" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">Interest aid is often once-in-a-lifetime and non-increasable. Keeping the ₩1.2B tax deduction and</text>
  <text x="540" y="716" font-family="Arial" font-size="19" fill="#a78bfa" text-anchor="middle">youth rental have different audiences. Whether the ladder to ownership is enough is another cell.</text>
  <rect x="60" y="848" width="960" height="144" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="878" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">Why it matters</text>
  <text x="540" y="910" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">Public rental has waitlists and eligibility. Do not assume it offsets fewer jeonse listings. A larger youth rental stock</text>
  <text x="540" y="932" font-family="Arial" font-size="16" fill="#9ca3af" text-anchor="middle">can buffer jeonse spikes over years.</text>
  <text x="540" y="1024" font-family="Arial" font-size="16" fill="#374151" text-anchor="middle">Youth housing · 2026.09.10</text>
