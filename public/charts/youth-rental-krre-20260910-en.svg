  <rect x="360" y="166" width="360" height="46" rx="23" fill="#a78bfa18" stroke="#a78bfa" stroke-width="1"/>
  <text x="540" y="196" font-family="Arial" font-size="20" fill="#a78bfa" text-anchor="middle">🏘 public rental · interest aid</text>
  <text x="540" y="292" font-family="Arial" font-size="66" text-anchor="middle">🏘</text>
  <text x="540" y="352" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#a78bfa" text-anchor="middle">₩200M</text>
  <text x="540" y="392" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">The 2027 budget stresses more youth public rental and monthly-rent aid. Seoul’s youth</text>
  <text x="540" y="417" font-family="Arial" font-size="19" fill="#9ca3af" text-anchor="middle">deposit-interest program: ages 19–39, income ≤₩50M, loan up to ₩200M (90% of deposit), city rat…</text>
