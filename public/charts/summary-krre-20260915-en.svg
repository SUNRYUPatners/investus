<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.15 Korea Real Estate Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="209" rx="14" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="209" rx="4" fill="#ef4444"/>
  <text x="116" y="197" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#ef4444">Seoul apartments posted a record 86th straight weekly gain</text>
  <text x="116" y="243" font-family="Arial" font-size="17" fill="#9ca3af">Cumulative gains of 17.164%, double the prior record streak.</text>
  <text x="985" y="230" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#ef4444" text-anchor="end">86 wks</text>
  <rect x="60" y="341" width="960" height="209" rx="14" fill="#180f28" stroke="#a78bfa" stroke-width="2"/>
  <rect x="60" y="341" width="8" height="209" rx="4" fill="#a78bfa"/>
  <text x="116" y="416" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#a78bfa">Jongbuse deduction is now ₩1.4B for occupants, ₩1.2B else</text>
  <text x="116" y="462" font-family="Arial" font-size="17" fill="#9ca3af">A plan to cut the latter to ₩900M was withdrawn.</text>
  <text x="985" y="449" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="end">₩1.4B/1.2B</text>
  <rect x="60" y="560" width="960" height="209" rx="14" fill="#1a0d02" stroke="#fb923c" stroke-width="2"/>
  <rect x="60" y="560" width="8" height="209" rx="4" fill="#fb923c"/>
  <text x="116" y="635" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#fb923c">Seoul's rent deposit rose for a 6th month to ₩195.57M</text>
  <text x="116" y="681" font-family="Arial" font-size="17" fill="#9ca3af">18 of 25 districts saw deposits rise from January.</text>
  <text x="985" y="668" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#fb923c" text-anchor="end">₩196M</text>
  <rect x="60" y="779" width="960" height="209" rx="14" fill="#0a1420" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="779" width="8" height="209" rx="4" fill="#60a5fa"/>
  <text x="116" y="854" font-family="Arial Black,Arial" font-size="23" font-weight="900" fill="#60a5fa">Seoul jeonse prices are up 7.61% this year, 4.8x last year</text>
  <text x="116" y="900" font-family="Arial" font-size="17" fill="#9ca3af">36,000 new public rental units are planned for next year.</text>
  <text x="985" y="887" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">7.61%</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: Seoul sales 86-wk streak · jongbuse ₩1.4B/1.2B · rent deposit ₩196M · jeonse +7.61%</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
