  <text x="540" y="658" font-family="Arial" font-size="18" fill="#4ade80" text-anchor="middle">스트릭 숫자는 한 구간의 실측입니다. 슬로베니아 두 달 무상과 한 문장에 넣지 마시기 바랍니다. 다음 확인할 것은</text>
