<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#0a0f1a"/></linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="25%" style="stop-color:#f59e0b"/><stop offset="50%" style="stop-color:#4ade80"/><stop offset="75%" style="stop-color:#60a5fa"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="none" stroke="#1f2937" stroke-width="2"/>
  <rect x="0" y="0" width="1080" height="5" fill="url(#flow)"/>
  <text x="540" y="48" font-family="Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="3">INVESTUS DAILY REPORT</text>
  <text x="540" y="92" font-family="Arial Black,Arial" font-size="34" font-weight="900" fill="#f9fafb" text-anchor="middle">2026.09.30 Daily Snapshot</text>
  <line x1="80" y1="108" x2="1000" y2="108" stroke="#1f2937" stroke-width="1"/>
  <rect x="60" y="122" width="960" height="100" rx="14" fill="#061209" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="122" width="8" height="100" rx="4" fill="#4ade80"/>
  <text x="116" y="148" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Croatia approved Tesla supervised self-driving, making eight</text>
  <text x="116" y="173" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">European countries</text>
  <text x="116" y="190" font-family="Arial" font-size="16" fill="#9ca3af">Population share is 12.66% of 65%. A separate post counts 16 countries worldwide.</text>
  <text x="985" y="172" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">8</text>
  <rect x="60" y="232" width="960" height="100" rx="14" fill="#140b1f" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="232" width="8" height="100" rx="4" fill="#c084fc"/>
  <text x="116" y="258" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">Anthropic disclosed up to $84.5 billion of SpaceX compute</text>
  <text x="116" y="283" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">through 2029</text>
  <text x="116" y="300" font-family="Arial" font-size="16" fill="#9ca3af">NVIDIA-based capacity. The 2031 bar on the chart reads 66.6 gigawatts.</text>
  <text x="985" y="282" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">$84.5B</text>
  <rect x="60" y="342" width="960" height="100" rx="14" fill="#0a1a0a" stroke="#22c55e" stroke-width="2"/>
  <rect x="60" y="342" width="8" height="100" rx="4" fill="#22c55e"/>
  <text x="116" y="368" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">Tesla and SpaceX are described as targeting 200 GW of solar</text>
  <text x="116" y="393" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#22c55e">modules a year</text>
  <text x="116" y="410" font-family="Arial" font-size="16" fill="#9ca3af">About three times current U.S. module capacity.</text>
  <text x="985" y="392" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#22c55e" text-anchor="end">200GW</text>
  <rect x="60" y="452" width="960" height="100" rx="14" fill="#0a1a0a" stroke="#4ade80" stroke-width="2"/>
  <rect x="60" y="452" width="8" height="100" rx="4" fill="#4ade80"/>
  <text x="116" y="478" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">Supervised self-driving miles passed 15 billion on the safety</text>
  <text x="116" y="503" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#4ade80">report</text>
  <text x="116" y="520" font-family="Arial" font-size="16" fill="#9ca3af">City miles are in the 5.8 billion range. One billion miles arrived in 29 days.</text>
  <text x="985" y="502" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#4ade80" text-anchor="end">15B mi</text>
  <rect x="60" y="562" width="960" height="100" rx="14" fill="#061209" stroke="#86efac" stroke-width="2"/>
  <rect x="60" y="562" width="8" height="100" rx="4" fill="#86efac"/>
  <text x="116" y="588" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#86efac">An Austin Monday evening Cybercab fare of $8.33 undercut UberX</text>
  <text x="116" y="613" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#86efac">at $10.90</text>
  <text x="116" y="630" font-family="Arial" font-size="16" fill="#9ca3af">Uber was still faster, 9 minutes versus 11. The prior Monday was $16.89.</text>
  <text x="985" y="612" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#86efac" text-anchor="end">$8.33</text>
  <rect x="60" y="672" width="960" height="100" rx="14" fill="#06121f" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="672" width="8" height="100" rx="4" fill="#60a5fa"/>
  <text x="116" y="698" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">AMD agreed to buy Fei-Fei Li's World Labs for about $8.2 billion in</text>
  <text x="116" y="723" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#60a5fa">stock</text>
  <text x="116" y="740" font-family="Arial" font-size="16" fill="#9ca3af">Announced Sept. 28. Closing is expected this year, subject to approvals.</text>
  <text x="985" y="722" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#60a5fa" text-anchor="end">$8.2B</text>
  <rect x="60" y="782" width="960" height="100" rx="14" fill="#1a1600" stroke="#facc15" stroke-width="2"/>
  <rect x="60" y="782" width="8" height="100" rx="4" fill="#facc15"/>
  <text x="116" y="808" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">Tesla credit is listed as a $20 billion three-year loan plus $10</text>
  <text x="116" y="833" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#facc15">billion revolvers</text>
  <text x="116" y="850" font-family="Arial" font-size="16" fill="#9ca3af">Fitch described plans to secure up to $30 billion of facilities.</text>
  <text x="985" y="832" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#facc15" text-anchor="end">$30B</text>
  <rect x="60" y="892" width="960" height="100" rx="14" fill="#1a0f2a" stroke="#c084fc" stroke-width="2"/>
  <rect x="60" y="892" width="8" height="100" rx="4" fill="#c084fc"/>
  <text x="116" y="918" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">SpaceX annualized revenue was said to top $100 billion this</text>
  <text x="116" y="943" font-family="Arial Black,Arial" font-size="21" font-weight="900" fill="#c084fc">December</text>
  <text x="116" y="960" font-family="Arial" font-size="16" fill="#9ca3af">Framed as not a question mark, even if nothing more is added.</text>
  <text x="985" y="942" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#c084fc" text-anchor="end">ARR</text>
  <text x="540" y="1010" font-family="Arial" font-size="16" fill="#6b7280" text-anchor="middle">Watch: 8 countries · $84.5B · 200 GW · 15B miles · Austin $8.33 · World Labs · $30B · December ARR</text>
  <rect x="0" y="1060" width="1080" height="20" fill="url(#flow)" opacity=".4"/>
  <text x="540" y="1073" font-family="Arial" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">investus.kr SRP Chief Investment Officer · NOT FINANCIAL ADVICE</text>
</svg>